<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="lg-line" gradientUnits="userSpaceOnUse" x1="955" y1="240" x2="1130" y2="240">
      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#9b59f5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#f6f8fb"/>
  <text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">SVG 基础图形 · 8 种画笔</text>
  <text x="60" y="104" font-size="14" fill="#6b7785">Level 1 — 全部由标记语言描述，任意放大不失真，一张图 = 一段文本</text>

  <!-- 卡片 1: 圆角矩形 -->
  <g>
    <rect x="60" y="140" width="255" height="250" rx="16" fill="#ffffff" stroke="#e3e8ef"/>
    <rect x="107" y="185" width="160" height="110" rx="12" fill="#4f8ef7" opacity="0.92"/>
    <text x="187" y="342" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">圆角矩形</text>
    <text x="187" y="366" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">&lt;rect rx="12"/&gt;</text>
  </g>

  <!-- 卡片 2: 圆 -->
  <g>
    <rect x="345" y="140" width="255" height="250" rx="16" fill="#ffffff" stroke="#e3e8ef"/>
    <circle cx="472" cy="240" r="58" fill="#f65e5e" opacity="0.92"/>
    <text x="472" y="342" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">圆</text>
    <text x="472" y="366" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">&lt;circle r="58"/&gt;</text>
  </g>

  <!-- 卡片 3: 椭圆 -->
  <g>
    <rect x="630" y="140" width="255" height="250" rx="16" fill="#ffffff" stroke="#e3e8ef"/>
    <ellipse cx="757" cy="240" rx="78" ry="46" fill="#f7b32b" opacity="0.92"/>
    <text x="757" y="342" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">椭圆</text>
    <text x="757" y="366" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">&lt;ellipse rx ry/&gt;</text>
  </g>

  <!-- 卡片 4: 直线 -->
  <g>
    <rect x="915" y="140" width="255" height="250" rx="16" fill="#ffffff" stroke="#e3e8ef"/>
    <line x1="955" y1="240" x2="1130" y2="240" stroke="url(#lg-line)" stroke-width="8" stroke-linecap="round"/>
    <text x="1042" y="342" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">直线 / 渐变描边</text>
    <text x="1042" y="366" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">&lt;line stroke="url(#g)"/&gt;</text>
  </g>

  <!-- 卡片 5: 折线 -->
  <g>
    <rect x="60" y="420" width="255" height="250" rx="16" fill="#ffffff" stroke="#e3e8ef"/>
    <polyline points="95,530 145,485 195,555 245,495 285,525" fill="none" stroke="#2bb3a3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="187" y="622" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">折线（趋势图原型）</text>
    <text x="187" y="646" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">&lt;polyline points="…"/&gt;</text>
  </g>

  <!-- 卡片 6: 多边形 -->
  <g>
    <rect x="345" y="420" width="255" height="250" rx="16" fill="#ffffff" stroke="#e3e8ef"/>
    <polygon points="472,470 528,511 507,577 437,577 416,511" fill="#7bc96f" opacity="0.92"/>
    <text x="472" y="622" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">多边形</text>
    <text x="472" y="646" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">&lt;polygon points="…"/&gt;</text>
  </g>

  <!-- 卡片 7: 贝塞尔曲线 -->
  <g>
    <rect x="630" y="420" width="255" height="250" rx="16" fill="#ffffff" stroke="#e3e8ef"/>
    <path d="M665,540 C700,470 780,470 815,540" fill="none" stroke="#9b59f5" stroke-width="7" stroke-linecap="round"/>
    <circle cx="665" cy="540" r="6" fill="#9b59f5"/>
    <circle cx="815" cy="540" r="6" fill="#9b59f5"/>
    <circle cx="700" cy="470" r="6" fill="#9b59f5" opacity="0.45"/>
    <circle cx="780" cy="470" r="6" fill="#9b59f5" opacity="0.45"/>
    <text x="757" y="622" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">贝塞尔曲线</text>
    <text x="757" y="646" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">&lt;path d="M… C…"/&gt;</text>
  </g>

  <!-- 卡片 8: 圆弧 -->
  <g>
    <rect x="915" y="420" width="255" height="250" rx="16" fill="#ffffff" stroke="#e3e8ef"/>
    <path d="M960,545 A65,65 0 0 1 1090,545" fill="none" stroke="#f7b32b" stroke-width="9" stroke-linecap="round"/>
    <line x1="960" y1="545" x2="1090" y2="545" stroke="#c9d2dd" stroke-width="3" stroke-dasharray="5 6"/>
    <text x="1042" y="622" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">圆弧（A 命令）</text>
    <text x="1042" y="646" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">&lt;path d="M… A…"/&gt;</text>
  </g>

  <text x="60" y="742" font-size="14" fill="#6b7785">这 8 个元素是 SVG 的一万种可能的起点：path 一项就足以描述世界上任何轮廓。</text>
  <text x="60" y="764" font-size="13" fill="#9aa4b1">无 JavaScript · 无 CSS 动画 · 无位图 · 文件大小约 3 KB</text>
</svg>
