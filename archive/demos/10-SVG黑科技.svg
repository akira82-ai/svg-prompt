<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="blobG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a5cf0"/>
      <stop offset="1" stop-color="#3f8ef7"/>
    </linearGradient>
    <radialGradient id="spotRad">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="spot" maskUnits="userSpaceOnUse" x="620" y="110" width="540" height="280">
      <rect x="620" y="110" width="540" height="280" fill="#000000"/>
      <circle r="110" fill="url(#spotRad)">
        <animateMotion dur="10s" repeatCount="indefinite" path="M760,240 L980,190 L1080,320 L820,340 L700,290 Z"/>
      </circle>
    </mask>
    <g id="secretContent">
      <text x="660" y="212" font-size="56" font-weight="800" fill="#ffd166" letter-spacing="6">TOP SECRET</text>
      <text x="662" y="248" font-size="15" fill="#c6d2e4">只有光斑扫过的地方，才被"看见" —— mask 以亮度决定显隐</text>
      <polyline points="660,290 740,290 760,318 880,318 900,290 1120,290" fill="none" stroke="#5ad0c0" stroke-width="2"/>
      <circle cx="700" cy="344" r="4" fill="#f65e5e"/>
      <circle cx="758" cy="344" r="4" fill="#f7b32b"/>
      <circle cx="816" cy="344" r="4" fill="#3ecf8e"/>
      <circle cx="874" cy="344" r="4" fill="#5b9dff"/>
      <rect x="940" y="312" width="170" height="44" rx="8" fill="none" stroke="#c98ef7"/>
      <text x="1025" y="339" font-size="13" fill="#c98ef7" text-anchor="middle">机密数据 · 001</text>
    </g>
    <path id="ringP" d="M330,595 m-88,0 a88,88 0 1,1 176,0 a88,88 0 1,1 -176,0"/>
    <path id="orbitBlob" d="M330,255 m-115,0 a115,55 0 1,0 230,0 a115,55 0 1,0 -230,0"/>
  </defs>

  <rect width="1200" height="800" fill="#0b101d"/>
  <text x="60" y="64" font-size="28" font-weight="700" fill="#e8eef7">SVG 黑科技四连 — 形变 · 聚光灯 · 文字骑路径 · 等距伪 3D</text>
  <text x="60" y="92" font-size="14" fill="#8fa0b8">Level 6 — 四个"机制级"能力：X 上那些纯代码海报与生成式艺术，原料就是它们 —— 也全部可以被 Agent 直接手写</text>

  <!-- P1 路径形变 -->
  <g>
    <rect x="60" y="110" width="540" height="280" rx="14" fill="#0e1524" stroke="#22304d"/>
    <text x="84" y="146" font-size="18" font-weight="700" fill="#e8eef7">路径形变（Path Morphing）</text>
    <path fill="url(#blobG)" opacity="0.92"
      d="M330,185 C374,185 400,211 400,255 C400,299 374,325 330,325 C286,325 260,299 260,255 C260,211 286,185 330,185 Z">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M330,185 C374,185 400,211 400,255 C400,299 374,325 330,325 C286,325 260,299 260,255 C260,211 286,185 330,185 Z;
                M330,190 C384,188 402,206 400,255 C398,304 384,322 330,325 C276,328 258,304 260,255 C262,206 276,192 330,190 Z;
                M330,182 C380,186 408,214 402,258 C396,302 372,322 330,328 C288,334 262,300 258,252 C254,204 280,178 330,182 Z;
                M330,185 C374,185 400,211 400,255 C400,299 374,325 330,325 C286,325 260,299 260,255 C260,211 286,185 330,185 Z"/>
    </path>
    <circle r="4" fill="#ffd166">
      <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#orbitBlob"/></animateMotion>
    </circle>
    <circle r="4" fill="#5ad0c0">
      <animateMotion dur="6s" begin="-3s" repeatCount="indefinite"><mpath href="#orbitBlob"/></animateMotion>
    </circle>
    <text x="84" y="366" font-size="11.5" fill="#6f84a8" font-family="SFMono-Regular, Menlo, monospace">&lt;animate attributeName="d"&gt; — 要求两条路径"结构相同"，即可平滑变形</text>
  </g>

  <!-- P2 聚光灯 -->
  <g>
    <rect x="620" y="110" width="540" height="280" rx="14" fill="#0e1524" stroke="#22304d"/>
    <text x="644" y="146" font-size="18" font-weight="700" fill="#e8eef7">聚光灯（mask + animateMotion）</text>
    <use href="#secretContent" opacity="0.12"/>
    <g mask="url(#spot)">
      <use href="#secretContent"/>
    </g>
    <text x="644" y="376" font-size="11.5" fill="#6f84a8" font-family="SFMono-Regular, Menlo, monospace">mask 白=显示 黑=隐藏；光斑 = 径向渐变圆沿闭合路径巡游</text>
  </g>

  <!-- P3 文字骑路径 -->
  <g>
    <rect x="60" y="430" width="540" height="280" rx="14" fill="#0e1524" stroke="#22304d"/>
    <text x="84" y="466" font-size="18" font-weight="700" fill="#e8eef7">文字骑路径（textPath）</text>
    <text x="84" y="488" font-size="11.5" fill="#6f84a8" font-family="SFMono-Regular, Menlo, monospace">&lt;textPath href="#ring"&gt; + animateTransform 旋转；文字超出路径长度会无缝裁切</text>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 330 595" to="360 330 595" dur="24s" repeatCount="indefinite"/>
      <text font-size="15" fill="#c6d2e4" letter-spacing="2">
        <textPath href="#ringP">SVG · SCALABLE VECTOR GRAPHICS · 矢量图形 · 无限缩放 · CREATIVE CODING · GENERATIVE POSTER ·</textPath>
      </text>
    </g>
    <circle cx="330" cy="595" r="44" fill="#141d31" stroke="#2d3f63"/>
    <text x="330" y="592" font-size="19" font-weight="800" fill="#e8eef7" text-anchor="middle">SVG</text>
    <text x="330" y="610" font-size="9" fill="#6f84a8" text-anchor="middle" letter-spacing="2">TYPOGRAPHY</text>
  </g>

  <!-- P4 等距伪 3D -->
  <g>
    <rect x="620" y="430" width="540" height="280" rx="14" fill="#0e1524" stroke="#22304d"/>
    <text x="644" y="466" font-size="18" font-weight="700" fill="#e8eef7">等距伪 3D（Isometric）</text>
    <text x="644" y="488" font-size="11.5" fill="#6f84a8" font-family="SFMono-Regular, Menlo, monospace">顶/左/右三个面 × 三档明度 + 呼吸浮动 —— 没有任何 3D 引擎</text>
    <g stroke="#16213a" stroke-width="1">
      <line x1="640" y1="480" x2="1000" y2="688"/>
      <line x1="780" y1="430" x2="1140" y2="638"/>
      <line x1="640" y1="660" x2="1000" y2="452"/>
      <line x1="840" y1="660" x2="1140" y2="487"/>
    </g>
    <ellipse cx="800" cy="648" rx="52" ry="9" fill="#000000" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.15;0.35" dur="3.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="912" cy="582" rx="38" ry="7" fill="#000000" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.15;0.35" dur="4.1s" begin="-1.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1000" cy="672" rx="45" ry="8" fill="#000000" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.15;0.35" dur="3.6s" begin="-2s" repeatCount="indefinite"/>
    </ellipse>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="3.2s" repeatCount="indefinite"/>
      <polygon points="800,526 847,553 800,580 753,553" fill="#8ec5ff"/>
      <polygon points="753,553 800,580 800,634 753,607" fill="#4a94f8"/>
      <polygon points="800,580 847,553 847,607 800,634" fill="#2b5fc0"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="4.1s" begin="-1.2s" repeatCount="indefinite"/>
      <polygon points="912,494 945,513 912,532 879,513" fill="#cbaeff"/>
      <polygon points="879,513 912,532 912,570 879,551" fill="#9b6cf5"/>
      <polygon points="912,532 945,513 945,551 912,570" fill="#6a3fd0"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="3.6s" begin="-2s" repeatCount="indefinite"/>
      <polygon points="1000,566 1040,589 1000,612 960,589" fill="#ffcf7a"/>
      <polygon points="960,589 1000,612 1000,658 960,635" fill="#f7a23b"/>
      <polygon points="1000,612 1040,589 1040,635 1000,658" fill="#c77714"/>
    </g>
  </g>

  <text x="60" y="756" font-size="14" fill="#c6d2e4">到此为止，这套演示覆盖了 SVG 的主干能力：图形 → 渐变 → 纹理 → 复杂布局 → 三层动效 → 数据可视化 → 机制级黑科技。</text>
  <text x="60" y="778" font-size="12.5" fill="#5b6b8a">剩下的只是组合 —— 把这些"机制"写进 Agent 的技能里，它就能用纯文本拼出海报、图表、架构图和会动的 Keynote。</text>
</svg>
