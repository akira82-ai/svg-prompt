<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="flameG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b32b"/>
      <stop offset="1" stop-color="#f65e5e"/>
    </linearGradient>
  </defs>
  <style>
    .st {
      fill: none;
      stroke: #2b3a55;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 7s ease-in-out infinite;
    }
    .d1 { animation-delay: 0.2s; }
    .d2 { animation-delay: 0.9s; }
    .d3 { animation-delay: 1.6s; }
    .d4 { animation-delay: 2.3s; }
    .d5 { animation-delay: 3.0s; }
    @keyframes draw {
      0%   { stroke-dashoffset: 1; }
      28%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    .fillIn {
      opacity: 0;
      animation: pop 7s linear infinite;
      animation-delay: 4.6s;
      animation-fill-mode: both;
    }
    @keyframes pop {
      0%   { opacity: 0; }
      10%  { opacity: 1; }
      100% { opacity: 1; }
    }
    .code { font-family: SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  </style>

  <rect width="1000" height="700" fill="#f6f8fb"/>
  <text x="60" y="64" font-size="28" font-weight="700" fill="#1c2733">描边动画 — SVG 会"自己画画"</text>
  <text x="60" y="92" font-size="14" fill="#6b7785">Level 5a — stroke-dasharray + dashoffset 补间，线稿逐笔绘出后上色，7 秒一循环</text>

  <!-- 画布区 -->
  <rect x="60" y="130" width="480" height="520" rx="18" fill="#ffffff" stroke="#e3e8ef"/>
  <circle cx="300" cy="390" r="170" fill="none" stroke="#c9d2dd" stroke-width="2" stroke-dasharray="4 9"/>

  <!-- 上色层 -->
  <g class="fillIn">
    <path d="M300,230 C338,268 348,350 328,450 L272,450 C252,350 262,268 300,230 Z" fill="#dfe9fb"/>
    <circle cx="300" cy="330" r="26" fill="#9cc2ff"/>
    <path d="M272,452 C254,468 244,490 240,512 L272,492 Z" fill="#f7a23b"/>
    <path d="M328,452 C346,468 356,490 360,512 L328,492 Z" fill="#f7a23b"/>
    <path d="M300,486 C288,510 292,528 300,552 C308,528 312,510 300,486 Z" fill="url(#flameG)"/>
  </g>

  <!-- 描边层 -->
  <g>
    <path class="st d1" pathLength="1" d="M300,230 C338,268 348,350 328,450 L272,450 C252,350 262,268 300,230 Z"/>
    <circle class="st d2" pathLength="1" cx="300" cy="330" r="26"/>
    <path class="st d3" pathLength="1" d="M272,452 C254,468 244,490 240,512 L272,492 Z"/>
    <path class="st d4" pathLength="1" d="M328,452 C346,468 356,490 360,512 L328,492 Z"/>
    <path class="st d5" pathLength="1" d="M300,486 C288,510 292,528 300,552 C308,528 312,510 300,486 Z"/>
  </g>
  <text x="300" y="632" font-size="13" fill="#8a94a3" text-anchor="middle">机身 → 舷窗 → 左尾翼 → 右尾翼 → 火焰，逐笔排队绘制</text>

  <!-- 代码卡片 -->
  <rect x="580" y="130" width="360" height="356" rx="14" fill="#101828"/>
  <circle cx="606" cy="156" r="5" fill="#f65e5e"/>
  <circle cx="626" cy="156" r="5" fill="#f7b32b"/>
  <circle cx="646" cy="156" r="5" fill="#3ecf8e"/>
  <text x="580" y="196" class="code" fill="#9fb3d1">  <tspan fill="#7ee0c0">&lt;path</tspan> d="M300,230 C338,268 …"</text>
  <text x="580" y="220" class="code" fill="#9fb3d1">        <tspan fill="#f7b32b">pathLength="1"</tspan></text>
  <text x="580" y="244" class="code" fill="#9fb3d1">        class="draw" <tspan fill="#7ee0c0">/&gt;</tspan></text>
  <text x="580" y="284" class="code" fill="#9fb3d1">  .draw {</text>
  <text x="580" y="308" class="code" fill="#9fb3d1">    stroke-dasharray: <tspan fill="#f7b32b">1</tspan>;</text>
  <text x="580" y="332" class="code" fill="#9fb3d1">    stroke-dashoffset: <tspan fill="#f7b32b">1</tspan>;</text>
  <text x="580" y="356" class="code" fill="#9fb3d1">    animation: draw 7s infinite;</text>
  <text x="580" y="380" class="code" fill="#9fb3d1">  }</text>
  <text x="580" y="420" class="code" fill="#9fb3d1">  @keyframes draw {</text>
  <text x="580" y="444" class="code" fill="#9fb3d1">    to { stroke-dashoffset: <tspan fill="#f7b32b">0</tspan>; }</text>
  <text x="580" y="468" class="code" fill="#9fb3d1">  }</text>

  <text x="580" y="514" font-size="13.5" fill="#1c2733" font-weight="600">三个关键点：</text>
  <text x="580" y="540" font-size="13" fill="#44506a">① pathLength="1" 把任意路径归一化，免算长度</text>
  <text x="580" y="564" font-size="13" fill="#44506a">② dasharray=1，dashoffset 1 → 0 = 一笔画完</text>
  <text x="580" y="588" font-size="13" fill="#44506a">③ 多元素用 animation-delay 排队 = "分笔作画"</text>
  <text x="580" y="618" font-size="13" fill="#6b7785">任何 logo、签名、地图路线、数学公式</text>
  <text x="580" y="640" font-size="13" fill="#6b7785">都可以套这个模板，10 行 CSS 搞定。</text>

  <text x="60" y="680" font-size="12.5" fill="#9aa4b1">纯 SVG + 内嵌 CSS，保存为 .svg 文件单发也有效果 —— 不依赖任何 JS。</text>
</svg>
