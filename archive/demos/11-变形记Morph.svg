<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="geoG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bb3a3"/>
      <stop offset="1" stop-color="#3f8ef7"/>
    </linearGradient>
    <linearGradient id="bloomyG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b6cf5"/>
      <stop offset="1" stop-color="#e65cc7"/>
    </linearGradient>
    <linearGradient id="penG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff8a8a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#0b101d"/>
  <text x="60" y="64" font-size="28" font-weight="700" fill="#e8eef7">变形记 — 路径 Morphing：方生圆 · 圆化星 · B 化 W</text>
  <text x="60" y="92" font-size="14" fill="#8fa0b8">Level 6 — 一个 d 属性在两条"结构相同"的路径之间插值：锚点数一致，直线 = 控制点共线的退化贝塞尔 —— 这就是液态 Logo 的原理</text>

  <!-- P1 几何三态：正方形 → 圆 → 菱形 -->
  <g>
    <rect x="60" y="110" width="540" height="280" rx="14" fill="#0e1524" stroke="#22304d"/>
    <text x="84" y="146" font-size="18" font-weight="700" fill="#e8eef7">几何三态：方 ⇄ 圆 ⇄ 菱</text>
    <path fill="url(#geoG)" opacity="0.92"
      d="M330,190 C350,190 370,190 390,190 C390,210 390,230 390,250 C390,270 390,290 390,310 C370,310 350,310 330,310 C310,310 290,310 270,310 C270,290 270,270 270,250 C270,230 270,210 270,190 C290,190 310,190 330,190 Z">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="M330,190 C350,190 370,190 390,190 C390,210 390,230 390,250 C390,270 390,290 390,310 C370,310 350,310 330,310 C310,310 290,310 270,310 C270,290 270,270 270,250 C270,230 270,210 270,190 C290,190 310,190 330,190 Z;
                M330,165 C352.5,165 374.1,174.1 390,190 C405.9,205.9 415,227.5 415,250 C415,272.5 405.9,294.1 390,310 C374.1,325.9 352.5,335 330,335 C307.5,335 285.9,325.9 270,310 C254.1,294.1 245,272.5 245,250 C245,227.5 254.1,205.9 270,190 C285.9,174.1 307.5,165 330,165 Z;
                M330,165 C344.2,179.2 358.3,193.3 372.5,207.5 C386.7,221.7 400.8,235.8 415,250 C400.8,264.2 386.7,278.3 372.5,292.5 C358.3,306.7 344.2,320.8 330,335 C315.8,320.8 301.7,306.7 287.5,292.5 C273.3,278.3 259.2,264.2 245,250 C259.2,235.8 273.3,221.7 287.5,207.5 C301.7,193.3 315.8,179.2 330,165 Z;
                M330,190 C350,190 370,190 390,190 C390,210 390,230 390,250 C390,270 390,290 390,310 C370,310 350,310 330,310 C310,310 290,310 270,310 C270,290 270,270 270,250 C270,230 270,210 270,190 C290,190 310,190 330,190 Z"/>
    </path>
    <g fill="none" stroke="#3d5a8a" stroke-width="1.5">
      <rect x="84" y="330" width="24" height="24" rx="2"/>
      <circle cx="140" cy="342" r="12"/>
      <polygon points="188,330 200,342 188,354 176,342"/>
    </g>
    <text x="84" y="366" font-size="11.5" fill="#6f84a8" font-family="SFMono-Regular, Menlo, monospace">8 锚点骨架 × 3 组坐标：直线态的控制点全落在边上（共线）</text>
  </g>

  <!-- P2 图形开花：圆 → 五角星 → 爱心 -->
  <g>
    <rect x="620" y="110" width="540" height="280" rx="14" fill="#0e1524" stroke="#22304d"/>
    <text x="644" y="146" font-size="18" font-weight="700" fill="#e8eef7">图形开花：圆 → 五角星 → 爱心</text>
    <path fill="url(#bloomyG)" opacity="0.92"
      d="M890,160 C909,160 927.5,166 942.9,177.2 C958.3,188.4 969.7,204.1 975.6,222.2 C981.5,240.3 981.5,259.7 975.6,277.8 C969.7,295.9 958.3,311.6 942.9,322.8 C927.5,334 909,340 890,340 C871,340 852.5,334 837.1,322.8 C821.7,311.6 810.3,295.9 804.4,277.8 C798.5,259.7 798.5,240.3 804.4,222.2 C810.3,204.1 821.7,188.4 837.1,177.2 C852.5,166 871,160 890,160 Z">
      <animate attributeName="d" dur="12s" repeatCount="indefinite"
        values="M890,160 C909,160 927.5,166 942.9,177.2 C958.3,188.4 969.7,204.1 975.6,222.2 C981.5,240.3 981.5,259.7 975.6,277.8 C969.7,295.9 958.3,311.6 942.9,322.8 C927.5,334 909,340 890,340 C871,340 852.5,334 837.1,322.8 C821.7,311.6 810.3,295.9 804.4,277.8 C798.5,259.7 798.5,240.3 804.4,222.2 C810.3,204.1 821.7,188.4 837.1,177.2 C852.5,166 871,160 890,160 Z;
                M890,160 C897.4,179.8 904.9,199.5 912.3,219.3 C933.4,220.3 954.5,221.2 975.6,222.2 C959.1,235.4 942.6,248.5 926.1,261.7 C931.7,282.1 937.3,302.4 942.9,322.8 C925.3,311.2 907.6,299.6 890,288 C872.4,299.6 854.7,311.2 837.1,322.8 C842.7,302.4 848.3,282.1 853.9,261.7 C837.4,248.5 820.9,235.4 804.4,222.2 C825.5,221.2 846.6,220.3 867.7,219.3 C875.1,199.5 882.6,179.8 890,160 Z;
                M890,205 C900,190 916,172 935,172 C952,172 968,188 968,210 C968,232 968,236 968,258 C968,290 940,300 920,318 C905,331 897,340 890,345 C883,340 875,331 860,318 C840,300 812,290 812,258 C812,236 812,232 812,210 C812,188 828,172 845,172 C862,172 880,192 890,205 Z;
                M890,160 C909,160 927.5,166 942.9,177.2 C958.3,188.4 969.7,204.1 975.6,222.2 C981.5,240.3 981.5,259.7 975.6,277.8 C969.7,295.9 958.3,311.6 942.9,322.8 C927.5,334 909,340 890,340 C871,340 852.5,334 837.1,322.8 C821.7,311.6 810.3,295.9 804.4,277.8 C798.5,259.7 798.5,240.3 804.4,222.2 C810.3,204.1 821.7,188.4 837.1,177.2 C852.5,166 871,160 890,160 Z"/>
    </path>
    <g fill="none" stroke="#3d5a8a" stroke-width="1.5">
      <circle cx="656" cy="342" r="12"/>
      <path d="M706,328 L710.5,336.5 L720,338 L713,344.5 L714.5,354 L706,349.5 L697.5,354 L699,344.5 L692,338 L701.5,336.5 Z"/>
      <path d="M756,354 C748,347 744,341 744,336 C744,331 748,328 752,330 C754,331 755,333 756,335 C757,333 758,331 760,330 C764,328 768,331 768,336 C768,341 764,347 756,354 Z"/>
    </g>
    <text x="644" y="366" font-size="11.5" fill="#6f84a8" font-family="SFMono-Regular, Menlo, monospace">同一副 10 锚点骨架：星 = 内锚点收到 r=38，爱心 = 锚点按心形重排</text>
  </g>

  <!-- P3 字母变形：B ⇄ W -->
  <g>
    <rect x="60" y="430" width="540" height="280" rx="14" fill="#0e1524" stroke="#22304d"/>
    <text x="84" y="466" font-size="18" font-weight="700" fill="#e8eef7">字母变形：B ⇄ W（单线手写体）</text>
    <path fill="none" stroke="url(#penG)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"
      d="M280,500 C280,525 280,550 280,575 C280,600 280,625 280,650 C335,650 352,635 352,612 C352,589 335,575 280,575 C330,575 348,560 348,538 C348,516 330,500 280,500">
      <animate attributeName="d" dur="8s" repeatCount="indefinite" keyTimes="0;0.32;0.5;0.82;1"
        values="M280,500 C280,525 280,550 280,575 C280,600 280,625 280,650 C335,650 352,635 352,612 C352,589 335,575 280,575 C330,575 348,560 348,538 C348,516 330,500 280,500;
                M280,500 C280,525 280,550 280,575 C280,600 280,625 280,650 C335,650 352,635 352,612 C352,589 335,575 280,575 C330,575 348,560 348,538 C348,516 330,500 280,500;
                M280,500 C285,525 290,550 296,575 C302,600 307,625 312,650 C322,613 331,577 340,540 C349,577 358,613 368,650 C376,625 385,600 394,575 C400,550 410,525 420,500;
                M280,500 C285,525 290,550 296,575 C302,600 307,625 312,650 C322,613 331,577 340,540 C349,577 358,613 368,650 C376,625 385,600 394,575 C400,550 410,525 420,500;
                M280,500 C280,525 280,550 280,575 C280,600 280,625 280,650 C335,650 352,635 352,612 C352,589 335,575 280,575 C330,575 348,560 348,538 C348,516 330,500 280,500"/>
    </path>
    <text x="490" y="580" font-size="13" fill="#5b6b8a" font-family="SFMono-Regular, Menlo, monospace">4 段贝塞尔</text>
    <text x="84" y="686" font-size="11.5" fill="#6f84a8" font-family="SFMono-Regular, Menlo, monospace">B 的"一笔字"骨架（竖 + 两碗）⇄ W 的四折骨架 —— 中间态是"液态"，keyTimes 控制停顿</text>
  </g>

  <!-- P4 状态切换：✓ ⇄ ✗ -->
  <g>
    <rect x="620" y="430" width="540" height="280" rx="14" fill="#0e1524" stroke="#22304d"/>
    <text x="644" y="466" font-size="18" font-weight="700" fill="#e8eef7">状态切换：✓ ⇄ ✗（颜色随形变走）</text>
    <path fill="none" stroke="#3ecf8e" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"
      d="M830,575 C837,582 845,590 852,597 C860,605 867,612 875,620 C884,609 894,598 903,587 C913,576 923,565 932,553 C941,542 951,531 960,520">
      <animate attributeName="d" dur="8s" repeatCount="indefinite" keyTimes="0;0.35;0.5;0.85;1"
        values="M830,575 C837,582 845,590 852,597 C860,605 867,612 875,620 C884,609 894,598 903,587 C913,576 923,565 932,553 C941,542 951,531 960,520;
                M830,575 C837,582 845,590 852,597 C860,605 867,612 875,620 C884,609 894,598 903,587 C913,576 923,565 932,553 C941,542 951,531 960,520;
                M820,515 C873,552 918,588 960,625 C937,607 913,588 890,570 C913,552 937,533 960,515 C937,533 913,552 890,570 C857,588 833,607 820,625;
                M820,515 C873,552 918,588 960,625 C937,607 913,588 890,570 C913,552 937,533 960,515 C937,533 913,552 890,570 C857,588 833,607 820,625;
                M830,575 C837,582 845,590 852,597 C860,605 867,612 875,620 C884,609 894,598 903,587 C913,576 923,565 932,553 C941,542 951,531 960,520"/>
      <animate attributeName="stroke" dur="8s" repeatCount="indefinite" keyTimes="0;0.35;0.5;0.85;1"
        values="#3ecf8e;#3ecf8e;#f65e5e;#f65e5e;#3ecf8e"/>
    </path>
    <text x="890" y="664" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#3ecf8e">ALL SYSTEMS GO
      <animate attributeName="opacity" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;0.5;0.85" values="1;0;1"/>
    </text>
    <text x="890" y="664" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#f65e5e" opacity="0">INCIDENT IN PROGRESS
      <animate attributeName="opacity" calcMode="discrete" dur="8s" repeatCount="indefinite" keyTimes="0;0.5;0.85" values="0;1;0"/>
    </text>
    <text x="644" y="686" font-size="11.5" fill="#6f84a8" font-family="SFMono-Regular, Menlo, monospace">勾的短臂补 1 个共线点凑成 3 段；叉用"回描"一笔画出 —— 描边颜色与 keyTimes 同步渐变</text>
  </g>

  <text x="60" y="756" font-size="14" fill="#c6d2e4">这就是液态 Logo、图标切换、点赞爱心爆开的底层原理 —— 全部只是 d 属性在插值，任何中间帧都是合法图形。</text>
  <text x="60" y="778" font-size="12.5" fill="#5b6b8a">工程上常用 flubber / GSAP MorphSVG 自动配平锚点；Agent 手写时的万能技巧：把直线写成"控制点共线的退化贝塞尔"，锚点数就永远对得上。</text>
</svg>
