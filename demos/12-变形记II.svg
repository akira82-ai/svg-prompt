  <text x="60" y="756" font-size="14" fill="#c6d2e4">变形案例库成型：几何 → 字母 → 单词 → 图标。无论多复杂，步骤都一样：锚点对齐 → 直线垫成共线贝塞尔 → keyTimes 控制节奏。</text>
  <text x="60" y="778" font-size="12.5" fill="#5b6b8a">工程提示：任意两个真实图标互变，用 flubber 的 interpolate() 一行搞定；Agent 裸写时，"共线锚点垫平"就是那把万能钥匙。</text>
</svg>
