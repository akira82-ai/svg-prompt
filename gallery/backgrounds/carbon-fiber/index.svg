<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>碳纤维</title><desc>2×2 斜纹编织单元（24px）用 pattern 平铺满版：每单元四小块明暗交替（亮块 #2a2f3a / 暗块 #10131a），亮块内加一道细高光线</desc><defs><pattern id="cf" width="24" height="24" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="12" height="12" fill="#262b36"/><line x1="0" y1="3" x2="12" y2="3" stroke="#3a4152" stroke-width="1.2"/><rect x="12" y="0" width="12" height="12" fill="#12151c"/><line x1="15" y1="0" x2="15" y2="12" stroke="#3a4152" stroke-width="1.2"/><rect x="0" y="12" width="12" height="12" fill="#12151c"/><line x1="3" y1="12" x2="3" y2="24" stroke="#3a4152" stroke-width="1.2"/><rect x="12" y="12" width="12" height="12" fill="#262b36"/><line x1="12" y1="15" x2="24" y2="15" stroke="#3a4152" stroke-width="1.2"/></pattern><linearGradient id="sheen" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.14"/><stop offset="0.4" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="1200" height="800" fill="url(#cf)"/><rect width="1200" height="800" fill="url(#sheen)"/><rect x="880" y="620" width="260" height="164" rx="14" fill="rgba(13,18,30,0.82)" stroke="rgba(255,255,255,0.14)"/><text x="902" y="660" font-size="15" fill="#e8eef7" text-anchor="start" font-weight="700">碳纤维</text><text x="902" y="694" font-size="12" fill="rgba(232,238,247,0.5)" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">单元</text><text x="1008" y="694" font-size="12" fill="#e8eef7" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">24px 2×2</text><text x="902" y="720" font-size="12" fill="rgba(232,238,247,0.5)" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">编织</text><text x="1008" y="720" font-size="12" fill="#e8eef7" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">斜纹</text><text x="902" y="746" font-size="12" fill="rgba(232,238,247,0.5)" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">底色</text><text x="1008" y="746" font-size="12" fill="#e8eef7" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">#1a1d24</text></svg>