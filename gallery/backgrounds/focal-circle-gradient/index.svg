<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, sans-serif"><title id="title">焦点圆渐变 · 光环与透镜 / Focal Circle Gradients</title><desc id="desc">同一组色标，从点焦点到圆形焦点再到偏心焦点；纯渐变光环，不模拟真实折射。；画面以#0b1628为底，三枚半径188的圆心为(302,500)/(700,500)/(1098,500)；样张区只呈现光环构图，三组参数标题位于y166、样张上方。；三组radialGradient统一gradientUnits=objectBoundingBox，终圆cx=cy=r=0.5；点焦点fr=0、fx=fy=0.5；圆形焦点fr=0.2、fx=fy=0.5；偏心焦点fr=0.2、fx=0.38、fy=0.42。fr=0.2相当于圆直径的20%、终圆半径的40%，不能写成终圆半径的20%。；仅定义一份lens-colors色标，三个渐变通过href复用；offset/color依次为0/#0b1628、0.36/#183c5a、0.64/#4da3b5、0.77/#e6f5e8、0.84/#e6b895、1/#0b1628，明确color-interpolation=sRGB。；fr定义渐变起始圆的半径；起始圆以内用第一个色标，向终圆过渡。亮环来自共用色标的明暗分布，不是fr自带光晕；不额外叠加遮挡圆或模糊滤镜来伪造焦点圆。；三枚渐变自身都是完整圆形，偏心组只是渐变焦点偏移，不变换圆轮廓；所有焦点圆均在终圆内。不加动画、脚本、外部字体和图像，保持img模式下可展示。；标准依据：https://www.w3.org/TR/SVG2/pservers.html#RadialGradientElementFRAttribute；透镜仅指视觉风格，不代表物理光学或光线追踪。</desc><rect x="0" y="0" width="1400" height="900" fill="#111e2d" /><text x="64" y="64" font-size="14" fill="#b5c7d9" text-anchor="start">SURFACE STUDIES / 25</text><text x="64" y="116" font-size="34" fill="#e9f0fa" text-anchor="start">焦点圆渐变 · 光环与透镜</text><text x="1336" y="116" font-size="20" fill="#b5c7d9" text-anchor="end">Focal Circle Gradients</text><defs><clipPath id="stage"><rect x="64" y="190" width="1272" height="620" rx="18"/></clipPath></defs><g clip-path="url(#stage)"></g><text x="302" y="166" font-size="17" fill="#b5c7d9" text-anchor="middle">01 / 点焦点 · fr = 0</text><text x="700" y="166" font-size="17" fill="#b5c7d9" text-anchor="middle">02 / 圆形焦点 · fr = 0.20</text><text x="1098" y="166" font-size="17" fill="#b5c7d9" text-anchor="middle">03 / 偏心焦点 · fx / fy 偏移</text><g clip-path="url(#stage)"><rect x="64" y="190" width="1272" height="620" fill="#0b1628" /><defs><radialGradient id="lens-colors" color-interpolation="sRGB"><stop offset="0" stop-color="#0b1628"/><stop offset=".36" stop-color="#183c5a"/><stop offset=".64" stop-color="#4da3b5"/><stop offset=".77" stop-color="#e6f5e8"/><stop offset=".84" stop-color="#e6b895"/><stop offset="1" stop-color="#0b1628"/></radialGradient></defs><defs><radialGradient id="lens-point" href="#lens-colors" gradientUnits="objectBoundingBox" cx=".5" cy=".5" r=".5" fx="0.5" fy="0.5" fr="0"/></defs><circle cx="302.000" cy="500.000" r="188.000" fill="url(#lens-point)" data-lens="point"/><defs><radialGradient id="lens-circle" href="#lens-colors" gradientUnits="objectBoundingBox" cx=".5" cy=".5" r=".5" fx="0.5" fy="0.5" fr="0.2"/></defs><circle cx="700.000" cy="500.000" r="188.000" fill="url(#lens-circle)" data-lens="circle"/><defs><radialGradient id="lens-offset" href="#lens-colors" gradientUnits="objectBoundingBox" cx=".5" cy=".5" r=".5" fx="0.38" fy="0.42" fr="0.2"/></defs><circle cx="1098.000" cy="500.000" r="188.000" fill="url(#lens-offset)" data-lens="offset"/></g><text x="64" y="856" font-size="16" fill="#b5c7d9" text-anchor="start">同一组色标，从点焦点到圆形焦点再到偏心焦点；纯渐变光环，不模拟真实折射。</text><style>@keyframes drift{50%{transform:translate(0,12px)}}@keyframes shine{50%{opacity:.75}}.drift{animation:drift 10s ease-in-out infinite}.shine{animation:shine 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.drift,.shine{animation:none}}</style></svg>
