<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>木纹</title><desc>把噪声横向压扁拉出年轮——baseFrequency 的两个值就是秘诀</desc><defs><filter id="wood" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="4" seed="7"/><feColorMatrix type="matrix" values="0.66 0 0 0 0.22  0.42 0 0 0 0.12  0.20 0 0 0 0.05  0 0 0 0 1"/></filter></defs><rect width="1200" height="800" fill="#a97c50"/><rect width="1200" height="800" filter="url(#wood)"/><rect x="0" y="210" width="1200" height="3" fill="rgba(60,35,15,0.55)"/><rect x="0" y="470" width="1200" height="3" fill="rgba(60,35,15,0.55)"/><rect x="0" y="700" width="1200" height="3" fill="rgba(60,35,15,0.55)"/><text x="60" y="76" font-size="28" fill="#fff8ee" text-anchor="start" font-weight="700">木纹 Wood Grain</text><text x="60" y="104" font-size="14" fill="rgba(255,248,238,0.85)" text-anchor="start">baseFrequency 的两个值拉开倍率，噪声就被拉成年轮</text><rect x="60" y="560" width="400" height="190" rx="14" fill="rgba(255,255,255,0.94)" stroke="rgba(255,255,255,0.14)"/><text x="82" y="600" font-size="15" fill="#1c2733" text-anchor="start" font-weight="700">参数拆解</text><text x="82" y="634" font-size="12" fill="#8a94a3" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">baseFrequency</text><text x="188" y="634" font-size="12" fill="#1c2733" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">0.012 0.09</text><text x="82" y="660" font-size="12" fill="#8a94a3" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">numOctaves</text><text x="188" y="660" font-size="12" fill="#1c2733" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">4</text><text x="82" y="686" font-size="12" fill="#8a94a3" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">色彩映射</text><text x="188" y="686" font-size="12" fill="#1c2733" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">棕金三通道</text><text x="82" y="712" font-size="12" fill="#8a94a3" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">木板缝</text><text x="188" y="712" font-size="12" fill="#1c2733" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">3 条深色分隔</text></svg>