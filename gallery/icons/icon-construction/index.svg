<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, sans-serif"><title id="title">图标构形与光学校正 / Icon Construction</title><desc id="desc">构形网格是共同起点，最终视觉重量仍需实际尺寸判断。；左侧相机24单位网格放大18倍；2..22为基础安全区，底边可按轮廓校正。右侧搜索y300、收藏y310，120px显示尺寸，收藏相对几何位置下移10px；虚线y360为共同几何中线，示例校正仍需用户测试。</desc><rect width="1400" height="900" fill="#f2f5f9"/><path d="M64 166h1272" stroke="#c8d2df"/><text x="64" y="65" font-size="14" fill="#516478" text-anchor="start">VECTOR SYSTEMS / 01</text><text x="64" y="116" font-size="34" fill="#172b42" text-anchor="start">图标构形与光学校正</text><text x="1336" y="116" font-size="20" fill="#516478" text-anchor="end">Icon Construction</text><defs><symbol id="home" viewBox="0 0 24 24"><path d="M3 10 12 3 21 10 M5 9v12h5v-7h4v7h5V9"/></symbol><symbol id="search" viewBox="0 0 24 24"><path d="M16 16l5 5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0"/></symbol><symbol id="heart" viewBox="0 0 24 24"><path d="M12 21C-2 12 2 1 9 5l3 3 3-3c7-4 11 7-3 16Z"/></symbol><symbol id="bell" viewBox="0 0 24 24"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5Z M10 21h4 M12 2v2"/></symbol><symbol id="user" viewBox="0 0 24 24"><path d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M4 21v-2a8 8 0 0 1 16 0v2"/></symbol><symbol id="mail" viewBox="0 0 24 24"><path d="M3 5h18v14H3Z M3 6l9 7 9-7"/></symbol><symbol id="camera" viewBox="0 0 24 24"><path d="M3 7h5l2-3h4l2 3h5v14H3Z M16 14a4 4 0 1 1-8 0 4 4 0 0 1 8 0"/></symbol><symbol id="settings" viewBox="0 0 24 24"><path d="M3 7h18 M3 17h18 M8 4v6 M16 14v6"/></symbol><symbol id="check" viewBox="0 0 24 24"><path d="M5 12l5 5L20 6"/></symbol><symbol id="close" viewBox="0 0 24 24"><path d="M5 5l14 14 M19 5 5 19"/></symbol><symbol id="warning" viewBox="0 0 24 24"><path d="M12 3 22 21H2Z M12 9v5 M12 17v.2"/></symbol><symbol id="info" viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0 M12 11v6 M12 7v.2"/></symbol><symbol id="clock" viewBox="0 0 24 2