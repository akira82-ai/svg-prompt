<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">路线与换乘拓扑图</title><desc id="desc">站间距为排版；交叉线路只有标记站点才表示换乘。模拟业务数据 · 空间示意不代表实际服务或运营结果</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#f3f5f7" /><text x="72.000" y="55.000" font-size="14" fill="#596e81" text-anchor="start" font-weight="400">SVG / SPATIAL ATLAS</text><line x1="72.000" y1="73.000" x2="1328.000" y2="73.000" stroke="#d9e2ea" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#172a3a" text-anchor="start" font-weight="700">路线与换乘拓扑图</text><text x="72.000" y="160.000" font-size="18" fill="#596e81" text-anchor="start" font-weight="400">虚构园区交通 / 站序与换乘，不编码距离</text><rect x="72.000" y="183.000" width="1256.000" height="51.000" rx="5" fill="#e6edf3" /><text x="92.000" y="215.000" font-size="18" fill="#172a3a" text-anchor="start" font-weight="600">站间距为排版；交叉线路只有标记站点才表示换乘</text><line x1="72.000" y1="845.000" x2="1328.000" y2="845.000" stroke="#d9e2ea" stroke-width="1" /><text x="72.000" y="877.000" font-size="14" fill="#596e81" text-anchor="start" font-weight="400">模拟业务数据 · 空间示意不代表实际服务或运营结果</text><text x="1328.000" y="877.000" font-size="14" fill="#596e81" text-anchor="end" font-weight="400">SVG-PROMPT</text><path d="M 150.000 520.000 L 340.000 520.000 L 550.000 520.000 L 760.000 520.000 L 1020.000 520.000" fill="none" stroke="#3686d9" stroke-width="8" data-route="A"/><path d="M 550.000 300.000 L 550.000 520.000 L 550.000 740.000" fill="none" stroke="#00a887" stroke-width="8" data-route="B"/><circle cx="150.000" cy="520.000" r="7.000" fill="#f3f5f7" stroke="#3686d9" stroke-width="3" data-station="A1"/><text x="150.000" y="492.000" font-size="17" fill="#172a3a" text-anchor="middle" font-weight="400">A1</text><circle cx="340.000" cy="520.000" r="7.000" fill="#f3f5f7" stroke="#3686d9" stroke-width="3" data-station="A2"/><text x="340.000" y="492.000" font-size="17" fill="#172a3a" text-anchor="middle" font-weight="400">A2</text><circle cx="550.000" cy="520.000" r="12.000" fill="#f3f5f7" stroke="#172a3a" stroke-width="3" data-station="X"/><text x="550.000" y="492.000" font-size="17" fill="#172a3a" text-anchor="middle" font-weight="400">中央换乘 X</text><circle cx="760.000" cy="520.000" r="7.000" fill="#f3f5f7" stroke="#3686d9" stroke-width="3" data-station="A4"/><text x="760.000" y="492.000" font-size="17" fill="#172a3a" text-anchor="middle" font-weight="400">A4</text><circle cx="1020.000" cy="520.000" r="7.000" fill="#f3f5f7" stroke="#3686d9" stroke-width="3" data-station="A5"/><text x="1020.000" y="492.000" font-size="17" fill="#172a3a" text-anchor="middle" font-weight="400">A5</text><circle cx="550.000" cy="300.000" r="7.000" fill="#f3f5f7" stroke="#00a887" stroke-width="3" data-station="B1"/><text x="550.000" y="340.000" font-size="17" fill="#172a3a" text-anchor="middle" font-weight="400">B1</text><circle cx="550.000" cy="740.000" r="7.000" fill="#f3f5f7" stroke="#00a887" stroke-width="3" data-station="B3"/><text x="550.000" y="712.000" font-size="17" fill="#172a3a" text-anchor="middle" font-weight="400">B3</text><text x="810.000" y="680.000" font-size="17" fill="#596e81" text-anchor="start" font-weight="400">A 线：A1 → A2 → X → A4 → A5</text><text x="810.000" y="715.000" font-size="17" fill="#596e81" text-anchor="start" font-weight="400">B 线：B1 → X → B3</text><text x="810.000" y="750.000" font-size="17" fill="#596e81" text-anchor="start" font-weight="400">仅 X 为换乘站</text><text x="810.000" y="785.000" font-size="17" fill="#596e81" text-anchor="start" font-weight="400">非真实园区 / 无比例尺</text></svg>
