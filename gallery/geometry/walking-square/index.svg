<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>步行方块</title><desc>迈步前进循环</desc><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">步行方块</text><text x="60" y="104" font-size="14" fill="#6b7785">迈步前进循环</text><g transform="translate(600,400) scale(1.4) translate(-970,-460)"><g><rect x="800" y="150" width="340" height="500" rx="16" fill="#ffffff" stroke="#e3e8ef"/><line x1="830" y1="560" x2="1110" y2="560" stroke="#e3e8ef" stroke-width="3"/><g><rect x="920" y="440" width="70" height="70" rx="14" fill="#9b59f5"><animate attributeName="y" values="440;432;440;432;440" dur="0.7s" repeatCount="indefinite"/></rect><circle cx="938" cy="522" r="10" fill="#1c2733"><animate attributeName="cy" values="522;536;522" dur="0.35s" repeatCount="indefinite"/></circle><circle cx="972" cy="536" r="10" fill="#1c2733"><animate attributeName="cy" values="536;522;536" dur="0.35s" repeatCount="indefinite"/></circle><circle cx="955" cy="466" r="6" fill="#fff"/><animateMotion dur="2.6s" repeatCount="indefinite" path="M 0 0 H 120"/></g><text x="970" y="594" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">步行中</text><text x="970" y="618" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">walking</text></g></g></svg>