<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>矩形 rect</title><desc>一行标记的矩形与它的圆角谱系：从直角到胶囊形</desc><rect width="1200" height="800" fill="#f6f8fb" /><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">矩形 &lt;rect&gt;</text><text x="60" y="104" font-size="14" fill="#6b7785">一行标记的矩形——width / height 定大小，rx 把直角磨圆</text><g><rect x="60" y="140" width="255" height="250" rx="16" fill="#ffffff" stroke="#e3e8ef" /><rect x="122" y="200" width="130" height="130" rx="0" fill="#4f8ef7" opacity="0.92" /><text x="187" y="345" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">rx=0</text><text x="187" y="368" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">&lt;rect/&gt;</text></g><g><rect x="335" y="140" width="255" height="250" rx="16" fill="#ffffff" stroke="#e3e8ef" /><rect x="397" y="200" width="130" height="130" rx="16" fill="#4f8ef7" opacity="0.92" /><text x="462" y="345" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">rx=16</text><text x="462" y="368" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">&lt;rect rx="16"/&gt;</text></g><g><rect x="610" y="140" width="255" height="250" rx="16" fill="#ffffff" stroke="#e3e8ef" /><rect x="672" y="200" width="130" height="130" rx="40" fill="#4f8ef7" opacity="0.92" /><text x="737" y="345" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">rx=40</text><text x="737" y="368" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">&lt;rect rx="40"/&gt;</text></g><g><rect x="885" y="140" width="255" height="250" rx="16" fill="#ffffff" stroke="#e3e8ef" /><rect x="912" y="225" width="200" height="80" rx="40" fill="#4f8ef7" opacity="0.92" ry="40" /><text x="1012" y="345" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">rx=ry=40 胶囊</text><text x="1012" y="368" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">&lt;rect rx="40"/&gt;</text></g><g><rect x="60" y="420" width="1080" height="290" rx="16" fill="#ffffff" stroke="#e3e8ef" /><rect x="200" y="470" width="420" height="190" rx="28" fill="#4f8ef7" opacity="0.12" stroke="#4f8ef7" stroke-width="2" /><text x="410" y="460" font-size="13" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">width="420"</text><text x="180" y="570" font-size="13" fill="#6b7785" text-anchor="end" font-family="SFMono-Regular, Menlo, monospace">height="190"</text><line x1="200" y1="685" x2="620" y2="685" stroke="#4f8ef7" stroke-dasharray="4 4" /><text x="410" y="706" font-size="13" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">rx="28"</text><text x="760" y="530" font-size="16" fill="#1c2733">width / height 定大小</text><text x="760" y="558" font-size="16" fill="#1c2733">rx 把四个角一起磨圆</text><text x="760" y="586" font-size="16" fill="#1c2733">rx≤宽/2，ry≤高/2</text></g></svg>