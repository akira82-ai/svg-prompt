<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>相减与挖洞</title><desc>圆环、月牙、透镜——两个圆的三种布尔关系与三种实现</desc><defs><mask id="moonCutout" maskUnits="userSpaceOnUse" x="480" y="180" width="200" height="180"><rect x="480" y="180" width="200" height="180" fill="white" /><circle cx="592" cy="265" r="72" fill="black" /></mask></defs><rect width="1200" height="800" fill="#f6f8fb" /><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">相减与挖洞</text><text x="60" y="104" font-size="14" fill="#6b7785">两个圆的三种关系：挖洞、相减、相交——三种实现方法</text><g><rect x="60" y="140" width="340" height="380" rx="16" fill="#ffffff" stroke="#e3e8ef" /><path d="M 315 270 A 85 85 0 1 0 145 270 A 85 85 0 1 0 315 270 Z M 272 270 A 42 42 0 1 1 188 270 A 42 42 0 1 1 272 270 Z" fill="#38b8c9" fill-rule="evenodd" /><circle cx="230" cy="270" r="28" fill="none" stroke="#6b7785" stroke-width="2" stroke-dasharray="5 5" /><text x="230" y="275" font-size="12" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">挖洞</text><text x="230" y="420" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">圆环 · 挖洞</text><text x="230" y="446" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">fill-rule="evenodd"</text></g><g><rect x="430" y="140" width="340" height="380" rx="16" fill="#ffffff" stroke="#e3e8ef" /><circle cx="560" cy="265" r="72" fill="#38b8c9" mask="url(#moonCutout)" /><circle cx="592" cy="265" r="72" fill="none" stroke="#6b7785" stroke-dasharray="4 4" opacity="0.5" /><text x="600" y="420" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">月牙 · 相减</text><text x="600" y="446" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">大圆 − 偏移圆</text></g><g><rect x="800" y="140" width="340" height="380" rx="16" fill="#ffffff" stroke="#e3e8ef" /><path d="M 975 202.1 A 72 72 0 0 1 975 327.9 A 72 72 0 0 1 975 202.1 Z" fill="#38b8c9" /><circle cx="940" cy="265" r="72" fill="none" stroke="#6b7785" stroke-dasharray="4 4" opacity="0.5" /><circle cx="1010" cy="265" r="72" fill="none" stroke="#6b7785" stroke-dasharray="4 4" opacity="0.5" /><text x="970" y="420" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">透镜 · 相交</text><text x="970" y="446" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">两圆的公共区域</text></g><g><rect x="60" y="550" width="1080" height="170" rx="16" fill="#ffffff" stroke="#e3e8ef" /><text x="120" y="620" font-size="16" fill="#1c2733">evenodd：同一形状里内外绕数相抵 → 挖洞，环形进度与图标的经典做法</text><text x="120" y="650" font-size="16" fill="#1c2733">相减：白底黑圆 mask 真正挖空；虚线只作参考</text><text x="120" y="680" font-size="16" fill="#1c2733">相交：交点坐标可由两圆圆心与半径算出，两段圆弧首尾相接即透镜</text></g></svg>