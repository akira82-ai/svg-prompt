<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">工具提示</title><desc id="desc">悬浮提示靠近触发按钮，含方向三角；重要操作与错误不只放在提示气泡中。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >工具提示</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >导航与检索 / 产品场景与状态设计</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="80.000" y="230.000" width="608.000" height="570.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><rect x="712.000" y="230.000" width="608.000" height="570.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="108.000" y="278.000" font-size="22" fill="#1d2e46" text-anchor="start" font-weight="600" >文字辅助说明</text><rect x="270.000" y="500.000" width="190.000" height="42.000" rx="8" fill="#ffffff" stroke="#dce4ee" data-control="button" data-state="default"/><text x="365.000" y="526.000" font-size="15" fill="#1d2e46" text-anchor="middle" font-weight="600" >导出报告</text><rect x="195.000" y="395.000" width="378.000" height="70.000" rx="8" fill="#1d2e46" /><text x="384.000" y="437.000" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" >将当前筛选结果导出为 CSV</text><path d="M376.0 465.0 L384.0 475.0 L392.0 465.0 Z" fill="#1d2e46"/><text x="108.000" y="660.000" font-size="17" fill="#596b82" text-anchor="start" font-weight="400" >帮助信息不承载必须完成的操作</text><text x="740.000" y="278.000" font-size="22" fill="#1d2e46" text-anchor="start" font-weight="600" >快捷键辅助说明</text><rect x="902.000" y="500.000" width="190.000" height="42.000" rx="8" fill="#ffffff" stroke="#dce4ee" data-control="button" data-state="default"/><text x="997.000" y="526.000" font-size="15" fill="#1d2e46" text-anchor="middle" font-weight="600" >搜索项目</text><rect x="827.000" y="395.000" width="378.000" height="70.000" rx="8" fill="#1d2e46" /><text x="1016.000" y="437.000" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" >按 ⌘ K 打开全局搜索</text><path d="M1008.0 465.0 L1016.0 475.0 L1024.0 465.0 Z" fill="#1d2e46"/><text x="740.000" y="660.000" font-size="17" fill="#596b82" text-anchor="start" font-weight="400" >帮助信息不承载必须完成的操作</text></svg>
