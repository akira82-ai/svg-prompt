<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>工具提示 Tooltip</title><desc>深浅两色气泡 + 指向箭头 + 触发按钮</desc><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">工具提示 Tooltip</text><text x="60" y="104" font-size="14" fill="#6b7785">不占用界面空间的按需说明</text><g><rect x="60" y="140" width="520" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="150" y="230" width="300" height="60" rx="10" fill="#1c2733"/><text x="300" y="267" font-size="14.5" fill="#fff" text-anchor="middle">把鼠标悬停在按钮上</text><path d="M 285 290 L 300 306 L 315 290 Z" fill="#1c2733"/><rect x="220" y="330" width="160" height="46" rx="10" fill="#4f8ef7"/><text x="300" y="359" font-size="15" fill="#fff" text-anchor="middle" font-weight="600">悬停我</text><text x="300" y="450" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">深色 dark</text><text x="300" y="474" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">tooltip-dark</text></g><g><rect x="620" y="140" width="520" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="750" y="330" width="160" height="46" rx="10" fill="#fff" stroke="#4f8ef7" stroke-width="1.5"/><text x="830" y="359" font-size="15" fill="#4f8ef7" text-anchor="middle" font-weight="600">点我看看</text><path d="M 815 396 L 830 382 L 845 396 Z" fill="#fff" stroke="#e3e8ef" stroke-width="1.5"/><rect x="680" y="396" width="300" height="60" rx="10" fill="#fff" stroke="#e3e8ef"/><text x="830" y="433" font-size="14" fill="#1c2733" text-anchor="middle">浅色提示也可以放代码片段</text><text x="830" y="510" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">浅色 light</text><text x="830" y="534" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">tooltip-light</text></g></svg>