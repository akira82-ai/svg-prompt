<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">弹窗与确认</title><desc id="desc">确认框说明对象、权限影响和可恢复性，危险操作与取消分开；页面原型不执行真实移出。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >弹窗与确认</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >状态与过程反馈 / 产品场景与状态设计</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="120.000" y="240.000" width="1160.000" height="550.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="144.000" y="276.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >项目设置</text><rect x="121.000" y="241.000" width="1158.000" height="548.000" rx="9" fill="#dae2ec" /><rect x="355.000" y="320.000" width="690.000" height="355.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="379.000" y="356.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >移出团队成员？</text><text x="395.000" y="425.000" font-size="19" fill="#596b82" text-anchor="start" font-weight="400" >陈同学将无法继续访问此工作区。</text><text x="395.000" y="463.000" font-size="19" fill="#596b82" text-anchor="start" font-weight="400" >已有文档会保留，管理员可重新邀请。</text><rect x="690.000" y="575.000" width="130.000" height="42.000" rx="8" fill="#ffffff" stroke="#dce4ee" data-control="button" data-state="default"/><text x="755.000" y="601.000" font-size="15" fill="#1d2e46" text-anchor="middle" font-weight="600" >取消</text><rect x="845.000" y="575.000" width="160.000" height="42.000" rx="8" fill="#b83e46" stroke="#b83e46" data-control="button" data-state="default"/><text x="925.000" y="601.000" font-size="15" fill="#fff" text-anchor="middle" font-weight="600" >确认移出</text><text x="395.000" y="535.000" font-size="16" fill="#1d2e46" text-anchor="start" font-weight="400" >对象：陈同学 / chen@example.com</text></svg>
