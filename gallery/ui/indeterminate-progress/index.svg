<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">不确定进度 Indeterminate</text><text x="60" y="104" font-size="14" fill="#6b7785">不知道多久，就让光条一直跑</text><defs><clipPath id="trc"><rect x="350" y="395" width="500" height="10" rx="5"/></clipPath><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f8ef7"/><stop offset="1" stop-color="#9cc3fb"/></linearGradient></defs><g><rect x="60" y="140" width="1080" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><text x="600" y="340" font-size="16" fill="#6b7785" text-anchor="middle">正在加载…</text><rect x="350" y="395" width="500" height="10" rx="5" fill="#e3e8ef"/><g clip-path="url(#trc)"><rect x="220" y="395" width="130" height="10" rx="5" fill="url(#bar)"><animate attributeName="x" values="220;730" dur="1.5s" repeatCount="indefinite"/></rect></g><text x="600" y="490" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">不确定进度</text><text x="600" y="514" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">indeterminate · 1.5s loop</text></g></svg>