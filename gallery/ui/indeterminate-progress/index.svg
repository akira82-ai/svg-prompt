<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">不确定进度</title><desc id="desc">未知时长使用循环光条，限定裁切范围，不显示伪百分比或预计完成时间。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >不确定进度</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >状态与过程反馈 / 过程动画与静态快照</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="180.000" y="260.000" width="1040.000" height="480.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="204.000" y="296.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >正在准备导出文件</text><text x="220.000" y="390.000" font-size="22" fill="#1d2e46" text-anchor="start" font-weight="400" >已提交导出请求，正在整理筛选结果。</text><rect x="220.000" y="455.000" width="960.000" height="12.000" rx="6" fill="#dce4ee" /><defs><clipPath id="progress-window"><rect x="220" y="455" width="960" height="12" rx="6"/></clipPath></defs><g clip-path="url(#progress-window)" class="motion"><rect x="20" y="455" width="200" height="12" rx="6" fill="#2467d5"><animate attributeName="x" values="20;1180" keyTimes="0.000000;1.000000" dur="3s" repeatCount="indefinite" fill="freeze" calcMode="linear"/></rect></g><rect x="600.000" y="455.000" width="200.000" height="12.000" rx="6" fill="#2467d5" class="fallback"/><text x="220.000" y="540.000" font-size="17" fill="#596b82" text-anchor="start" font-weight="400" >进度暂不可计算；完成后会发送通知。</text><rect x="1040.000" y="630.000" width="140.000" height="42.000" rx="8" fill="#ffffff" stroke="#dce4ee" data-control="button" data-state="default"/><text x="1110.000" y="656.000" font-size="15" fill="#1d2e46" text-anchor="middle" font-weight="600" >取消导出</text><style>.fallback{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.fallback{display:inline}}</style></svg>
