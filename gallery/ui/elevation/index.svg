<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>卡片与阴影层级</title><desc>海拔 0–3：从纯描边到大柔影的四档阴影</desc><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">卡片与阴影层级</text><text x="60" y="104" font-size="14" fill="#6b7785">海拔越高阴影越大越柔——界面的深度语言</text><defs><filter id="el1" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1c2733" flood-opacity="0.10"/></filter><filter id="el2" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#1c2733" flood-opacity="0.12"/></filter><filter id="el3" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#1c2733" flood-opacity="0.16"/></filter></defs><g><rect x="60" y="140" width="255" height="460" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="105" y="250" width="165" height="150" rx="12" fill="#fff" stroke="#c9d4e3" stroke-width="1.5"/><text x="187" y="480" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">海拔 0</text><text x="187" y="504" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">none</text><text x="187" y="540" font-size="12" fill="#8a94a3" text-anchor="middle">描边代替阴影</text></g><g><rect x="335" y="140" width="255" height="460" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="380" y="250" width="165" height="150" rx="12" fill="#fff" filter="url(#el1)"/><text x="462" y="480" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">海拔 1</text><text x="462" y="504" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">sm</text><text x="462" y="540" font-size="12" fill="#8a94a3" text-anchor="middle">dy=2 blur=6</text></g><g><rect x="610" y="140" width="255" height="460" rx="16" fi