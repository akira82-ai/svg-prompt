<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">产品引导</title><desc id="desc">新手引导包含建立项目、邀请成员、添加资料三个步骤；当前第一步，允许稍后继续。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >产品引导</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >状态与过程反馈 / 产品场景与状态设计</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="80.000" y="210.000" width="1240.000" height="610.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><rect x="81.000" y="211.000" width="208.000" height="608.000" rx="10" fill="#eaf1fd" /><text x="110.000" y="252.000" font-size="20" fill="#1d2e46" text-anchor="start" font-weight="700" >ATLAS</text><text x="110.000" y="279.000" font-size="11" fill="#596b82" text-anchor="start" font-weight="400" >WORKSPACE / DEMO</text><rect x="97.000" y="297.000" width="176.000" height="40.000" rx="8" fill="#ffffff" /><text x="115.000" y="321.000" font-size="16" fill="#2467d5" text-anchor="start" font-weight="600" >概览</text><text x="115.000" y="373.000" font-size="16" fill="#596b82" text-anchor="start" font-weight="400" >项目</text><text x="115.000" y="425.000" font-size="16" fill="#596b82" text-anchor="start" font-weight="400" >知识库</text><circle cx="116.000" cy="766.000" r="18" fill="#eaf1fd" /><text x="116.000" y="771.000" font-size="14" fill="#2467d5" text-anchor="middle" font-weight="600" >林</text><text x="144.000" y="763.000" font-size="14" fill="#1d2e46" text-anchor="start" font-weight="400" >个人工作区</text><text x="144.000" y="785.000" font-size="12" fill="#596b82" text-anchor="start" font-weight="400" >演示账号</text><line x1="310.000" y1="279.000" x2="1290.000" y2="279.000" stroke="#dce4ee" stroke-width="1" /><text x="330.000" y="252.000" font-size="22" fill="#1d2e46" text-anchor="start" font-weight="700" >欢迎加入工作区</text><rect x="1140.000" y="226.000" width="150.000" height="42.000" rx="8" fill="#2467d5" stroke="#2467d5" data-control="button" data-state="default"/><text x="1215.000" y="252.000" font-size="15" fill="#fff" text-anchor="middle" font-weight="600" >新建项目</text><rect x="330.000" y="330.000" width="960.000" height="410.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="354.000" y="366.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >开始使用 / 1 共 3 步</text><circle cx="369.000" cy="410.000" r="18" fill="#eaf1fd" /><text x="369.000" y="416.000" font-size="17" fill="#2467d5" text-anchor="middle" font-weight="400" >1</text><text x="408.000" y="416.000" font-size="21" fill="#1d2e46" text-anchor="start" font-weight="600" >建立你的第一个项目</text><text x="408.000" y="448.000" font-size="16" fill="#596b82" text-anchor="start" font-weight="400" >集中管理任务、文件与讨论</text><circle cx="369.000" cy="505.000" r="18" fill="#eaf1fd" /><text x="369.000" y="511.000" font-size="17" fill="#2467d5" text-anchor="middle" font-weight="400" >2</text><text x="408.000" y="511.000" font-size="21" fill="#1d2e46" text-anchor="start" font-weight="600" >邀请团队成员</text><text x="408.000" y="543.000" font-size="16" fill="#596b82" text-anchor="start" font-weight="400" >协作之前明确每个人的角色</text><circle cx="369.000" cy="600.00