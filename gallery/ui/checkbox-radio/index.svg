<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">复选与单选</text><text x="60" y="104" font-size="14" fill="#6b7785">一个方块打勾，一个圆点选中——表单的两兄弟</text><g><rect x="60" y="140" width="520" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="180" y="205" width="34" height="34" rx="9" fill="#fff" stroke="#c9d4e3" stroke-width="2"/><text x="236" y="229" font-size="16" fill="#1c2733" text-anchor="start">未选</text><text x="236" y="251" font-size="12" fill="#8a94a3" text-anchor="start">unchecked</text><rect x="180" y="315" width="34" height="34" rx="9" fill="#4f8ef7"/><path d="M 188 332 l 7 8 l 12 -15" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="236" y="339" font-size="16" fill="#1c2733" text-anchor="start">选中</text><text x="236" y="361" font-size="12" fill="#8a94a3" text-anchor="start">checked</text><rect x="180" y="425" width="34" height="34" rx="9" fill="#4f8ef7"/><rect x="188" y="439.5" width="18" height="5" rx="2.5" fill="#fff"/><text x="236" y="449" font-size="16" fill="#1c2733" text-anchor="start">半选</text><text x="236" y="471" font-size="12" fill="#8a94a3" text-anchor="start">indeterminate</text><text x="320" y="560" font-size="15" fill="#6b7785" text-anchor="middle" font-weight="600">复选框 · 可多选</text></g><g><rect x="620" y="140" width="520" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="730" cy="225" r="17" fill="#fff" stroke="#c9d4e3" stroke-width="2"/><text x="770" y="231" font-size="16" fill="#1c2733" text-anchor="start">选项一</text><circle cx="730" cy="315" r="17" fill="#fff" stroke="#4f8ef7" stroke-width="2"/><circle cx="730" cy="315" r="8" fill="#4f8ef7"/><text x="770" y="321" font-size="16" fill="#1c2733" text-anchor="start">选项二</text><text x="770" y="343" font-size="12" fill="#8a94a3" text-anchor="start">selected</text><circle cx="730" cy="405" r="17" fill="#fff" stroke="#c9d4e3" stroke-width="2"/><text x="770" y="411" font-size="16" fill="#1c2733" text-anchor="start">选项三</text><text x="880" y="560" font-size="15" fill="#6b7785" text-anchor="middle" font-weight="600">单选组 · 只能选一个</text></g></svg>