<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">复选与单选</title><desc id="desc">复选未选/选中/半选，单选组仅团队选中；半选不用于单选控件。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >复选与单选</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >输入与基础组件 / 产品场景与状态设计</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="80.000" y="230.000" width="608.000" height="570.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><rect x="712.000" y="230.000" width="608.000" height="570.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="108.000" y="278.000" font-size="23" fill="#1d2e46" text-anchor="start" font-weight="600" >复选：可多选</text><rect x="110.000" y="360.000" width="20.000" height="20.000" rx="4" fill="#ffffff" stroke="#dce4ee" data-control="checkbox" data-state="unchecked"/><text x="150.000" y="377.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="400" >未选择</text><rect x="110.000" y="450.000" width="20.000" height="20.000" rx="4" fill="#2467d5" stroke="#2467d5" data-control="checkbox" data-state="checked"/><path d="M 114.000 460.000 L 118.000 464.000 L 126.000 456.000" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="150.000" y="467.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="400" >已选择</text><rect x="110.000" y="540.000" width="20.000" height="20.000" rx="4" fill="#2467d5" stroke="#2467d5" data-control="checkbox" data-state="mixed"/><line x1="115.000" y1="550.000" x2="125.000" y2="550.000" stroke="#fff" stroke-width="2" /><text x="150.000" y="557.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="400" >部分子项已选择</text><text x="108.000" y="715.000" font-size="16" fill="#596b82" text-anchor="start" font-weight="400" >半选仅用于复选父级</text><text x="740.000" y="278.000" font-size="23" fill="#1d2e46" text-anchor="start" font-weight="600" >单选：只能选一个</text><circle cx="752.000" cy="370.000" r="10" fill="#ffffff" stroke="#dce4ee" stroke-width="2"/><text x="782.000" y="377.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="400" >个人工作区</text><circle cx="752.000" cy="460.000" r="10" fill="#ffffff" stroke="#2467d5" stroke-width="2"/><circle cx="752.000" cy="460.000" r="5" fill="#2467d5" /><text x="782.000" y="467.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="400" >团队工作区</text><circle cx="752.000" cy="550.000" r="10" fill="#ffffff" stroke="#dce4ee" stroke-width="2"/><text x="782.000" y="557.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="400" >组织工作区</text><text x="740.000" y="715.000" font-size="16" fill="#596b82" text-anchor="start" font-weight="400" >组织类型只允许一个激活项</text></svg>
