<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">进度与滑块</title><desc id="desc">进度25/60/100%，滑块40%；圆点坐标与40%轨道比例一致，不把滑块当作进度反馈。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >进度与滑块</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >数据操作与指标 / 产品场景与状态设计</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="130.000" y="240.000" width="1140.000" height="550.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="154.000" y="276.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >确定进度与可调数值</text><text x="175.000" y="345.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >任务 1</text><text x="1190.000" y="345.000" font-size="20" fill="#2467d5" text-anchor="end" font-weight="400" >25%</text><rect x="175.000" y="370.000" width="1015.000" height="8.000" rx="4.0" fill="#dce4ee" /><rect x="175.000" y="370.000" width="253.750" height="8.000" rx="4.0" fill="#2467d5" data-progress="25" data-total="100" data-track="1015"/><text x="175.000" y="447.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >任务 2</text><text x="1190.000" y="447.000" font-size="20" fill="#2467d5" text-anchor="end" font-weight="400" >60%</text><rect x="175.000" y="472.000" width="1015.000" height="8.000" rx="4.0" fill="#dce4ee" /><rect x="175.000" y="472.000" width="609.000" height="8.000" rx="4.0" fill="#2467d5" data-progress="60" data-total="100" data-track="1015"/><text x="175.000" y="549.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >任务 3</text><text x="1190.000" y="549.000" font-size="20" fill="#2467d5" text-anchor="end" font-weight="400" >100%</text><rect x="175.000" y="574.000" width="1015.000" height="8.000" rx="4.0" fill="#dce4ee" /><rect x="175.000" y="574.000" width="1015.000" height="8.000" rx="4.0" fill="#2467d5" data-progress="100" data-total="100" data-track="1015"/><text x="175.000" y="680.000" font-size="17" fill="#1d2e46" text-anchor="start" font-weight="400" >音量 / 40%</text><rect x="360.000" y="676.000" width="700.000" height="8.000" rx="4.0" fill="#dce4ee" /><rect x="360.000" y="676.000" width="280.000" height="8.000" rx="4.0" fill="#2467d5" data-progress="40" data-total="100" data-track="700"/><circle cx="640.000" cy="680.000" r="10" fill="#ffffff" stroke="#2467d5" stroke-width="3" data-slider="40"/><text x="175.000" y="755.000" font-size="16" fill="#596b82" text-anchor="start" font-weight="400" >进度用于反馈完成比例；滑块用于调整可选择的值。</text></svg>
