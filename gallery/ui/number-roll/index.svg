<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">指标数值变化</title><desc id="desc">数字与进度共用50/100/150三档，总量200；离散阶段每2秒切换，静态快照150/200。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >指标数值变化</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >数据操作与指标 / 过程动画与静态快照</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="210.000" y="250.000" width="980.000" height="510.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="234.000" y="286.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >累计完成任务 / 演示阶段</text><g class="motion" opacity="1" data-count-stage="50"><animate attributeName="opacity" values="1;0;0;0" keyTimes="0;0.333333;0.666667;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/><text x="700.000" y="450.000" font-size="70" fill="#1d2e46" text-anchor="middle" font-weight="700" >50</text><text x="700.000" y="510.000" font-size="21" fill="#596b82" text-anchor="middle" font-weight="400" >50 / 200 个任务</text><rect x="290.000" y="565.000" width="820.000" height="8.000" rx="4.0" fill="#dce4ee" /><rect x="290.000" y="565.000" width="205.000" height="8.000" rx="4.0" fill="#2467d5" data-progress="50" data-total="200" data-track="820"/></g><g class="motion" opacity="0" data-count-stage="100"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.333333;0.666667;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/><text x="700.000" y="450.000" font-size="70" fill="#1d2e46" text-anchor="middle" font-weight="700" >100</text><text x="700.000" y="510.000" font-size="21" fill="#596b82" text-anchor="middle" font-weight="400" >100 / 200 个任务</text><rect x="290.000" y="565.000" width="820.000" height="8.000" rx="4.0" fill="#dce4ee" /><rect x="290.000" y="565.000" width="410.000" height="8.000" rx="4.0" fill="#2467d5" data-progress="100" data-total="200" data-track="820"/></g><g class="motion" opacity="0" data-count-stage="150"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.333333;0.666667;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/><text x="700.000" y="450.000" font-size="70" fill="#1d2e46" text-anchor="middle" font-weight="700" >150</text><text x="700.000" y="510.000" font-size="21" fill="#596b82" text-anchor="middle" font-weight="400" >150 / 200 个任务</text><rect x="290.000" y="565.000" width="820.000" height="8.000" rx="4.0" fill="#dce4ee" /><rect x="290.000" y="565.000" width="615.000" height="8.000" rx="4.0" fill="#2467d5" data-progress="150" data-total="200" data-track="820"/></g><g class="fallback"><text x="700.000" y="450.000" font-size="70" fill="#1d2e46" text-anchor="middle" font-weight="700" >150</text><text x="700.000" y="510.000" font-size="21" fill="#596b82" text-anchor="middle" font-weight="400" >150 / 200 个任务</text><rect x="290.000" y="565.000" width="820.000" height="8.000" rx="4.0" fill="#dce4ee" /><rect x="290.000" y="565.000" width="615.000" height="8.000" rx="4.0" fill="#2467d5" data-progress="150" data-total="200" data-track="820"/></g><text x="700.000" y="685.000" font-size="16" fill="#596b82" text-anchor="middle" font-weight="400" >50 → 100 → 150 · 循环为演示，非真实任务增长</text><style>.fallback{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.fallback{display:inline}}</style></svg>
