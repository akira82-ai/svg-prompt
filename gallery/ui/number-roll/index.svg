<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>数字滚动动画</title><desc>大数字逐级滚涨到目标值——计数器风格，6.5 秒一个循环</desc><rect width="1200" height="800" fill="#f6f8fb" /><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">数字滚动动画</text><text x="60" y="104" font-size="14" fill="#6b7785">翻到最后一位，结论才算数</text><g transform="translate(600,430) scale(1.12) translate(-600,-430)"><g><rect x="60" y="170" width="1080" height="540" rx="16" fill="#ffffff" stroke="#e3e8ef" /><text x="560" y="320" font-size="15" fill="#6b7785" text-anchor="middle" font-weight="600">本周营收</text><circle cx="640" cy="315" r="5" fill="#f65e5e"><animate attributeName="opacity" values="1;0.15;1" dur="0.9s" repeatCount="indefinite" /></circle><text x="652" y="320" font-size="11.5" fill="#f65e5e" text-anchor="start" font-weight="800" font-family="SFMono-Regular, Menlo, monospace">DEMO</text><text x="600" y="430" font-size="68" font-weight="800" fill="#1c2733" text-anchor="middle" opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0" keyTimes="0;0.067;1" dur="6.5s" repeatCount="indefinite" />¥0</text><text x="600" y="430" font-size="68" font-weight="800" fill="#1c2733" text-anchor="middle" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.067;0.134;1" dur="6.5s" repeatCount="indefinite" />¥8,914</text><text x="600" y="430" font-size="68" font-weight="800" fill="#1c2733" text-anchor="middle" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.134;0.201;1" dur="6.5s" repeatCount="indefinite" />¥21,376</text><text x="600" y="430" font-size="68" font-weight="800" fill="#1c2733" text-anchor="middle" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.201;0.269;1" dur="6.5s" repeatCount="indefinite" />¥35,402</text><text x="600" y="430" font