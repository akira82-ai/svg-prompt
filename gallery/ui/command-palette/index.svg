<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">命令面板</title><desc id="desc">输入区域、分组结果、键盘选中态与键盘提示清楚；命令含动词和快捷键，不与全文搜索混淆。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#0c1422" /><text x="72.000" y="54.000" font-size="14" fill="#acbdd3" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#acbdd3" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#314159" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#eef4fc" text-anchor="start" font-weight="700" >命令面板</text><text x="72.000" y="160.000" font-size="18" fill="#acbdd3" text-anchor="start" font-weight="400" >导航与检索 / 产品场景与状态设计</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#314159" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#acbdd3" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#acbdd3" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="260.000" y="230.000" width="880.000" height="570.000" rx="10" fill="#131f31" stroke="#314159"/><text x="295.000" y="285.000" font-size="15" fill="#eef4fc" text-anchor="start" font-weight="600" >命令</text><rect x="295.000" y="299.000" width="810.000" height="48.000" rx="8" fill="#131f31" stroke="#79b5ff" stroke-width="2" data-control="input" data-state="focus"/><text x="310.000" y="329.000" font-size="16" fill="#eef4fc" text-anchor="start" font-weight="400" >&gt; 导出</text><text x="295.000" y="410.000" font-size="15" fill="#acbdd3" text-anchor="start" font-weight="400" >可用命令</text><rect x="281.000" y="424.000" width="838.000" height="65.000" rx="8" fill="#1c3050" /><text x="310.000" y="450.000" font-size="19" fill="#79b5ff" text-anchor="start" font-weight="400" >导出当前报告</text><text x="1085.000" y="450.000" font-size="14" fill="#acbdd3" text-anchor="end" font-weight="400" >⌘ E</text><text x="310.000" y="476.000" font-size="14" fill="#acbdd3" text-anchor="start" font-weight="400" >Enter 执行此命令</text><text x="310.000" y="533.000" font-size="19" fill="#eef4fc" text-anchor="start" font-weight="400" >导出项目数据</text><text x="1085.000" y="533.000" font-size="14" fill="#acbdd3" text-anchor="end" font-weight="400" >CSV</text><text x="310.000" y="559.000" font-size="14" fill="#acbdd3" text-anchor="start" font-weight="400" >Enter 执行此命令</text><text x="310.000" y="616.000" font-size="19" fill="#eef4fc" text-anchor="start" font-weight="400" >查看导出记录</text><text x="1085.000" y="616.000" font-size="14" fill="#acbdd3" text-anchor="end" font-weight="400" >↵</text><text x="310.000" y="642.000" font-size="14" fill="#acbdd3" text-anchor="start" font-weight="400" >Enter 执行此命令</text><line x1="295.000" y1="717.000" x2="1105.000" y2="717.000" stroke="#314159" stroke-width="1" /><text x="295.000" y="755.000" font-size="15" fill="#acbdd3" text-anchor="start" font-weight="400" >↑ ↓ 选择    ↵ 执行    Esc 关闭</text></svg>
