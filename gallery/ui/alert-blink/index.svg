<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">告警强调</title><desc id="desc">成功/错误/警告/信息同时用符号、标题与说明区分；告警不得随强调消失，不快闪关键内容。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >告警强调</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >状态与过程反馈 / 过程动画与静态快照</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="130.000" y="235.000" width="1140.000" height="570.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="154.000" y="271.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >消息与告警</text><rect x="170.000" y="320.000" width="1060.000" height="88.000" rx="8" fill="#eaf1fd" /><circle cx="204.000" cy="355.000" r="16" fill="#167d65" /><text x="204.000" y="361.000" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700" >✓</text><text x="240.000" y="352.000" font-size="19" fill="#167d65" text-anchor="start" font-weight="600" >保存成功</text><text x="240.000" y="383.000" font-size="16" fill="#596b82" text-anchor="start" font-weight="400" >项目设置已经更新</text><text x="1195.000" y="360.000" font-size="23" fill="#596b82" text-anchor="end" font-weight="400" >×</text><rect x="170.000" y="426.000" width="1060.000" height="88.000" rx="8" fill="#eaf1fd" /><circle cx="204.000" cy="461.000" r="16" fill="#b83e46" /><text x="204.000" y="467.000" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700" >!</text><text x="240.000" y="458.000" font-size="19" fill="#b83e46" text-anchor="start" font-weight="600" >连接异常</text><text x="240.000" y="489.000" font-size="16" fill="#596b82" text-anchor="start" font-weight="400" >未收到服务响应，请稍后重试</text><text x="1195.000" y="466.000" font-size="23" fill="#596b82" text-anchor="end" font-weight="400" >×</text><rect x="170.000" y="532.000" width="1060.000" height="88.000" rx="8" fill="#eaf1fd" /><circle cx="204.000" cy="567.000" r="16" fill="#9b5b0a" /><text x="204.000" y="573.000" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700" >△</text><text x="240.000" y="564.000" font-size="19" fill="#9b5b0a" text-anchor="start" font-weight="600" >额度提醒</text><text x="240.000" y="595.000" font-size="16" fill="#596b82" text-anchor="start" font-weight="400" >本月额度已使用 80%，可查看套餐</text><text x="1195.000" y="572.000" font-size="23" fill="#596b82" text-anchor="end" font-weight="400" >×</text><rect x="170.000" y="638.000" width="1060.000" height="88.000" rx="8" fill="#eaf1fd" /><circle cx="204.000" cy="673.000" r="16" fill="#2467d5" /><text x="204.000" y="679.000" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700" >i</text><text x="240.000" y="670.000" font-size="19" fill="#2467d5" text-anchor="start" font-weight="600" >报告生成中</text><text x="240.000" y="701.000" font-size="16" fill="#596b82" text-anchor="start" font-weight="400" >完成后将在通知中心提醒你</text><text x="1195.000" y="678.000" font-size="23" fill="#596b82" text-anchor="end" font-weight="400" >×</text><rect class="motion" x="164" y="420" width="1072" height="100" rx="9" fill="none" stroke="#b83e46" stroke-width="2"><animate attributeName="opacity" values="0.25;0.85;0.25" keyTimes="0.000000;0.500000;1.000000" dur="3s" repeatCount="indefinite" fill="freeze" calcMode="linear"/></rect><text x="190.000" y="785.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" class="fallback">告警内容持续可读；仅边框缓慢强调。</text><style>.fallback{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.fallback{display:inline}}</style></svg>
