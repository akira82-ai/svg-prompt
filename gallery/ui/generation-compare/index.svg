<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">生成结果对比</title><desc id="desc">同一请求的两段不同输出并排，版本B明确键盘/Tab/操作对象；支持独立采用，评价不伪装成客观分数。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >生成结果对比</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >AI 产品界面 / 产品场景与状态设计</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="130.000" y="235.000" width="1140.000" height="565.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="154.000" y="271.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >生成结果对比 / 同一请求</text><text x="170.000" y="315.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="400" >请求：用一句话解释键盘聚焦状态。</text><rect x="170.000" y="355.000" width="510.000" height="335.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="194.000" y="391.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >版本 A</text><text x="198.000" y="453.000" font-size="20" fill="#1d2e46" text-anchor="start" font-weight="400" >按钮要有明显的聚焦框，</text><text x="198.000" y="495.000" font-size="20" fill="#1d2e46" text-anchor="start" font-weight="400" >这样用户才能知道当前选中了哪里。</text><text x="198.000" y="570.000" font-size="15" fill="#596b82" text-anchor="start" font-weight="400" >清楚说明位置，术语仍可更精确</text><rect x="198.000" y="615.000" width="454.000" height="42.000" rx="8" fill="#ffffff" stroke="#dce4ee" data-control="button" data-state="default"/><text x="425.000" y="641.000" font-size="15" fill="#1d2e46" text-anchor="middle" font-weight="600" >采用此版本</text><rect x="720.000" y="355.000" width="510.000" height="335.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="744.000" y="391.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >版本 B</text><text x="748.000" y="453.000" font-size="20" fill="#1d2e46" text-anchor="start" font-weight="400" >键盘聚焦框标示当前可操作控件，</text><text x="748.000" y="495.000" font-size="20" fill="#1d2e46" text-anchor="start" font-weight="400" >帮助用户用 Tab 键确认操作位置。</text><text x="748.000" y="570.000" font-size="15" fill="#596b82" text-anchor="start" font-weight="400" >明确输入方式与操作对象</text><rect x="748.000" y="615.000" width="454.000" height="42.000" rx="8" fill="#2467d5" stroke="#2467d5" data-control="button" data-state="default"/><text x="975.000" y="641.000" font-size="15" fill="#fff" text-anchor="middle" font-weight="600" >采用此版本</text><text x="170.000" y="750.000" font-size="16" fill="#596b82" text-anchor="start" font-weight="400" >对比措辞与解释范围；评价为编辑判断，不是自动质量评分。</text></svg>
