<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">空状态与异常</title><desc id="desc">首次使用、搜索无结果、加载失败三个不同原因对应新建、清除条件、重试三种操作。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >空状态与异常</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >状态与过程反馈 / 产品场景与状态设计</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="80.000" y="230.000" width="397.333" height="570.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><rect x="501.333" y="230.000" width="397.333" height="570.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><rect x="922.667" y="230.000" width="397.333" height="570.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><circle cx="278.667" cy="375.000" r="42" fill="#eaf1fd" /><text x="278.667" y="385.000" font-size="30" fill="#2467d5" text-anchor="middle" font-weight="400" >○</text><text x="278.667" y="495.000" font-size="23" fill="#1d2e46" text-anchor="middle" font-weight="600" >还没有项目</text><text x="278.667" y="548.000" font-size="16" fill="#596b82" text-anchor="middle" font-weight="400" >从第一个项目开始</text><rect x="128.000" y="630.000" width="301.333" height="42.000" rx="8" fill="#2467d5" stroke="#2467d5" data-control="button" data-state="default"/><text x="278.667" y="656.000" font-size="15" fill="#fff" text-anchor="middle" font-weight="600" >新建项目</text><circle cx="700.000" cy="375.000" r="42" fill="#eaf1fd" /><text x="700.000" y="385.000" font-size="30" fill="#2467d5" text-anchor="middle" font-weight="400" >⌕</text><text x="700.000" y="495.000" font-size="23" fill="#1d2e46" text-anchor="middle" font-weight="600" >没有匹配结果</text><text x="700.000" y="548.000" font-size="16" fill="#596b82" text-anchor="middle" font-weight="400" >试试移除筛选或更换关键词</text><rect x="549.333" y="630.000" width="301.333" height="42.000" rx="8" fill="#2467d5" stroke="#2467d5" data-control="button" data-state="default"/><text x="700.000" y="656.000" font-size="15" fill="#fff" text-anchor="middle" font-weight="600" >清除筛选</text><circle cx="1121.333" cy="375.000" r="42" fill="#eaf1fd" /><text x="1121.333" y="385.000" font-size="30" fill="#2467d5" text-anchor="middle" font-weight="400" >!</text><text x="1121.333" y="495.000" font-size="23" fill="#1d2e46" text-anchor="middle" font-weight="600" >暂时无法加载</text><text x="1121.333" y="548.000" font-size="16" fill="#596b82" text-anchor="middle" font-weight="400" >连接失败，已有内容不会丢失</text><rect x="970.667" y="630.000" width="301.333" height="42.000" rx="8" fill="#2467d5" stroke="#2467d5" data-control="button" data-state="default"/><text x="1121.333" y="656.000" font-size="15" fill="#fff" text-anchor="middle" font-weight="600" >重试加载</text></svg>
