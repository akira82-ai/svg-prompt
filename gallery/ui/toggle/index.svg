<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">开关 Toggle</text><text x="60" y="104" font-size="14" fill="#6b7785">一个滑块在轨道两端之间——最简洁的状态表达</text><g><rect x="60" y="140" width="520" height="300" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="240" y="250" width="160" height="72" rx="36" fill="#4f8ef7"/><circle cx="364" cy="286" r="28" fill="#fff"/><text x="320" y="400" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">开</text><text x="320" y="424" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">on</text></g><g><rect x="620" y="140" width="520" height="300" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="800" y="250" width="160" height="72" rx="36" fill="#d5dee9"/><circle cx="836" cy="286" r="28" fill="#fff"/><text x="880" y="400" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">关</text><text x="880" y="424" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">off</text></g><g><rect x="60" y="470" width="1080" height="230" rx="16" fill="#ffffff" stroke="#e3e8ef"/><text x="320" y="555" font-size="15" fill="#6b7785" text-anchor="middle" font-weight="600">小号开关</text><rect x="282" y="600" width="76" height="40" rx="20" fill="#4f8ef7"/><circle cx="338" cy="620" r="16" fill="#fff"/><rect x="420" y="600" width="76" height="40" rx="20" fill="#d5dee9"/><circle cx="440" cy="620" r="16" fill="#fff"/><text x="320" y="655" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">开</text><text x="320" y="679" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">on</text><text x="458" y="655" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">关</text><text x="458" y="679" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">off</text><text x="700" y="585" font-size="15" fill="#1c2733" text-anchor="start">滑块白描边 + 端点对齐</text><text x="700" y="613" font-size="15" fill="#1c2733" text-anchor="start">开 = 主色轨道 + 滑块靠右；关 = 灰轨道 + 滑块靠左</text></g></svg>