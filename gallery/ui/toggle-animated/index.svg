<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">开关状态转换</title><desc id="desc">开关绑定明确设置语义，开启、关闭与不可用状态同时展示；动画为自动演示。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >开关状态转换</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >输入与基础组件 / 过程动画与静态快照</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="210.000" y="250.000" width="980.000" height="510.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="234.000" y="286.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >通知偏好</text><text x="250.000" y="365.000" font-size="21" fill="#1d2e46" text-anchor="start" font-weight="600" >邮件通知</text><text x="250.000" y="400.000" font-size="16" fill="#596b82" text-anchor="start" font-weight="400" >每周一发送工作摘要</text><rect x="1070.000" y="345.000" width="52.000" height="28.000" rx="14" fill="#2467d5" data-toggle="true" data-disabled="false"/><circle cx="1108.000" cy="359.000" r="10" fill="#ffffff" /><text x="1010.000" y="365.000" font-size="15" fill="#596b82" text-anchor="end" font-weight="400" >开启</text><text x="250.000" y="485.000" font-size="21" fill="#1d2e46" text-anchor="start" font-weight="600" >产品更新</text><text x="250.000" y="520.000" font-size="16" fill="#596b82" text-anchor="start" font-weight="400" >收到新功能发布提醒</text><rect x="1070.000" y="465.000" width="52.000" height="28.000" rx="14" fill="#dce4ee" data-toggle="false" data-disabled="false"/><circle cx="1084.000" cy="479.000" r="10" fill="#ffffff" /><text x="1010.000" y="485.000" font-size="15" fill="#596b82" text-anchor="end" font-weight="400" >自动演示</text><text x="250.000" y="605.000" font-size="21" fill="#1d2e46" text-anchor="start" font-weight="600" >安全提醒</text><text x="250.000" y="640.000" font-size="16" fill="#596b82" text-anchor="start" font-weight="400" >组织策略要求开启</text><rect x="1070.000" y="585.000" width="52.000" height="28.000" rx="14" fill="#dce4ee" data-toggle="true" data-disabled="true"/><circle cx="1108.000" cy="599.000" r="10" fill="#ffffff" /><text x="1010.000" y="605.000" font-size="15" fill="#596b82" text-anchor="end" font-weight="400" >锁定开启</text><g class="motion"><rect x="1070" y="465" width="52" height="28" rx="14" fill="#dce4ee"><animate attributeName="fill" values="#dce4ee;#2467d5;#dce4ee" keyTimes="0.000000;0.500000;1.000000" dur="4s" repeatCount="indefinite" fill="freeze" calcMode="linear"/></rect><circle cx="1084" cy="479" r="10" fill="#ffffff"><animate attributeName="cx" values="1084;1108;1084" keyTimes="0.000000;0.500000;1.000000" dur="4s" repeatCount="indefinite" fill="freeze" calcMode="linear"/></circle></g><text x="250.000" y="725.000" font-size="15" fill="#596b82" text-anchor="start" font-weight="400" class="fallback">自动循环用于演示；静态快照为关闭状态。</text><style>.fallback{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.fallback{display:inline}}</style></svg>
