<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>开关拨动动画</title><desc>滑块位移与轨道变色同步补间——开与关自动循环</desc><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">开关拨动动画</text><text x="60" y="104" font-size="14" fill="#6b7785">位移与变色同频——一次拨动就是一次状态切换（SMIL）</text><g><rect x="60" y="140" width="1080" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="520" y="310" width="160" height="72" rx="36" fill="#d5dee9"><animate attributeName="fill" values="#d5dee9;#4f8ef7;#d5dee9" dur="2s" repeatCount="indefinite"/></rect><circle cx="556" cy="346" r="28" fill="#fff"><animate attributeName="cx" values="556;644;556" dur="2s" repeatCount="indefinite"/></circle><text x="600" y="480" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">关 ↔ 开</text><text x="600" y="504" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">toggle · 2s loop</text><text x="600" y="545" font-size="14" fill="#6b7785" text-anchor="middle">滑块位移与轨道变色共用同一节奏，才是"一次拨动"</text></g></svg>