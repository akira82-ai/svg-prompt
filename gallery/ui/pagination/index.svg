<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>分页器</title><desc>页码 + 前后翻页 + 省略号的完整分页形态</desc><rect width="1200" height="800" fill="#f6f8fb" /><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">分页器 Pagination</text><text x="60" y="104" font-size="14" fill="#6b7785">告诉用户"你在哪，还能去哪"</text><g><rect x="60" y="140" width="1080" height="320" rx="16" fill="#ffffff" stroke="#e3e8ef" /><rect x="300" y="250" width="44" height="44" rx="10" fill="#fff" stroke="#c9d4e3" stroke-width="1.5" /><text x="322" y="278" font-size="15" fill="#6b7785" text-anchor="middle" /><path d="M 325.5 265 L 318.5 272 L 325.5 279" fill="none" stroke="#6b7785" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="360" y="250" width="44" height="44" rx="10" fill="#fff" stroke="#c9d4e3" stroke-width="1.5" /><text x="382" y="278" font-size="15" fill="#6b7785" text-anchor="middle">1</text><rect x="420" y="250" width="44" height="44" rx="10" fill="#fff" stroke="#c9d4e3" stroke-width="1.5" /><text x="442" y="278" font-size="15" fill="#6b7785" text-anchor="middle">2</text><rect x="480" y="250" width="44" height="44" rx="10" fill="#4f8ef7" /><text x="502" y="278" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="546" y="278" font-size="15" fill="#b6c2d0" text-anchor="middle">…</text><rect x="580" y="250" width="44" height="44" rx="10" fill="#fff" stroke="#c9d4e3" stroke-width="1.5" /><text x="602" y="278" font-size="15" fill="#6b7785" text-anchor="middle">8</text><rect x="640" y="250" width="44" height="44" rx="10" fill="#fff" stroke="#c9d4e3" stroke-width="1.5" /><text x="662" y="278" font-size="15" fill="#6b7785" text-anchor="middle" /><path d="M 658.5 265 L 665.5 272 L 658.5 279" fill="none" stroke="#6b7785" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><text x="322" y="350" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">上一页</text><text x="322" y="374" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">prev</text><text x="502" y="350" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">当前页</text><text x="502" y="374" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">current</text><text x="662" y="350" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">下一页</text><text x="662" y="374" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">next</text></g><g><rect x="60" y="490" width="1080" height="230" rx="16" fill="#ffffff" stroke="#e3e8ef" /><text x="430" y="615" font-size="15" fill="#4f8ef7" text-anchor="end">上一页</text><text x="530" y="615" font-size="15" fill="#6b7785" text-anchor="middle">1</text><text x="565" y="615" font-size="15" fill="#4f8ef7" text-anchor="middle" font-weight="700">2</text><text x="600" y="615" font-size="15" fill="#6b7785" text-anchor="middle">3</text><text x="690" y="615" font-size="15" fill="#4f8ef7" text-anchor="start" font-weight="600">下一页</text><text x="560" y="670" font-size="13" fill="#6b7785" text-anchor="middle">文字式 · 空间紧张时用</text></g></svg>