<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">下拉选择</title><desc id="desc">触发框与菜单对齐，当前进行中有勾选；普通项和选中项不混淆。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >下拉选择</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >输入与基础组件 / 产品场景与状态设计</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="220.000" y="250.000" width="960.000" height="510.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="244.000" y="286.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >项目状态</text><text x="260.000" y="330.000" font-size="15" fill="#1d2e46" text-anchor="start" font-weight="600" >选择状态</text><rect x="260.000" y="344.000" width="390.000" height="48.000" rx="8" fill="#ffffff" stroke="#2467d5" stroke-width="2" data-control="input" data-state="focus"/><text x="275.000" y="374.000" font-size="16" fill="#1d2e46" text-anchor="start" font-weight="400" >进行中  ▾</text><rect x="260.000" y="405.000" width="390.000" height="290.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="290.000" y="448.000" font-size="18"