<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">下拉菜单 Dropdown</text><text x="60" y="104" font-size="14" fill="#6b7785">一个触发框，展开一个选项宇宙</text><defs><filter id="msh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1c2733" flood-opacity="0.10"/></filter></defs><g><rect x="60" y="140" width="520" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="130" y="190" width="280" height="50" rx="10" fill="#fff" stroke="#c9d4e3" stroke-width="1.5"/><text x="146" y="221" font-size="15" fill="#6b7785" text-anchor="start">排序方式</text><path d="M 376 211 L 384 219 L 392 211" fill="none" stroke="#6b7785" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="270" y1="248" x2="270" y2="288" stroke="#c9d4e3" stroke-dasharray="4 4"/><g filter="url(#msh)"><rect x="130" y="296" width="280" height="188" rx="12" fill="#fff" stroke="#e3e8ef"/></g><rect x="138" y="306" width="264" height="36" rx="8" fill="#eef5ff"/><text x="150" y="329" font-size="14.5" fill="#4f8ef7" text-anchor="start">最近使用</text><text x="150" y="369" font-size="14.5" fill="#1c2733" text-anchor="start">按名称</text><text x="150" y="405" font-size="14.5" fill="#1c2733" text-anchor="start">按类型</text><text x="150" y="441" font-size="14.5" fill="#1c2733" text-anchor="start">使用频率</text><path d="M 366 434 l 6 7 l 12 -13" fill="none" stroke="#4f8ef7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="530" font-size="13.5" fill="#6b7785" text-anchor="start">悬停 = 浅蓝底；选中 = 右侧蓝勾</text></g><g><rect x="620" y="140" width="520" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="690" y="210" width="280" height="40" rx="8" fill="#eef5ff"/><text x="710" y="236" font-size="14.5" fill="#4f8ef