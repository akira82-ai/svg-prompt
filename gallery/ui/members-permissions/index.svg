<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">成员与权限</title><desc id="desc">所有者/管理员/编辑者/查看者四角色，权限范围明确；不能用角色标签暗示全部项目天然可见。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >成员与权限</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >协作与业务操作 / 产品场景与状态设计</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="80.000" y="210.000" width="1240.000" height="610.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><rect x="81.000" y="211.000" width="208.000" height="608.000" rx="10" fill="#eaf1fd" /><text x="110.000" y="252.000" font-size="20" fill="#1d2e46" text-anchor="start" font-weight="700" >ATLAS</text><text x="110.000" y="279.000" font-size="11" fill="#596b82" text-anchor="start" font-weight="400" >WORKSPACE / DEMO</text><rect x="97.000" y="297.000" width="176.000" height="40.000" rx="8" fill="#ffffff" /><text x="115.000" y="321.000" font-size="16" fill="#2467d5" text-anchor="start" font-weight="600" >成员</text><text x="115.000" y="373.000" font-size="16" fill="#596b82" text-anchor="start" font-weight="400" >角色权限</text