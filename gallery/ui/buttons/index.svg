<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">按钮状态</title><desc id="desc">主按钮与次按钮均显示默认、悬停、键盘聚焦、按下、禁用；禁用原因明确。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >按钮状态</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >输入与基础组件 / 产品场景与状态设计</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="80.000" y="230.000" width="1240.000" height="570.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="120.000" y="310.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >默认</text><rect x="120.000" y="365.000" width="178.000" height="42.000" rx="8" fill="#2467d5" stroke="#2467d5" data-control="button" data-state="default"/><text x="209.000" y="391.000" font-size="15" fill="#fff" text-anchor="middle" font-weight="600" >保存更改</text><rect x="120.000" y="463.000" width="178.000" height="42.000" rx="8" fill="#ffffff" stroke="#dce4ee" data-control="button" data-state="default"/><text x="209.000" y="489.000" font-size="15" fill="#1d2e46" text-anchor="middle" font-weight="600" >查看详情</text><text x="120.000"