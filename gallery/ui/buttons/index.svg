<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>按钮四态</title><desc>主色与次色按钮的默认/悬停/按下/禁用四态对照</desc><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">按钮状态</text><text x="60" y="104" font-size="14" fill="#6b7785">主色与次色 × 默认 / 悬停 / 按下 / 禁用——四态是按钮的完整人生</text><text x="60" y="138" font-size="15" fill="#6b7785" text-anchor="start" font-weight="600">主色按钮 primary</text><text x="60" y="438" font-size="15" fill="#6b7785" text-anchor="start" font-weight="600">次色按钮 secondary</text><g><rect x="60" y="155" width="255" height="210" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="102" y="217" width="170" height="46" rx="10" fill="#4f8ef7"/><text x="187" y="246" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600">主要按钮</text><text x="187" y="307" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">默认</text><text x="187" y="331" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">default</text></g><g><rect x="335" y="155" width="255" height="210" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="377" y="217" width="170" height="46" rx="10" fill="#3b7ae0"/><text x="462" y="246" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600">主要按钮</text><text x="462" y="307" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">悬停</text><text x="462" y="331" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">hover</text></g><g><rect x="610" y="155" width="255" height="210" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="652" y="217" width="170" height="46" rx="10" fill="#2f66c4"/><text x="737" y="246" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600">主要按钮</text><text x="737" y="307" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">按下</text><text x="737" y="331" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">active</text></g><g><rect x="885" y="155" width="255" height="210" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="927" y="217" width="170" height="46" rx="10" fill="#c9d4e3"/><text x="1012" y="246" font-size="15" fill="#f2f6fb" text-anchor="middle" font-weight="600">主要按钮</text><text x="1012" y="307" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">禁用</text><text x="1012" y="331" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">disabled</text></g><g><rect x="60" y="455" width="255" height="210" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="102" y="517" width="170" height="46" rx="10" fill="#ffffff" stroke="#4f8ef7" stroke-width="1.5"/><text x="187" y="546" font-size="15" fill="#4f8ef7" text-anchor="middle" font-weight="600">次要按钮</text><text x="187" y="607" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">默认</text><text x="187" y="631" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">default</text></g><g><rect x="335" y="455" width="255" height="210" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="377" y="517" width="170" height="46" rx="10" fill="#e8f1fe" stroke="#4f8ef7" stroke-width="1.5"/><text x="462" y="546" font-size="15" fill="#3b7ae0" text-anchor="middle" font-weight="600">次要按钮</text><text x="462" y="607" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">悬停</text><text x="462" y="631" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">hover</text></g><g><rect x="610" y="455" width="255" height="210" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="652" y="517" width="170" height="46" rx="10" fill="#d6e6fd" stroke="#4f8ef7" stroke-width="1.5"/><text x="737" y="546" font-size="15" fill="#2f66c4" text-anchor="middle" font-weight="600">次要按钮</text><text x="737" y="607" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">按下</text><text x="737" y="631" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">active</text></g><g><rect x="885" y="455" width="255" height="210" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="927" y="517" width="170" height="46" rx="10" fill="#ffffff" stroke="#dfe6ee" stroke-width="1.5"/><text x="1012" y="546" font-size="15" fill="#b6c2d0" text-anchor="middle" font-weight="600">次要按钮</text><text x="1012" y="607" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">禁用</text><text x="1012" y="631" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">disabled</text></g></svg>