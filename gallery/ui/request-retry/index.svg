<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">请求状态与重试</title><desc id="desc">请求超时/重试中/恢复三个状态；保留输入，避免重试导致重复提交。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >请求状态与重试</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >状态与过程反馈 / 过程动画与静态快照</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="80.000" y="230.000" width="397.333" height="570.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><rect x="501.333" y="230.000" width="397.333" height="570.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><rect x="922.667" y="230.000" width="397.333" height="570.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><rect x="108.000" y="265.000" width="140.000" height="28.000" rx="14" fill="#eaf1fd" /><text x="178.000" y="284.000" font-size="13" fill="#2467d5" text-anchor="middle" font-weight="600" >请求超时</text><text x="108.000" y="365.000" font-size="23" fill="#1d2e46" text-anchor="start" font-weight="600" >首次请求未完成</text><text x="108.000" y="430.000" font-size="17" fill="#596b82" text-anchor="start" font-weight="400" >未收到服务响应</text><text x="108.000" y="468.000" font-size="17" fill="#596b82" text-anchor="start" font-weight="400" >内容已保留，可以重试</text><rect x="108.000" y="620.000" width="341.333" height="42.000" rx="8" fill="#2467d5" stroke="#2467d5" data-control="button" data-state="default"/><text x="278.667" y="646.000" font-size="15" fill="#fff" text-anchor="middle" font-weight="600" >重试请求</text><rect x="529.333" y="265.000" width="140.000" height="28.000" rx="14" fill="#eaf1fd" /><text x="599.333" y="284.000" font-size="13" fill="#2467d5" text-anchor="middle" font-weight="600" >重试中</text><text x="529.333" y="365.000" font-size="23" fill="#1d2e46" text-anchor="start" font-weight="600" >第 2 次请求</text><text x="529.333" y="430.000" font-size="17" fill="#596b82" text-anchor="start" font-weight="400" >正在重新建立连接</text><text x="529.333" y="468.000" font-size="17" fill="#596b82" text-anchor="start" font-weight="400" >请等待，避免重复提交</text><rect x="529.333" y="620.000" width="341.333" height="42.000" rx="8" fill="#ffffff" stroke="#dce4ee" data-control="button" data-state="default"/><text x="700.000" y="646.000" font-size="15" fill="#1d2e46" text-anchor="middle" font-weight="600" >取消</text><rect class="motion" x="515.3333333333333" y="244.0" width="369.3333333333333" height="542.0" rx="9" fill="none" stroke="#2467d5" stroke-width="2"><animate attributeName="opacity" values="0.25;0.85;0.25" keyTimes="0.000000;0.500000;1.000000" dur="3s" repeatCount="indefinite" fill="freeze" calcMode="linear"/></rect><rect x="950.667" y="265.000" width="140.000" height="28.000" rx="14" fill="#eaf1fd" /><text x="1020.667" y="284.000" font-size="13" fill="#2467d5" text-anchor="middle" font-weight="600" >已恢复</text><text x="950.667" y="365.000" font-size="23" fill="#1d2e46" text-anchor="start" font-weight="600" >示例恢复结果</text><text x="950.667" y="430.000" font-size="17" fill="#596b82" text-anchor="start" font-weight="400" >响应已成功接收</text><text x="950.667" y="468.000" font-size="17" fill="#596b82" text-anchor="start" font-weight="400" >原输入内容保持不变</text><rect x="950.667" y="620.000" width="341.333" height="42.000" rx="8" fill="#2467d5" stroke="#2467d5" data-control="button" data-state="default"/><text x="1121.333" y="646.000" font-size="15" fill="#fff" text-anchor="middle" font-weight="600" >查看结果</text><text x="120.000" y="824.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" class="fallback">三阶段状态对照；循环只强调中间状态，不表示实际任务自动完成。</text><style>.fallback{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.fallback{display:inline}}</style></svg>
