<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">文件上传过程</title><desc id="desc">上传三阶段：等待/64%上传中/完成；4.0÷6.25=64%，进度与文本一致。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >文件上传过程</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >输入与基础组件 / 过程动画与静态快照</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="80.000" y="230.000" width="397.333" height="570.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><rect x="501.333" y="230.000" width="397.333" height="570.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><rect x="922.667" y="230.000" width="397.333" height="570.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><rect x="108.000" y="265.000" width="140.000" height="28.000" rx="14" fill="#eaf1fd" /><text x="178.000" y="284.000" font-size="13" fill="#2467d5" text-anchor="middle" font-weight="600" >等待上传</text><text x="108.000" y="365.000" font-size="23" fill="#1d2e46" text-anchor="start" font-weight="600" >拖入文件或选择文件</text><text x="108.000" y="430.000" font-size="17" fill="#596b82" text-anchor="start" font-weight="400" >支持 PD