<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">标签页与分段导航</title><desc id="desc">下划线标签页激活概览；分段控件激活月，导航与视图切换含义明确。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >标签页与分段导航</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >导航与检索 / 产品场景与状态设计</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="140.000" y="240.000" width="1120.000" height="545.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="164.000" y="276.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >项目详情</text><text x="185.000" y="350.000" font-size="20" fill="#2467d5" text-anchor="start" font-weight="400" >概览</text><line x1="175.000" y1="374.000" x2="335.000" y2="374.000" stroke="#2467d5" stroke-width="3" /><text x="415.000" y="350.000" font-size="20" fill="#596b82" text-anchor="start" font-weight="400" >任务</text><line x1="405.000" y1="374.000" x2="565.000" y2="374.000" stroke="#dce4ee" stroke-width="1" /><text x="645.000" y="350.000" font-size="20" fill="#596b82" text-anchor="start" font-weight="400" >文件</text><line x1="635.000" y1="374.000" x2="795.000" y2="374.000" stroke="#dce4ee" stroke-width="1" /><text x="875.000" y="350.000" font-size="20" fill="#596b82" text-anchor="start" font-weight="400" >活动</text><line x1="865.000" y1="374.000" x2="1025.000" y2="374.000" stroke="#dce4ee" stroke-width="1" /><text x="185.000" y="437.000" font-size="25" fill="#1d2e46" text-anchor="start" font-weight="600" >概览内容区域</text><text x="185.000" y="478.000" font-size="17" fill="#596b82" text-anchor="start" font-weight="400" >标签切换同一对象的不同内容；页面位置保持稳定。</text><rect x="185.000" y="580.000" width="140.000" height="42.000" rx="8" fill="#ffffff" stroke="#dce4ee" data-control="button" data-state="default"/><text x="255.000" y="606.000" font-size="15" fill="#1d2e46" text-anchor="middle" font-weight="600" >周</text><rect x="340.000" y="580.000" width="140.000" height="42.000" rx="8" fill="#2467d5" stroke="#2467d5" data-control="button" data-state="default"/><text x="410.000" y="606.000" font-size="15" fill="#fff" text-anchor="middle" font-weight="600" >月</text><rect x="495.000" y="580.000" width="140.000" height="42.000" rx="8" fill="#ffffff" stroke="#dce4ee" data-control="button" data-state="default"/><text x="565.000" y="606.000" font-size="15" fill="#1d2e46" text-anchor="middle" font-weight="600" >季度</text><text x="185.000" y="680.000" font-size="17" fill="#596b82" text-anchor="start" font-weight="400" >分段控件改变当前视图的时间粒度，不跳转到其他页面。</text></svg>
