<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>标签页与分段控件</title><desc>下划线标签页与胶囊分段控件，激活态两种指示方式</desc><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">标签页 Tabs</text><text x="60" y="104" font-size="14" fill="#6b7785">两种激活指示：下划线 与 白色胶囊</text><g><rect x="60" y="140" width="1080" height="300" rx="16" fill="#ffffff" stroke="#e3e8ef"/><text x="200" y="245" font-size="17" fill="#4f8ef7" text-anchor="middle" font-weight="700">首页</text><rect x="166" y="262" width="68" height="4" rx="2" fill="#4f8ef7"/><text x="340" y="245" font-size="17" fill="#6b7785" text-anchor="middle">发现</text><text x="480" y="245" font-size="17" fill="#6b7785" text-anchor="middle">消息</text><text x="620" y="245" font-size="17" fill="#6b7785" text-anchor="middle">我的</text><rect x="160" y="268" width="880" height="2" fill="#e3e8ef"/><text x="170" y="200" font-size="13" fill="#6b7785" text-anchor="start">下划线式 · 激活 active</text><text x="160" y="350" font-size="15" fill="#1c2733" text-anchor="start">基线上的滑块是标签页最经典的激活指示</text><text x="160" y="378" font-size="15" fill="#1c2733" text-anchor="start">未选 = 灰字无指示；激活 = 主色字 + 圆头短横线</text></g><g><rect x="60" y="470" width="1080" height="230" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="410" y="530" width="380" height="52" rx="12" fill="#e9eef5"/><rect x="418" y="537" width="182" height="38" rx="9" fill="#fff"/><text x="509" y="562" font-size="15" fill="#4f8ef7" text-anchor="middle" font-weight="700">日间</text><text x="691" y="562" font-size="15" fill="#6b7785" text-anchor="middle">夜间</text><text x="410" y="630" font-size="13" fill="#6b7785" text-anchor="start">分段控件 · 白色胶囊即激活态</text></g></svg>