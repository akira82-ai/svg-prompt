<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>头像与徽章</title><desc>字母头像、图标头像、数字徽章与在线状态点</desc><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">头像与徽章</text><text x="60" y="104" font-size="14" fill="#6b7785">头像负责识别，徽章与状态点负责通知</text><g><rect x="60" y="140" width="560" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="170" cy="300" r="48" fill="#4f8ef7"/><text x="170" y="312" font-size="32" fill="#fff" text-anchor="middle" font-weight="600">磊</text><circle cx="320" cy="300" r="48" fill="#9b59f5"/><circle cx="320" cy="283.2" r="15.399999999999999" fill="#fff"/><path d="M 292 333.6 a 28 23.799999999999997 0 0 1 56 0 z" fill="#fff"/><circle cx="470" cy="300" r="48" fill="#38b8c9"/><text x="470" y="312" font-size="32" fill="#fff" text-anchor="middle" font-weight="600">A</text><text x="170" y="400" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">字母</text><text x="170" y="424" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">initial</text><text x="320" y="400" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">剪影</text><text x="320" y="424" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">icon</text><text x="470" y="400" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">字母</text><text x="470" y="424" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">initial</text></g><g><rect x="640" y="140" width="500" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="770" cy="300" r="48" fill="#4f8ef7"/><text x="770" y="311" font-size="29" fill="#fff" text-anchor="middle" font-weight="600">磊</text><circle cx="803" cy="269" r="14" fill="#f65e5e" stroke="#fff" stroke-width="3"/><text x="803" y="274" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">6</text><text x="770" y="400" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">数字徽章</text><text x="770" y="424" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">badge</text><circle cx="930" cy="300" r="48" fill="#3fb98f"/><circle cx="930" cy="285" r="13.75" fill="#fff"/><path d="M 905 330 a 25 21.25 0 0 1 50 0 z" fill="#fff"/><circle cx="961" cy="331" r="10" fill="#3fb98f" stroke="#fff" stroke-width="3"/><text x="930" y="400" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">在线</text><text x="930" y="424" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">online</text><circle cx="1090" cy="300" r="48" fill="#c9d4e3"/><circle cx="1090" cy="285" r="13.75" fill="#fff"/><path d="M 1065 330 a 25 21.25 0 0 1 50 0 z" fill="#fff"/><circle cx="1121" cy="331" r="10" fill="#b6c2d0" stroke="#fff" stroke-width="3"/><text x="1090" y="400" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">离线</text><text x="1090" y="424" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">offline</text><text x="700" y="520" font-size="14" fill="#1c2733" text-anchor="start">徽章压头像右上角，状态点压右下角，都要一圈白描边</text></g></svg>