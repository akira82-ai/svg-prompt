<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">正在输入</title><desc id="desc">三点依次强调，明确陈同学正在输入；不暗示消息已经发送或内容已经生成。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >正在输入</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >状态与过程反馈 / 过程动画与静态快照</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="220.000" y="250.000" width="960.000" height="500.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="244.000" y="286.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >团队对话</text><circle cx="270.000" cy="378.000" r="18" fill="#eaf1fd" /><text x="270.000" y="383.000" font-size="14" fill="#2467d5" text-anchor="middle" font-weight="600" >林</text><rect x="310.000" y="340.000" width="470.000" height="80.000" rx="12" fill="#eaf1fd" /><text x="335.000" y="388.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="400" >我把更新的组件规范发给你。</text><circle cx="1080.000" cy="505.000" r="18" fill="#eaf1fd" /><text x="1080.000" y="510.000" font-size="14" fill="#2467d5" text-anchor="middle" font-weight