<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">标签与筛选项</title><desc id="desc">普通、选中、可移除与添加四类；可移除标签含明确×，显示应用条件。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" rx="0" fill="#eef2f7" /><text x="72.000" y="54.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="600" >SVG / PRODUCT INTERFACES</text><text x="1328.000" y="54.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >DEMO · 状态示意</text><line x1="72.000" y1="74.000" x2="1328.000" y2="74.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="122.000" font-size="34" fill="#1d2e46" text-anchor="start" font-weight="700" >标签与筛选项</text><text x="72.000" y="160.000" font-size="18" fill="#596b82" text-anchor="start" font-weight="400" >输入与基础组件 / 产品场景与状态设计</text><line x1="72.000" y1="846.000" x2="1328.000" y2="846.000" stroke="#dce4ee" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#596b82" text-anchor="start" font-weight="400" >界面原型 · 模拟内容 · 控件状态不代表实际交互</text><text x="1328.000" y="878.000" font-size="14" fill="#596b82" text-anchor="end" font-weight="400" >SVG-PROMPT</text><rect x="150.000" y="250.000" width="1100.000" height="510.000" rx="10" fill="#ffffff" stroke="#dce4ee"/><text x="174.000" y="286.000" font-size="19" fill="#1d2e46" text-anchor="start" font-weight="600" >筛选条件与标签</text><rect x="195.000" y="365.000" width="218.000" height="42.000" rx="8" fill="#2467d5" stroke="#2467d5" data-control="button" data-state="default"/><text x="304.000" y="391.000" font-size="15" fill="#fff" text-anchor="middle" font-weight="600" >全部项目</text><text x="304.000" y="448.000" font-size="17" fill="#596b82" text-anchor="middle" font-weight="400" >选中</text><rect x="453.000" y="365.000" width="218.000" height="42.000" rx="8" fill="#ffffff" stroke="#dce4ee" data-control="button" data-state="default"/><text x="562.000" y="391.000" font-size="15" fill="#1d2e46" text-anchor="middle" font-weight="600" >设计资源</text><text x="562.000" y="448.000" font-size="17" fill="#596b82" text-anchor="middle" font-weight="400" >普通</text><rect x="711.000" y="365.000" width="218.000" height="42.000" rx="8" fill="#ffffff" stroke="#dce4ee" data-control="button" data-state="default"/><text x="820.000" y="391.000" font-size="15" fill="#1d2e46" text-anchor="middle" font-weight="600" >状态：进行中 ×</text><text x="820.000" y="448.000" font-size="17" fill="#596b82" text-anchor="middle" font-weight="400" >可移除</text><rect x="969.000" y="365.000" width="218.000" height="42.000" rx="8" fill="#ffffff" stroke="#dce4ee" data-control="button" data-state="default"/><text x="1078.000" y="391.000" font-size="15" fill="#1d2e46" text-anchor="middle" font-weight="600" >+ 添加条件</text><text x="1078.000" y="448.000" font-size="17" fill="#596b82" text-anchor="middle" font-weight="400" >添加</text><text x="195.000" y="560.000" font-size="20" fill="#1d2e46" text-anchor="start" font-weight="600" >已应用筛选：状态 = 进行中</text><text x="195.000" y="605.000" font-size="17" fill="#596b82" text-anchor="start" font-weight="400" >移除筛选后恢复全部结果；标签与筛选条件使用不同文字说明。</text></svg>
