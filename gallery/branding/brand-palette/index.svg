<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>品牌色板</title><desc>主辅语义色卡与 Logo 用色规范</desc><defs><linearGradient id="lgp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8ef7"/><stop offset="1" stop-color="#9b59f5"/></linearGradient></defs><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">品牌色板 Palette</text><text x="60" y="104" font-size="14" fill="#6b7785">色彩要有名字、编号和配额——才叫系统</text><g><rect x="60" y="140" width="200" height="300" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="60" y="140" width="200" height="200" rx="16" fill="#4f8ef7"/><text x="80" y="205" font-size="34" fill="#ffffff" text-anchor="start" font-weight="700">Aa</text><text x="80" y="368" font-size="15" fill="#1c2733" text-anchor="start" font-weight="600">NOVA Blue</text><text x="80" y="390" font-size="12.5" fill="#8a94a3" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">#4f8ef7</text><text x="80" y="410" font-size="12" fill="#6b7785" text-anchor="start">主色 · 60%</text></g><g><rect x="280" y="140" width="200" height="300" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="280" y="140" width="200" height="200" rx="16" fill="#9b59f5"/><text x="300" y="205" font-size="34" fill="#ffffff" text-anchor="start" font-weight="700">Aa</text><text x="300" y="368" font-size="15" fill="#1c2733" text-anchor="start" font-weight="600">Nova Purple</text><text x="300" y="390" font-size="12.5" fill="#8a94a3" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">#9b59f5</text><text x="300" y="410" font-size="12" fill="#6b7785" text-anchor="start">辅色 · 20%</text></g><g><rect x="500" y="140" width="200" height="300" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="500" y="140" width="200" height="200" rx="16" fill="#1c2733"/><text x="520" y="205" font-size="34" fill="#ffffff" text-anchor="start" font-weight="700">Aa</text><text x="520" y="368" font-size="15" fill="#1c2733" text-anchor="start" font-weight="600">Ink</text><text x="520" y="390" font-size="12.5" fill="#8a94a3" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">#1c2733</text><text x="520" y="410" font-size="12" fill="#6b7785" text-anchor="start">文字 · 15%</text></g><g><rect x="720" y="140" width="200" height="300" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="720" y="140" width="200" height="200" rx="16" fill="#3fb98f"/><text x="740" y="205" font-size="34" fill="#ffffff" text-anchor="start" font-weight="700">Aa</text><text x="740" y="368" font-size="15" fill="#1c2733" text-anchor="start" font-weight="600">Success</text><text x="740" y="390" font-size="12.5" fill="#8a94a3" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">#3fb98f</text><text x="740" y="410" font-size="12" fill="#6b7785" text-anchor="start">语义 · 3%</text></g><g><rect x="940" y="140" width="200" height="300" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="940" y="140" width="200" height="200" rx="16" fill="#f5a83c"/><text x="960" y="205" font-size="34" fill="#ffffff" text-anchor="start" font-weight="700">Aa</text><text x="960" y="368" font-size="15" fill="#1c2733" text-anchor="start" font-weight="600">Warning</text><text x="960" y="390" font-size="12.5" fill="#8a94a3" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">#f5a83c</text><text x="960" y="410" font-size="12" fill="#6b7785" text-anchor="start">语义 · 2%</text></g><g><rect x="60" y="480" width="200" height="220" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="90" y="500" width="140" height="90" rx="12" fill="#fff" stroke="#e3e8ef"/><path d="M 160 519 Q 163.38 541.62 186 545 Q 163.38 548.38 160 571 Q 156.62 548.38 134 545 Q 156.62 541.62 160 519 Z" fill="url(#lgp)"/><text x="160" y="630" font-size="13" fill="#1c2733" text-anchor="middle" font-weight="600">✓ 白底 · 标准</text></g><g><rect x="280" y="480" width="200" height="220" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="310" y="500" width="140" height="90" rx="12" fill="#141c28" stroke="none"/><path d="M 380 519 Q 383.38 541.62 406 545 Q 383.38 548.38 380 571 Q 376.62 548.38 354 545 Q 376.62 541.62 380 519 Z" fill="#fff"/><text x="380" y="630" font-size="13" fill="#1c2733" text-anchor="middle" font-weight="600">✓ 深底 · 反白</text></g><g><rect x="500" y="480" width="200" height="220" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="530" y="500" width="140" height="90" rx="12" fill="#4f8ef7" stroke="none"/><path d="M 600 519 Q 603.38 541.62 626 545 Q 603.38 548.38 600 571 Q 596.62 548.38 574 545 Q 596.62 541.62 600 519 Z" fill="#fff"/><text x="600" y="630" font-size="13" fill="#1c2733" text-anchor="middle" font-weight="600">✓ 品牌底 · 白标</text></g><text x="740" y="545" font-size="15" fill="#1c2733" text-anchor="start">色彩配额：主色撑场面，辅色点睛，</text><text x="740" y="573" font-size="15" fill="#1c2733" text-anchor="start">语义色只在状态出现时上岗</text><text x="740" y="601" font-size="15" fill="#1c2733" text-anchor="start">反白与品牌底是 Logo 仅有的</text><text x="740" y="629" font-size="15" fill="#1c2733" text-anchor="start">两种"变装"——不许自由发挥</text></svg>