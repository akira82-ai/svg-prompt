<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">品牌色彩系统</title><desc id="desc">4品牌色主色245ee8/正文14263d/纸面ffffff/浅层dce7fc，HEX文本与色块一致；不把品牌色板当完整功能语义色。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" fill="#eef2f6" rx="0" /><text x="64.000" y="48.000" font-size="14" fill="#596b80" text-anchor="start" font-weight="400" >SVG / BRAND &amp; TYPE</text><text x="1336.000" y="48.000" font-size="14" fill="#596b80" text-anchor="end" font-weight="400" >NOVA / CONCEPT BRAND</text><line x1="64.000" y1="70.000" x2="1336.000" y2="70.000" stroke="#596b80" stroke-width="1" /><text x="64.000" y="118.000" font-size="32" fill="#14263d" text-anchor="start" font-weight="700" >品牌色彩系统</text><text x="64.000" y="153.000" font-size="18" fill="#596b80" text-anchor="start" font-weight="400" >Brand Color System</text><line x1="64.000" y1="846.000" x2="1336.000" y2="846.000" stroke="#596b80" stroke-width="1" /><text x="64.000" y="878.000" font-size="14" fill="#596b80" text-anchor="start" font-weight="400" >示例品牌与版式 · 字体依赖系统环境 · 印刷图仅为示意</text><text x="1336.000" y="878.000" font-size="14" fill="#596b80" text-anchor="end" font-weight="400" >SVG-PROMPT</text><defs><symbol id="nova-mark" viewBox="0 0 6 6"><path d="M0 0 L2 0 L6 4 L6 6 L4 6 L0 2 Z M4 0 L6 0 L6 2 Z M0 4 L0 6 L2 6 Z"/></symbol><symbol id="nova-wordmark" viewBox="0 0 266 60"><path d="M0 0 H12 L42 38 V0 H54 V60 H42 L12 22 V60 H0 Z" transform="translate(0 0)" fill-rule="evenodd"/><path d="M12 0 H44 L56 12 V48 L44 60 H12 L0 48 V12 Z M17 12 L12 17 V43 L17 48 H39 L44 43 V17 L39 12 Z" transform="translate(66 0)" fill-rule="evenodd"/><path d="M0 0 H14 L30 43 L46 0 H60 L38 60 H22 Z" transform="translate(134 0)" fill-rule="evenodd"/><path d="M0 60 L22 0 H38 L60 60 H45 L40 45 H20 L15 60 Z M26 30 H34 L30 17 Z" transform="translate(206 0)" fill-rule="evenodd"/></symbol></defs><rect x="90.000" y="235.000" width="290.000" height="310.000" fill="#245ee8" rx="0" stroke="#cbd6e7"/><text x="90.000" y="595.000" font-size="21" fill="#14263d" text-anchor="start" font-weight="700" >PRIMARY</text><text x="90.000" y="638.000" font-size="19" fill="#14263d" text-anchor="start" font-weight="400" >#245EE8</text><text x="90.000" y="685.000" font-size="17" fill="#596b80" text-anchor="start" font-weight="400" >品牌主色</text><rect x="400.000" y="235.000" width="290.000" height="310.000" fill="#14263d" rx="0" stroke="#cbd6e7"/><text x="400.000" y="595.000" font-size="21" fill="#14263d" text-anchor="start" font-weight="700" >INK</text><text x="400.000" y="638.000" font-size="19" fill="#14263d" text-anchor="start" font-weight="400" >#14263D</text><text x="400.000" y="685.000" font-size="17" fill="#596b80" text-anchor="start" font-weight="400" >正文与深底</text><rect x="710.000" y="235.000" width="290.000" height="310.000" fill="#ffffff" rx="0" stroke="#cbd6e7"/><text x="710.000" y="595.000" font-size="21" fill="#14263d" text-anchor="start" font-weight="700" >PAPER</text><text x="710.000" y="638.000" font-size="19" fill="#14263d" text-anchor="start" font-weight="400" >#FFFFFF</text><text x="710.000" y="685.000" font-size="17" fill="#596b80" text-anchor="start" font-weight="400" >纸面</text><rect x="1020.000" y="235.000" width="290.000" height="310.000" fill="#dce7fc" rx="0" stroke="#cbd6e7"/><text x="1020.000" y="595.000" font-size="21" fill="#14263d" text-anchor="start" font-weight="700" >MIST</text><text x="1020.000" y="638.000" font-size="19" fill="#14263d" text-anchor="start" font-weight="400" >#DCE7FC</text><text x="1020.000" y="685.000" font-size="17" fill="#596b80" text-anchor="start" font-weight="400" >浅色层级</text><text x="90.000" y="775.000" font-size="18" fill="#596b80" text-anchor="start" font-weight="400" >颜色承担品牌与层级；功能性成功、错误、告警另按产品语义定义。</text></svg>
