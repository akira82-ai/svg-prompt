<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">图案平铺 Pattern</text><text x="60" y="104" font-size="14" fill="#6b7785">设计一个单元，然后交出控制权——它会长满一切</text><defs><pattern id="pt1" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#e8f1fe"/><path d="M 30 14 Q 31.56 24.44 42 26 Q 31.56 27.56 30 38 Q 28.44 27.56 18 26 Q 28.44 24.44 30 14 Z" fill="#4f8ef7"/><circle cx="8" cy="52" r="4" fill="#9b59f5" opacity="0.8"/><circle cx="52" cy="52" r="4" fill="#4f8ef7" opacity="0.5"/></pattern><pattern id="pt2" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#141c28"/><path d="M 30 14 Q 31.56 24.44 42 26 Q 31.56 27.56 30 38 Q 28.44 27.56 18 26 Q 28.44 24.44 30 14 Z" fill="rgba(255,255,255,0.9)"/><circle cx="8" cy="52" r="4" fill="rgba(255,255,255,0.5)"/><circle cx="52" cy="52" r="4" fill="rgba(155,89,245,0.8)"/></pattern></defs><g><rect x="60" y="140" width="340" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="110" y="300" width="240" height="240" fill="url(#pt1)"/><rect x="148" y="338" width="60" height="60" fill="none" stroke="#1c2733" stroke-dasharray="5 4" stroke-width="1.5"/><text x="230" y="240" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">单元</text><text x="230" y="264" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">unit</text><text x="230" y="580" font-size="13" fill="#6b7785" text-anchor="middle">虚线框 = 一个重复单元</text></g><g><rect x="430" y="140" width="340" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="470" y="300" width="260" height="240" fill="url(#pt1)"/><text x="600" y="240" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">平铺</text><text x="600" y="264" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">tile</text><text x="600" y="580" font-size="13" fill="#6b7785" text-anchor="middle">图案用 &lt;pattern&gt; 无缝复制</text></g><g><rect x="800" y="140" width="340" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="840" y="300" width="260" height="240" fill="url(#pt2)"/><text x="970" y="240" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">暗色版本</text><text x="970" y="264" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">dark</text><text x="970" y="580" font-size="13" fill="#6b7785" text-anchor="middle">换一套颜色就是新配色</text></g></svg>