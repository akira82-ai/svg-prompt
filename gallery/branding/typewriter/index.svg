<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">品牌文案揭示</title><desc id="desc">两行品牌文案MAKE WORK / TRACEABLE，第一行常显，第二行2秒线性遮罩揭示，延迟.4秒；不声称逐字打字，结束完整保留，不循环闪烁。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" fill="#eef2f6" rx="0" /><text x="64.000" y="48.000" font-size="14" fill="#596b80" text-anchor="start" font-weight="400" >SVG / BRAND &amp; TYPE</text><text x="1336.000" y="48.000" font-size="14" fill="#596b80" text-anchor="end" font-weight="400" >NOVA / CONCEPT BRAND</text><line x1="64.000" y1="70.000" x2="1336.000" y2="70.000" stroke="#596b80" stroke-width="1" /><text x="64.000" y="118.000" font-size="32" fill="#14263d" text-anchor="start" font-weight="700" >品牌文案揭示</text><text x="64.000" y="153.000" font-size="18" fill="#596b80" text-anchor="start" font-weight="400" >Brand Copy Reveal</text><line x1="64.000" y1="846.000" x2="1336.000" y2="846.000" stroke="#596b80" stroke-width="1" /><text x="64.000" y="878.000" font-size="14" fill="#596b80" text-anchor="start" font-weight="400" >示例品牌与版式 · 字体依赖系统环境 · 印刷图仅为示意</text><text x="1336.000" y="878.000" font-size="14" fill="#596b80" text-anchor="end" font-weight="400" >SVG-PROMPT</text><defs><symbol id="nova-mark" viewBox="0 0 6 6"><path d="M0 0 L2 0 L6 4 L6 6 L4 6 L0 2 Z M4 0 L6 0 L6 2 Z M0 4 L0 6 L2 6 Z"/></symbol><symbol id="nova-wordmark" viewBox="0 0 266 60"><path d="M0 0 H12 L42 38 V0 H54 V60 H42 L12 22 V60 H0 Z" transform="translate(0 0)" fill-rule="evenodd"/><path d="M12 0 H44 L56 12 V48 L44 60 H12 L0 48 V12 Z M17 12 L12 17 V43 L17 48 H39 L44 43 V17 L39 12 Z" transform="translate(66 0)" fill-rule="evenodd"/><path d="M0 0 H14 L30 43 L46 0 H60 L38 60 H22 Z" transform="translate(134 0)" fill-rule="evenodd"/><path d="M0 60 L22 0 H38 L60 60 H45 L40 45 H20 L15 60 Z M26 30 H34 L30 17 Z" transform="translate(206 0)" fill-rule="evenodd"/></symbol></defs><rect x="90.000" y="235.000" width="1220.000" height="550.000" fill="#14263d" rx="0" /><use href="#nova-wordmark" x="140" y="290" width="199.5000" height="45" fill="#fff" data-word-height="45" /><text x="140.000" y="430.000" font-size="60" fill="#fff" text-anchor="start" font-weight="700" >MAKE WORK</text><defs><clipPath id="copy-reveal"><rect x="140" y="475" width="0" height="90"><animate attributeName="width" values="0;760" keyTimes="0;1" dur="2s" begin=".4s" fill="freeze"/></rect></clipPath></defs><g class="motion" clip-path="url(#copy-reveal)"><text x="140.000" y="545.000" font-size="70" fill="#fff" text-anchor="start" font-weight="700" >TRACEABLE.</text></g><text x="140.000" y="545.000" font-size="70" fill="#fff" text-anchor="start" font-weight="700" class="fallback">TRACEABLE.</text><text x="140.000" y="675.000" font-size="22" fill="#d5dfed" text-anchor="start" font-weight="400" >从资料到结果，保留每一步的来由。</text><text x="140.000" y="735.000" font-size="15" fill="#b8cff6" text-anchor="start" font-weight="400" >一次揭示 / 完整终帧</text><style>.fallback{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.fallback{display:inline}}</style></svg>
