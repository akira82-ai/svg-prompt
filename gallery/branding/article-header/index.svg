<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">文章头图与裁切</title><desc id="desc">原画780×438.75为16:9；标题安全区x120..620/y330..610，副图在右可裁切；右下为缩略重排而非同画面自动裁切。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" fill="#ece9e2" rx="0" /><text x="64.000" y="48.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >SVG / BRAND &amp; TYPE</text><text x="1336.000" y="48.000" font-size="14" fill="#656862" text-anchor="end" font-weight="400" >FIELD / CONCEPT BRAND</text><line x1="64.000" y1="70.000" x2="1336.000" y2="70.000" stroke="#656862" stroke-width="1" /><text x="64.000" y="118.000" font-size="32" fill="#272b29" text-anchor="start" font-weight="700" >文章头图与裁切</text><text x="64.000" y="153.000" font-size="18" fill="#656862" text-anchor="start" font-weight="400" >Article Header and Cropping</text><line x1="64.000" y1="846.000" x2="1336.000" y2="846.000" stroke="#656862" stroke-width="1" /><text x="64.000" y="878.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >示例品牌与版式 · 字体依赖系统环境 · 印刷图仅为示意</text><text x="1336.000" y="878.000" font-size="14" fill="#656862" text-anchor="end" font-weight="400" >SVG-PROMPT</text><defs><symbol id="nova-mark" viewBox="0 0 6 6"><path d="M0 0 L2 0 L6 4 L6 6 L4 6 L0 2 Z M4 0 L6 0 L6 2 Z M0 4 L0 6 L2 6 Z"/></symbol><symbol id="nova-wordmark" viewBox="0 0 266 60"><path d="M0 0 H12 L42 38 V0 H54 V60 H42 L12 22 V60 H0 Z" transform="translate(0 0)" fill-rule="evenodd"/><path d="M12 0 H44 L56 12 V48 L44 60 H12 L0 48 V12 Z M17 12 L12 17 V43 L17 48 H39 L44 43 V17 L39 12 Z" transform="translate(66 0)" fill-rule="evenodd"/><path d="M0 0 H14 L30 43 L46 0 H60 L38 60 H22 Z" transform="translate(134 0)" fill-rule="evenodd"/><path d="M0 60 L22 0 H38 L60 60 H45 L40 45 H20 L15 60 Z M26 30 H34 L30 17 Z" transform="translate(206 0)" fill-rule="evenodd"/></symbol></defs><text x="90.000" y="225.000" font-size="16" fill="#656862" text-anchor="start" font-weight="400" >16:9 / 原始横向画面</text><rect x="90.000" y="250.000" width="780.000" height="438.750" fill="#faf8f1" rx="0" /><text x="125.000" y="305.000" font-size="18" fill="#272b29" text-anchor="start" font-weight="700" >FIELD / 见地</text><text x="125.000" y="425.000" font-size="48" fill="#272b29" text-anchor="start" font-weight="700" >让信息，</text><text x="125.000" y="499.000" font-size="48" fill="#272b29" text-anchor="start" font-weight="700" >有自己的顺序。</text><text x="125.000" y="640.000" font-size="16" fill="#656862" text-anchor="start" font-weight="400" >编辑设计 / 2026 年 10 月</text><circle cx="740" cy="440" r="105" fill="#e9d9ce" /><rect x="640.000" y="420.000" width="90.000" height="160.000" fill="#b23c32" rx="0" /><rect x="120.000" y="330.000" width="500.000" height="280.000" fill="none" rx="0" stroke="#b23c32" stroke-dasharray="5 5"/><text x="950.000" y="280.000" font-size="24" fill="#272b29" text-anchor="start" font-weight="600" >裁切安全区</text><text x="950.000" y="355.000" font-size="20" fill="#656862" text-anchor="start" font-weight="400" >文字放在稳定区域。</text><text x="950.000" y="405.000" font-size="20" fill="#656862" text-anchor="start" font-weight="400" >右侧图形允许裁切。</text><text x="950.000" y="455.000" font-size="20" fill="#656862" text-anchor="start" font-weight="400" >缩略图重新检查字重。</text><rect x="940.000" y="570.000" width="330.000" height="186.000" fill="#faf8f1" rx="0" /><text x="960.000" y="625.000" font-size="32" fill="#272b29" text-anchor="start" font-weight="700" >让信息，</text><text x="960.000" y="675.000" font-size="27" fill="#272b29" text-anchor="start" font-weight="700" >有自己的顺序。</text><text x="940.000" y="796.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >缩略图重排示意 / 不声称自动裁切</text></svg>
