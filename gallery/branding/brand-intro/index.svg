<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">品牌动效片头</title><desc id="desc">标识0..0.8s出现，字标0.8..2s揭示，完整NOVA组合与口号稳定；motion遮罩只播放一次，减少动效显示相同intro-final组合。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" fill="#eef2f6" rx="0" /><text x="64.000" y="48.000" font-size="14" fill="#596b80" text-anchor="start" font-weight="400" >SVG / BRAND &amp; TYPE</text><text x="1336.000" y="48.000" font-size="14" fill="#596b80" text-anchor="end" font-weight="400" >NOVA / CONCEPT BRAND</text><line x1="64.000" y1="70.000" x2="1336.000" y2="70.000" stroke="#596b80" stroke-width="1" /><text x="64.000" y="118.000" font-size="32" fill="#14263d" text-anchor="start" font-weight="700" >品牌动效片头</text><text x="64.000" y="153.000" font-size="18" fill="#596b80" text-anchor="start" font-weight="400" >Brand Intro Animation</text><line x1="64.000" y1="846.000" x2="1336.000" y2="846.000" stroke="#596b80" stroke-width="1" /><text x="64.000" y="878.000" font-size="14" fill="#596b80" text-anchor="start" font-weight="400" >示例品牌与版式 · 字体依赖系统环境 · 印刷图仅为示意</text><text x="1336.000" y="878.000" font-size="14" fill="#596b80" text-anchor="end" font-weight="400" >SVG-PROMPT</text><defs><symbol id="nova-mark" viewBox="0 0 6 6"><path d="M0 0 L2 0 L6 4 L6 6 L4 6 L0 2 Z M4 0 L6 0 L6 2 Z M0 4 L0 6 L2 6 Z"/></symbol><symbol id="nova-wordmark" viewBox="0 0 266 60"><path d="M0 0 H12 L42 38 V0 H54 V60 H42 L12 22 V60 H0 Z" transform="translate(0 0)" fill-rule="evenodd"/><path d="M12 0 H44 L56 12 V48 L44 60 H12 L0 48 V12 Z M17 12 L12 17 V43 L17 48 H39 L44 43 V17 L39 12 Z" transform="translate(66 0)" fill-rule="evenodd"/><path d="M0 0 H14 L30 43 L46 0 H60 L38 60 H22 Z" transform="translate(134 0)" fill-rule="evenodd"/><path d="M0 60 L22 0 H38 L60 60 H45 L40 45 H20 L15 60 Z M26 30 H34 L30 17 Z" transform="translate(206 0)" fill-rule="evenodd"/></symbol></defs><rect x="90.000" y="235.000" width="1220.000" height="550.000" fill="#14263d" rx="0" /><g id="intro-final"><use href="#nova-mark" x="290" y="415" width="120" height="120" fill="#fff" data-mark-size="120" /><use href="#nova-wordmark" x="470" y="425" width="443.3333" height="100" fill="#fff" data-word-height="100" /><text x="700.000" y="650.000" font-size="20" fill="#d5dfed" text-anchor="middle" font-weight="400" >MAKE WORK TRACEABLE</text></g><g class="motion"><rect x="270" y="390" width="150" height="170" fill="#14263d"><animate attributeName="opacity" values="1;0" keyTimes="0;1" dur=".8s" fill="freeze"/></rect><rect x="455" y="390" width="500" height="170" fill="#14263d"><animate attributeName="width" values="500;0" keyTimes="0;1" begin=".8s" dur="1.2s" fill="freeze"/><animate attributeName="x" values="455;955" keyTimes="0;1" begin=".8s" dur="1.2s" fill="freeze"/></rect></g><text x="130.000" y="752.000" font-size="16" fill="#b8cff6" text-anchor="start" font-weight="400" class="fallback">标识 → 字标 → 稳定终帧</text><style>.fallback{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.fallback{display:inline}}</style></svg>
