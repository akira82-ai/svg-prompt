<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">品牌文字表达</title><desc id="desc">四种处理共用NOVA矢量轮廓；描边不填色，反白是真实白色字标，光晕叠加清晰前景，不让模糊成为文字主体。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" fill="#eef2f6" rx="0" /><text x="64.000" y="48.000" font-size="14" fill="#596b80" text-anchor="start" font-weight="400" >SVG / BRAND &amp; TYPE</text><text x="1336.000" y="48.000" font-size="14" fill="#596b80" text-anchor="end" font-weight="400" >NOVA / CONCEPT BRAND</text><line x1="64.000" y1="70.000" x2="1336.000" y2="70.000" stroke="#596b80" stroke-width="1" /><text x="64.000" y="118.000" font-size="32" fill="#14263d" text-anchor="start" font-weight="700" >品牌文字表达</text><text x="64.000" y="153.000" font-size="18" fill="#596b80" text-anchor="start" font-weight="400" >Expressive Typography</text><line x1="64.000" y1="846.000" x2="1336.000" y2="846.000" stroke="#596b80" stroke-width="1" /><text x="64.000" y="878.000" font-size="14" fill="#596b80" text-anchor="start" font-weight="400" >示例品牌与版式 · 字体依赖系统环境 · 印刷图仅为示意</text><text x="1336.000" y="878.000" font-size="14" fill="#596b80" text-anchor="end" font-weight="400" >SVG-PROMPT</text><defs><symbol id="nova-mark" viewBox="0 0 6 6"><path d="M0 0 L2 0 L6 4 L6 6 L4 6 L0 2 Z M4 0 L6 0 L6 2 Z M0 4 L0 6 L2 6 Z"/></symbol><symbol id="nova-wordmark" viewBox="0 0 266 60"><path d="M0 0 H12 L42 38 V0 H54 V60 H42 L12 22 V60 H0 Z" transform="translate(0 0)" fill-rule="evenodd"/><path d="M12 0 H44 L56 12 V48 L44 60 H12 L0 48 V12 Z M17 12 L12 17 V43 L17 48 H39 L44 43 V17 L39 12 Z" transform="translate(66 0)" fill-rule="evenodd"/><path d="M0 0 H14 L30 43 L46 0 H60 L38 60 H22 Z" transform="translate(134 0)" fill-rule="evenodd"/><path d="M0 60 L22 0 H38 L60 60 H45 L40 45 H20 L15 60 Z M26 30 H34 L30 17 Z" transform="translate(206 0)" fill-rule="evenodd"/></symbol></defs><rect x="90.000" y="230.000" width="580.000" height="255.000" fill="#ffffff" rx="0" /><text x="118.000" y="270.000" font-size="15" fill="#596b80" text-anchor="start" font-weight="400" >实心 / SOLID</text><use href="#nova-wordmark" x="160" y="325" width="421.1667" height="95" fill="#14263d" data-word-height="95" /><rect x="730.000" y="230.000" width="580.000" height="255.000" fill="#ffffff" rx="0" /><text x="758.000" y="270.000" font-size="15" fill="#596b80" text-anchor="start" font-weight="400" >描边 / OUTLINE</text><use href="#nova-wordmark" x="800" y="325" width="421.1667" height="95" fill="none" data-word-height="95" stroke="#14263d" stroke-width=".7"/><rect x="90.000" y="525.000" width="580.000" height="255.000" fill="#ffffff" rx="0" /><text x="118.000" y="565.000" font-size="15" fill="#596b80" text-anchor="start" font-weight="400" >反白 / REVERSED</text><rect x="120.000" y="590.000" width="520.000" height="145.000" fill="#245ee8" rx="0" /><use href="#nova-wordmark" x="160" y="620" width="421.1667" height="95" fill="#fff" data-word-height="95" /><rect x="730.000" y="525.000" width="580.000" height="255.000" fill="#14263d" rx="0" /><text x="758.000" y="565.000" font-size="15" fill="#d5dfed" text-anchor="start" font-weight="400" >轻度光晕 / GLOW</text><defs><filter id="type-glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5"/></filter></defs><use href="#nova-wordmark" x="800" y="620" width="421.1667" height="95" fill="#87b7ff" data-word-height="95" filter="url(#type-glow)" opacity=".6"/><use href="#nova-wordmark" x="800" y="620" width="421.1667" height="95" fill="#fff" data-word-height="95" /></svg>
