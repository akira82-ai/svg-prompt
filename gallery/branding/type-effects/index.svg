<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">品牌文字特效</text><text x="60" y="104" font-size="14" fill="#6b7785">同一组字母，四种性格</text><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f8ef7"/><stop offset="1" stop-color="#9b59f5"/></linearGradient><mask id="cutout"><rect x="0" y="0" width="1200" height="800" fill="#fff"/><text x="0" y="0" font-size="72" font-weight="800" text-anchor="middle" fill="#000" font-family="Arial Black, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">NOVA</text></mask><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter></defs><g><rect x="60" y="140" width="255" height="380" rx="16" fill="#ffffff" stroke="#e3e8ef"/><text x="187" y="350" font-size="62" fill="none" stroke="#1c2733" stroke-width="1.8" text-anchor="middle" font-weight="800">NOVA</text><text x="187" y="420" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">描边字</text><text x="187" y="444" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">stroke</text></g><g><rect x="335" y="140" width="255" height="380" rx="16" fill="#ffffff" stroke="#e3e8ef"/><text x="462" y="350" font-size="62" fill="url(#tg)" text-anchor="middle" font-weight="800">NOVA</text><text x="462" y="420" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">渐变字</text><text x="462" y="444" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">gradient</text></g><g><rect x="610" y="140" width="255" height="380" rx="16" fill="#ffffff" stroke="#e3e8ef"/><mask id="cutoutM"><rect x="610" y="140" width="255" height="380" fill="#fff"/><text x="737" y="372" font-size="66" font-weight="800" text-anchor="middle" fill="#000" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">NOVA</text></mask><rect x="619" y="288" width="236" height="94" fill="url(#tg)" mask="url(#cutoutM)"/><text x="737" y="420" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600">镂空字</text><text x="737" y="444" font-size="12" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">mask</text></g><g><rect x="885" y="140" width="255" height="380" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="901" y="156" width="223" height="348" rx="12" fill="#141c28"/><text x="1012" y="362" font-size="62" font-weight="800" text-anchor="middle" fill="#9b59f5" filter="url(#glow)" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">NOVA</text><text x="1012" y="362" font-size="62" font-weight="800" text-anchor="middle" fill="#fff" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">NOVA</text><text x="1012" y="428" font-size="15" fill="rgba(255,255,255,0.92)" text-anchor="middle" font-weight="600">霓虹字</text><text x="1012" y="452" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">neon</text></g><g><rect x="60" y="560" width="1080" height="150" rx="16" fill="#ffffff" stroke="#e3e8ef"/><text x="120" y="615" font-size="14" fill="#1c2733" text-anchor="start" font-weight="600">描边</text><text x="120" y="637" font-size="11.5" fill="#8a94a3" text-anchor="start">fill=none</text><text x="400" y="615" font-size="14" fill="#1c2733" text-anchor="start" font-weight="600">渐变</text><text x="400" y="637" font-size="11.5" fill="#8a94a3" text-anchor="start">fill=url(#g)</text><text x="680" y="615" font-size="14" fill="#1c2733" text-anchor="start" font-weight="600">镂空</text><text x="680" y="637" font-size="11.5" fill="#8a94a3" text-anchor="start">mask 反相</text><text x="960" y="615" font-size="14" fill="#1c2733" text-anchor="start" font-weight="600">霓虹</text><text x="960" y="637" font-size="11.5" fill="#8a94a3" text-anchor="start">blur + 双层</text></g></svg>