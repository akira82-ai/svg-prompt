<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">产品发布海报</title><desc id="desc">横向发布海报突出一个主信息复杂工作清楚推进、NOVA2.0版本和了解入口；虚构产品，不编造发布日期或性能指标。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" fill="#eef2f6" rx="0" /><text x="64.000" y="48.000" font-size="14" fill="#596b80" text-anchor="start" font-weight="400" >SVG / BRAND &amp; TYPE</text><text x="1336.000" y="48.000" font-size="14" fill="#596b80" text-anchor="end" font-weight="400" >NOVA / CONCEPT BRAND</text><line x1="64.000" y1="70.000" x2="1336.000" y2="70.000" stroke="#596b80" stroke-width="1" /><text x="64.000" y="118.000" font-size="32" fill="#14263d" text-anchor="start" font-weight="700" >产品发布海报</text><text x="64.000" y="153.000" font-size="18" fill="#596b80" text-anchor="start" font-weight="400" >Product Launch Poster</text><line x1="64.000" y1="846.000" x2="1336.000" y2="846.000" stroke="#596b80" stroke-width="1" /><text x="64.000" y="878.000" font-size="14" fill="#596b80" text-anchor="start" font-weight="400" >示例品牌与版式 · 字体依赖系统环境 · 印刷图仅为示意</text><text x="1336.000" y="878.000" font-size="14" fill="#596b80" text-anchor="end" font-weight="400" >SVG-PROMPT</text><defs><symbol id="nova-mark" viewBox="0 0 6 6"><path d="M0 0 L2 0 L6 4 L6 6 L4 6 L0 2 Z M4 0 L6 0 L6 2 Z M0 4 L0 6 L2 6 Z"/></symbol><symbol id="nova-wordmark" viewBox="0 0 266 60"><path d="M0 0 H12 L42 38 V0 H54 V60 H42 L12 22 V60 H0 Z" transform="translate(0 0)" fill-rule="evenodd"/><path d="M12 0 H44 L56 12 V48 L44 60 H12 L0 48 V12 Z M17 12 L12 17 V43 L17 48 H39 L44 43 V17 L39 12 Z" transform="translate(66 0)" fill-rule="evenodd"/><path d="M0 0 H14 L30 43 L46 0 H60 L38 60 H22 Z" transform="translate(134 0)" fill-rule="evenodd"/><path d="M0 60 L22 0 H38 L60 60 H45 L40 45 H20 L15 60 Z M26 30 H34 L30 17 Z" transform="translate(206 0)" fill-rule="evenodd"/></symbol></defs><rect x="90.000" y="225.000" width="1220.000" height="580.000" fill="#14263d" rx="0" /><text x="140.000" y="290.000" font-size="16" fill="#b8cff6" text-anchor="start" font-weight="400" >NOVA / RELEASE 02</text><text x="140.000" y="420.000" font-size="64" fill="#fff" text-anchor="start" font-weight="700" >复杂工作，</text><text x="140.000" y="510.000" font-size="64" fill="#fff" text-anchor="start" font-weight="700" >清楚推进。</text><text x="140.000" y="650.000" font-size="23" fill="#d5dfed" text-anchor="start" font-weight="400" >从资料到结果，保留每一步的来由。</text><rect x="140.000" y="710.000" width="250.000" height="52.000" fill="#fff" rx="4" /><text x="265.000" y="744.000" font-size="17" fill="#14263d" text-anchor="middle" font-weight="600" >了解 NOVA 2.0</text><use href="#nova-mark" x="920" y="355" width="250" height="250" fill="#80aaff" data-mark-size="250" /><line x1="880.000" y1="650.000" x2="1240.000" y2="650.000" stroke="#91b4ed" stroke-width="1" /><text x="1240.000" y="732.000" font-size="14" fill="#d5dfed" text-anchor="end" font-weight="400" >MAKE WORK TRACEABLE</text></svg>
