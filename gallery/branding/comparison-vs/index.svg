<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">对比信息版式</title><desc id="desc">五维比较保留条件，不绝对宣称矢量文件更小或图片无法动画；PNG/APNG与文字提取方式区别清楚。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" fill="#ece9e2" rx="0" /><text x="64.000" y="48.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >SVG / BRAND &amp; TYPE</text><text x="1336.000" y="48.000" font-size="14" fill="#656862" text-anchor="end" font-weight="400" >FIELD / CONCEPT BRAND</text><line x1="64.000" y1="70.000" x2="1336.000" y2="70.000" stroke="#656862" stroke-width="1" /><text x="64.000" y="118.000" font-size="32" fill="#272b29" text-anchor="start" font-weight="700" >对比信息版式</text><text x="64.000" y="153.000" font-size="18" fill="#656862" text-anchor="start" font-weight="400" >Comparison Layout</text><line x1="64.000" y1="846.000" x2="1336.000" y2="846.000" stroke="#656862" stroke-width="1" /><text x="64.000" y="878.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >示例品牌与版式 · 字体依赖系统环境 · 印刷图仅为示意</text><text x="1336.000" y="878.000" font-size="14" fill="#656862" text-anchor="end" font-weight="400" >SVG-PROMPT</text><defs><symbol id="nova-mark" viewBox="0 0 6 6"><path d="M0 0 L2 0 L6 4 L6 6 L4 6 L0 2 Z M4 0 L6 0 L6 2 Z M0 4 L0 6 L2 6 Z"/></symbol><symbol id="nova-wordmark" viewBox="0 0 266 60"><path d="M0 0 H12 L42 38 V0 H54 V60 H42 L12 22 V60 H0 Z" transform="translate(0 0)" fill-rule="evenodd"/><path d="M12 0 H44 L56 12 V48 L44 60 H12 L0 48 V12 Z M17 12 L12 17 V43 L17 48 H39 L44 43 V17 L39 12 Z" transform="translate(66 0)" fill-rule="evenodd"/><path d="M0 0 H14 L30 43 L46 0 H60 L38 60 H22 Z" transform="translate(134 0)" fill-rule="evenodd"/><path d="M0 60 L22 0 H38 L60 60 H45 L40 45 H20 L15 60 Z M26 30 H34 L30 17 Z" transform="translate(206 0)" fill-rule="evenodd"/></symbol></defs><rect x="90.000" y="230.000" width="1220.000" height="560.000" fill="#faf8f1" rx="0" /><text x="350.000" y="290.000" font-size="28" fill="#272b29" text-anchor="middle" font-weight="700" >SVG / 矢量</text><text x="1060.000" y="290.000" font-size="28" fill="#272b29" text-anchor="middle" font-weight="700" >PNG / 位图</text><line x1="125.000" y1="405.000" x2="1275.000" y2="405.000" stroke="#d1cfc7" stroke-width="1" /><text x="700.000" y="365.000" font-size="15" fill="#b23c32" text-anchor="middle" font-weight="600" >缩放</text><text x="140.000" y="365.000" font-size="17" fill="#272b29" text-anchor="start" font-weight="400" >矢量形状可重新绘制</text><text x="805.000" y="365.000" font-size="17" fill="#272b29" text-anchor="start" font-weight="400" >受原始像素尺寸限制</text><line x1="125.000" y1="484.000" x2="1275.000" y2="484.000" stroke="#d1cfc7" stroke-width="1" /><text x="700.000" y="444.000" font-size="15" fill="#b23c32" text-anchor="middle" font-weight="600" >体积</text><text x="140.000" y="444.000" font-size="17" fill="#272b29" text-anchor="start" font-weight="400" >取决于结构与复杂度</text><text x="805.000" y="444.000" font-size="17" fill="#272b29" text-anchor="start" font-weight="400" >取决于像素、内容与压缩</text><line x1="125.000" y1="563.000" x2="1275.000" y2="563.000" stroke="#d1cfc7" stroke-width="1" /><text x="700.000" y="523.000" font-size="15" fill="#b23c32" text-anchor="middle" font-weight="600" >编辑</text><text x="140.000" y="523.000" font-size="17" fill="#272b29" text-anchor="start" font-weight="400" >可修改图形、文字与属性</text><text x="805.000" y="523.000" font-size="17" fill="#272b29" text-anchor="start" font-weight="400" >主要修改像素内容</text><line x1="125.000" y1="642.000" x2="1275.000" y2="642.000" stroke="#d1cfc7" stroke-width="1" /><text x="700.000" y="602.000" font-size="15" fill="#b23c32" text-anchor="middle" font-weight="600" >动效</text><text x="140.000" y="602.000" font-size="17" fill="#272b29" text-anchor="start" font-weight="400" >可用SMIL或CSS，支持依环境</text><text x="805.000" y="602.000" font-size="17" fill="#272b29" text-anchor="start" font-weight="400" >PNG通常静态，APNG支持动画</text><line x1="125.000" y1="721.000" x2="1275.000" y2="721.000" stroke="#d1cfc7" stroke-width="1" /><text x="700.000" y="681.000" font-size="15" fill="#b23c32" text-anchor="middle" font-weight="600" >文字</text><text x="140.000" y="681.000" font-size="17" fill="#272b29" text-anchor="start" font-weight="400" >提取能力取决于嵌入方式</text><text x="805.000" y="681.000" font-size="17" fill="#272b29" text-anchor="start" font-weight="400" >可使用alt，或依赖OCR</text></svg>
