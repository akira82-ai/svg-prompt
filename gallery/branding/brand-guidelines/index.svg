<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>品牌规范页</title><desc>Brand Book 一页：安全距离、最小尺寸、错误示范与色彩字体</desc><rect width="1200" height="800" fill="#f6f8fb" /><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">品牌规范页 Guidelines</text><text x="60" y="104" font-size="14" fill="#6b7785">规范的尽头是克制：告诉别人"不要做什么"</text><defs><linearGradient id="lg5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8ef7" /><stop offset="1" stop-color="#9b59f5" /></linearGradient></defs><defs /><g><rect x="60" y="140" width="1080" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef" /><text x="100" y="200" font-size="12" fill="#6b7785" text-anchor="start" font-weight="700" font-family="SFMono-Regular, Menlo, monospace">CLEAR SPACE · 安全距离</text><rect x="100" y="216" width="220" height="220" fill="none" stroke="#c9d4e3" stroke-dasharray="6 4" /><path d="M 210 271 Q 217.15 318.85 265 326 Q 217.15 333.15 210 381 Q 202.85 333.15 155 326 Q 202.85 318.85 210 271 Z" fill="url(#lg5)" /><text x="210" y="326" font-size="0" fill="#1c2733" text-anchor="start" /><text x="104" y="232" font-size="11" fill="#6b7785" text-anchor="start" font-weight="600" font-family="SFMono-Regular, Menlo, monospace">x</text><text x="104" y="430" font-size="11" fill="#6b7785" text-anchor="start" font-weight="600" font-family="SFMono-Regular, Menlo, monospace">x</text><text x="100" y="460" font-size="11.5" fill="#6b7785" text-anchor="start">x=55：四周留 Logo 高度的一半</text><text x="380" y="200" font-size="12" fill="#6b7785" text-anchor="start" font-weight="700" font-family="SFMono-Regular, Menlo, monospace">MINIMUM SIZE · 最小尺寸</text><path d="M 420 232 Q 424.68 263.32 456 268 Q 424.68 272.68 420 304 Q 415.32 272.68 384 268 Q 415.32 263.32 420 232 Z" fill="url(#lg5)" transform="translate(420 268) scale(.888888889) translate(-420 -268)" /><text x="420" y="336" font-size="11" fill="#8a94a3" text-a