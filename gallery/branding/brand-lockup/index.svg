<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">品牌组合标识</title><desc id="desc">横版图标90px、字标60px、间隔30px；竖版图标与字标共同中心；小尺寸单色和反白版本保留共同轮廓。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" fill="#eef2f6" rx="0" /><text x="64.000" y="48.000" font-size="14" fill="#596b80" text-anchor="start" font-weight="400" >SVG / BRAND &amp; TYPE</text><text x="1336.000" y="48.000" font-size="14" fill="#596b80" text-anchor="end" font-weight="400" >NOVA / CONCEPT BRAND</text><line x1="64.000" y1="70.000" x2="1336.000" y2="70.000" stroke="#596b80" stroke-width="1" /><text x="64.000" y="118.000" font-size="32" fill="#14263d" text-anchor="start" font-weight="700" >品牌组合标识</text><text x="64.000" y="153.000" font-size="18" fill="#596b80" text-anchor="start" font-weight="400" >Brand Lockups</text><line x1="64.000" y1="846.000" x2="1336.000" y2="846.000" stroke="#596b80" stroke-width="1" /><text x="64.000" y="878.000" font-size="14" fill="#596b80" text-anchor="start" font-weight="400" >示例品牌与版式 · 字体依赖系统环境 · 印刷图仅为示意</text><text x="1336.000" y="878.000" font-size="14" fill="#596b80" text-anchor="end" font-weight="400" >SVG-PROMPT</text><defs><symbol id="nova-mark" viewBox="0 0 6 6"><path d="M0 0 L2 0 L6 4 L6 6 L4 6 L0 2 Z M4 0 L6 0 L6 2 Z M0 4 L0 6 L2 6 Z"/></symbol><symbol id="nova-wordmark" viewBox="0 0 266 60"><path d="M0 0 H12 L42 38 V0 H54 V60 H42 L12 22 V60 H0 Z" transform="translate(0 0)" fill-rule="evenodd"/><path d="M12 0 H44 L56 12 V48 L44 60 H12 L0 48 V12 Z M17 12 L12 17 V43 L17 48 H39 L44 43 V17 L39 12 Z" transform="translate(66 0)" fill-rule="evenodd"/><path d="M0 0 H14 L30 43 L46 0 H60 L38 60 H22 Z" transform="translate(134 0)" fill-rule="evenodd"/><path d="M0 60 L22 0 H38 L60 60 H45 L40 45 H20 L15 60 Z M26 30 H34 L30 17 Z" transform="translate(206 0)" fill-rule="evenodd"/></symbol></defs><rect x="90.000" y="235.000" width="1220.000" height="555.000" fill="#ffffff" rx="0" /><use href="#nova-mark" x="150" y="330" width="90" height="90" fill="#245ee8" data-mark-size="90" /><use href="#nova-wordmark" x="270" y="345" width="266.0000" height="60" fill="#14263d" data-word-height="60" /><text x="150.000" y="490.000" font-size="17" fill="#596b80" text-anchor="start" font-weight="400" >横版 / 图标高 1.5h / 间隔 0.5h</text><use href="#nova-mark" x="905" y="310" width="90" height="90" fill="#245ee8" data-mark-size="90" /><use href="#nova-wordmark" x="817" y="430" width="266.0000" height="60" fill="#14263d" data-word-height="60" /><text x="855.000" y="560.000" font-size="17" fill="#596b80" text-anchor="start" font-weight="400" >竖版 / 居中组合</text><use href="#nova-mark" x="150" y="625" width="60" height="60" fill="#14263d" data-mark-size="60" /><use href="#nova-wordmark" x="235" y="640" width="133.0000" height="30" fill="#14263d" data-word-height="30" /><rect x="750.000" y="610.000" width="490.000" height="125.000" fill="#14263d" rx="0" /><use href="#nova-mark" x="780" y="640" width="60" height="60" fill="#fff" data-mark-size="60" /><use href="#nova-wordmark" x="865" y="655" width="133.0000" height="30" fill="#fff" data-word-height="30" /></svg>
