<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">杂志式封面</title><desc id="desc">4:5杂志封面440×550，FIELD刊头、08期/2026年10月、主标题秩序也有温度和两条导读；图形背景与主标题阅读层级分离。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" fill="#ece9e2" rx="0" /><text x="64.000" y="48.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >SVG / BRAND &amp; TYPE</text><text x="1336.000" y="48.000" font-size="14" fill="#656862" text-anchor="end" font-weight="400" >FIELD / CONCEPT BRAND</text><line x1="64.000" y1="70.000" x2="1336.000" y2="70.000" stroke="#656862" stroke-width="1" /><text x="64.000" y="118.000" font-size="32" fill="#272b29" text-anchor="start" font-weight="700" >杂志式封面</text><text x="64.000" y="153.000" font-size="18" fill="#656862" text-anchor="start" font-weight="400" >Magazine Cover</text><line x1="64.000" y1="846.000" x2="1336.000" y2="846.000" stroke="#656862" stroke-width="1" /><text x="64.000" y="878.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >示例品牌与版式 · 字体依赖系统环境 · 印刷图仅为示意</text><text x="1336.000" y="878.000" font-size="14" fill="#656862" text-anchor="end" font-weight="400" >SVG-PROMPT</text><defs><symbol id="nova-mark" viewBox="0 0 6 6"><path d="M0 0 L2 0 L6 4 L6 6 L4 6 L0 2 Z M4 0 L6 0 L6 2 Z M0 4 L0 6 L2 6 Z"/></symbol><symbol id="nova-wordmark" viewBox="0 0 266 60"><path d="M0 0 H12 L42 38 V0 H54 V60 H42 L12 22 V60 H0 Z" transform="translate(0 0)" fill-rule="evenodd"/><path d="M12 0 H44 L56 12 V48 L44 60 H12 L0 48 V12 Z M17 12 L12 17 V43 L17 48 H39 L44 43 V17 L39 12 Z" transform="translate(66 0)" fill-rule="evenodd"/><path d="M0 0 H14 L30 43 L46 0 H60 L38 60 H22 Z" transform="translate(134 0)" fill-rule="evenodd"/><path d="M0 60 L22 0 H38 L60 60 H45 L40 45 H20 L15 60 Z M26 30 H34 L30 17 Z" transform="translate(206 0)" fill-rule="evenodd"/></symbol></defs><rect x="150.000" y="230.000" width="440.000" height="550.000" fill="#faf8f1" rx="0" /><text x="178.000" y="295.000" font-size="60" fill="#272b29" text-anchor="start" font-weight="700" font-family="Georgia, serif" >FIELD</text><text x="178.000" y="331.000" font-size="14" fill="#272b29" text-anchor="start" font-weight="400" >见地 / DESIGN &amp; CULTURE</text><line x1="178.000" y1="355.000" x2="562.000" y2="355.000" stroke="#656862" stroke-width="1" /><text x="178.000" y="389.000" font-size="14" fill="#b23c32" text-anchor="start" font-weight="400" >08 / OCTOBER 2026</text><circle cx="430" cy="545" r="125" fill="#e9d9ce" /><rect x="420.000" y="460.000" width="110.000" height="210.000" fill="#b23c32" rx="0" /><text x="178.000" y="495.000" font-size="44" fill="#272b29" text-anchor="start" font-weight="700" >秩序，</text><text x="178.000" y="560.000" font-size="44" fill="#272b29" text-anchor="start" font-weight="700" >也有温度。</text><text x="178.000" y="695.000" font-size="16" fill="#272b29" text-anchor="start" font-weight="400" >设计系统如何形成自己的性格</text><text x="178.000" y="728.000" font-size="16" fill="#272b29" text-anchor="start" font-weight="400" >字体 · 材料 · 阅读</text><text x="720.000" y="300.000" font-size="25" fill="#272b29" text-anchor="start" font-weight="400" >EDITORIAL / 08</text><text x="720.000" y="370.000" font-size="25" fill="#272b29" text-anchor="start" font-weight="400" >一个主标题</text><text x="720.000" y="440.000" font-size="25" fill="#272b29" text-anchor="start" font-weight="400" >一个主视觉</text><text x="720.000" y="510.000" font-size="25" fill="#272b29" text-anchor="start" font-weight="400" >三层信息</text><text x="720.000" y="665.000" font-size="18" fill="#656862" text-anchor="start" font-weight="400" >期号与日期放在稳定位置。</text><text x="720.000" y="705.000" font-size="18" fill="#656862" text-anchor="start" font-weight="400" >导读辅助封面，而不争夺主视觉。</text><text x="720.000" y="745.000" font-size="18" fill="#656862" text-anchor="start" font-weight="400" >图形与文字是独立、可调整的层。</text></svg>
