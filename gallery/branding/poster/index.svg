<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">编辑式品牌海报</title><desc id="desc">竖版400×566近似A3比例，主标题看见秩序、英文副标题ORDER IN VIEW、编辑设计系列说明；排版用留白与字重建立层级。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" fill="#ece9e2" rx="0" /><text x="64.000" y="48.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >SVG / BRAND &amp; TYPE</text><text x="1336.000" y="48.000" font-size="14" fill="#656862" text-anchor="end" font-weight="400" >FIELD / CONCEPT BRAND</text><line x1="64.000" y1="70.000" x2="1336.000" y2="70.000" stroke="#656862" stroke-width="1" /><text x="64.000" y="118.000" font-size="32" fill="#272b29" text-anchor="start" font-weight="700" >编辑式品牌海报</text><text x="64.000" y="153.000" font-size="18" fill="#656862" text-anchor="start" font-weight="400" >Editorial Brand Poster</text><line x1="64.000" y1="846.000" x2="1336.000" y2="846.000" stroke="#656862" stroke-width="1" /><text x="64.000" y="878.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >示例品牌与版式 · 字体依赖系统环境 · 印刷图仅为示意</text><text x="1336.000" y="878.000" font-size="14" fill="#656862" text-anchor="end" font-weight="400" >SVG-PROMPT</text><defs><symbol id="nova-mark" viewBox="0 0 6 6"><path d="M0 0 L2 0 L6 4 L6 6 L4 6 L0 2 Z M4 0 L6 0 L6 2 Z M0 4 L0 6 L2 6 Z"/></symbol><symbol id="nova-wordmark" viewBox="0 0 266 60"><path d="M0 0 H12 L42 38 V0 H54 V60 H42 L12 22 V60 H0 Z" transform="translate(0 0)" fill-rule="evenodd"/><path d="M12 0 H44 L56 12 V48 L44 60 H12 L0 48 V12 Z M17 12 L12 17 V43 L17 48 H39 L44 43 V17 L39 12 Z" transform="translate(66 0)" fill-rule="evenodd"/><path d="M0 0 H14 L30 43 L46 0 H60 L38 60 H22 Z" transform="translate(134 0)" fill-rule="evenodd"/><path d="M0 60 L22 0 H38 L60 60 H45 L40 45 H20 L15 60 Z M26 30 H34 L30 17 Z" transform="translate(206 0)" fill-rule="evenodd"/></symbol></defs><rect x="130.000" y="220.000" width="400.000" height="566.000" fill="#faf8f1" rx="0" /><text x="160.000" y="273.000" font-size="15" fill="#b23c32" text-anchor="start" font-weight="400" >FIELD / 08</text><text x="160.000" y="395.000" font-size="90" fill="#272b29" text-anchor="start" font-weight="700" >看见</text><text x="160.000" y="525.000" font-size="90" fill="#272b29" text-anchor="start" font-weight="700" >秩序</text><line x1="160.000" y1="585.000" x2="500.000" y2="585.000" stroke="#b23c32" stroke-width="5" /><text x="160.000" y="655.000" font-size="20" fill="#272b29" text-anchor="start" font-weight="400" font-family="Georgia, serif" >ORDER / IN VIEW</text><text x="160.000" y="714.000" font-size="15" fill="#272b29" text-anchor="start" font-weight="400" >字体、留白与阅读路径</text><text x="160.000" y="744.000" font-size="15" fill="#272b29" text-anchor="start" font-weight="400" >编辑设计系列 / 示例海报</text><text x="710.000" y="320.000" font-size="26" fill="#272b29" text-anchor="start" font-weight="400" >EDITORIAL POSTER</text><text x="710.000" y="390.000" font-size="26" fill="#272b29" text-anchor="start" font-weight="400" >主标题支配画面</text><text x="710.000" y="460.000" font-size="26" fill="#272b29" text-anchor="start" font-weight="400" >说明退居第二层</text><text x="710.000" y="530.000" font-size="26" fill="#272b29" text-anchor="start" font-weight="400" >信息锚点稳定</text><text x="710.000" y="650.000" font-size="19" fill="#656862" text-anchor="start" font-weight="400" >400×566 近似 A 系列比例。</text><text x="710.000" y="694.000" font-size="19" fill="#656862" text-anchor="start" font-weight="400" >大字、细线、小字形成节奏。</text><text x="710.000" y="738.000" font-size="19" fill="#656862" text-anchor="start" font-weight="400" >不用装饰图形填满所有空白。</text></svg>
