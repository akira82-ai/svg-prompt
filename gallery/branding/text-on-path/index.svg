th="1220.000" height="580.000" fill="#faf5e9" rx="0" /><defs><path id="loam-arc" d="M220 520 A220 220 0 0 1 660 520"/><path id="loam-wave" d="M790 490 C920 360 1070 620 1240 490"/></defs><text font-size="28" fill="#343b2d" letter-spacing="2"><textPath href="#loam-arc" startOffset="50%" text-anchor="middle">LOAM / EARTH &amp; EVERYDAY</textPath></text><circle cx="440.0" cy="525.0" r="75.0" fill="none" stroke="#94583b" stroke-width="2"/><line x1="392.000" y1="543.000" x2="488.000" y2="543.000" stroke="#94583b" stroke-width="2" /><circle cx="440.0" cy="507.0" r="18.0" fill="#94583b" /><text x="440.000" y="710.000" font-size="20" fill="#343b2d" text-anchor="middle" font-weight="400" >弧线建立标识外缘</text><text font-size="25" fill="#94583b"><textPath href="#loam-wave" startOffset="50%" text-anchor="middle">Find your everyday rhythm.</textPath></text><text x="1010.000" y="710.000" font-size="20" fill="#343b2d" text-anchor="middle" font-weight="400" >曲线改变节奏，正文保持直排</text></svg>
