<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">品牌圆形徽章</title><desc id="desc">LOAM单色徽章，外半径215/内半径165/文字路径185；上弧品牌名称、下弧A CONCEPT BRAND，不伪造认证标志。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" fill="#ebe5da" rx="0" /><text x="64.000" y="48.000" font-size="14" fill="#626852" text-anchor="start" font-weight="400" >SVG / BRAND &amp; TYPE</text><text x="1336.000" y="48.000" font-size="14" fill="#626852" text-anchor="end" font-weight="400" >LOAM / CONCEPT BRAND</text><line x1="64.000" y1="70.000" x2="1336.000" y2="70.000" stroke="#626852" stroke-width="1" /><text x="64.000" y="118.000" font-size="32" fill="#343b2d" text-anchor="start" font-weight="700" >品牌圆形徽章</text><text x="64.000" y="153.000" font-size="18" fill="#626852" text-anchor="start" font-weight="400" >Circular Brand Badge</text><line x1="64.000" y1="846.000" x2="1336.000" y2="846.000" stroke="#626852" stroke-width="1" /><text x="64.000" y="878.000" font-size="14" fill="#626852" text-anchor="start" font-weight="400" >示例品牌与版式 · 字体依赖系统环境 · 印刷图仅为示意</text><text x="1336.000" y="878.000" font-size="14" fill="#626852" text-anchor="end" font-weight="400" >SVG-PROMPT</text><defs><symbol id="nova-mark" viewBox="0 0 6 6"><path d="M0 0 L2 0 L6 4 L6 6 L4 6 L0 2 Z M4 0 L6 0 L6 2 Z M0 4 L0 6 L2 6 Z"/></symbol><symbol id="nova-wordmark" viewBox="0 0 266 60"><path d="M0 0 H12 L42 38 V0 H54 V60 H42 L12 22 V60 H0 Z" transform="translate(0 0)" fill-rule="evenodd"/><path d="M12 0 H44 L56 12 V48 L44 60 H12 L0 48 V12 Z M17 12 L12 17 V43 L17 48 H39 L44 43 V17 L39 12 Z" transform="translate(66 0)" fill-rule="evenodd"/><path d="M0 0 H14 L30 43 L46 0 H60 L38 60 H22 Z" transform="translate(134 0)" fill-rule="evenodd"/><path d="M0 60 L22 0 H38 L60 60 H45 L40 45 H20 L15 60 Z M26 30 H34 L30 17 Z" transform="translate(206 0)" fill-rule="evenodd"/></symbol></defs><circle cx="440" cy="505" r="215" fill="#faf5e9" stroke="#94583b" stroke-width="2"/><circle cx="440" cy="505" r="165" fill="none" stroke="#94583b"/><defs><path id="badge-upper" d="M255 505 A185 185 0 0 1 625 505"/><path id="badge-lower" d="M255 505 A185 185 0 0 0 625 505"/></defs><text font-size="26" fill="#343b2d" letter-spacing="3"><textPath href="#badge-upper" startOffset="50%" text-anchor="middle">LOAM / EVERYDAY GOODS</textPath></text><text font-size="20" fill="#343b2d" letter-spacing="2"><textPath href="#badge-lower" startOffset="50%" text-anchor="middle">A CONCEPT BRAND</textPath></text><circle cx="440.0" cy="470.0" r="50.0" fill="none" stroke="#94583b" stroke-width="2"/><line x1="408.000" y1="482.000" x2="472.000" y2="482.000" stroke="#94583b" stroke-width="2" /><circle cx="440.0" cy="458.0" r="12.0" fill="#94583b" /><text x="440.000" y="580.000" font-size="34" fill="#343b2d" text-anchor="middle" font-weight="700" font-family="Georgia, serif" >LOAM</text><text x="820.000" y="345.000" font-size="23" fill="#343b2d" text-anchor="start" font-weight="400" >CIRCULAR / BADGE</text><text x="820.000" y="410.000" font-size="23" fill="#343b2d" text-anchor="start" font-weight="400" >外圈建立边界</text><text x="820.000" y="475.000" font-size="23" fill="#343b2d" text-anchor="start" font-weight="400" >内圈承载标识</text><text x="820.000" y="540.000" font-size="23" fill="#343b2d" text-anchor="start" font-weight="400" >文字沿弧线居中</text><text x="820.000" y="660.000" font-size="18" fill="#626852" text-anchor="start" font-weight="400" >徽章用于品牌识别。</text><text x="820.000" y="700.000" font-size="18" fill="#626852" text-anchor="start" font-weight="400" >不添加虚构认证或质量背书。</text></svg>
