<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">社媒品牌套件</title><desc id="desc">头像240×240、横幅1200×400、方帖1080×1080逻辑规格，分别以240×240/900×300/240×240展示，保持比例；共同NOVA标识。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" fill="#eef2f6" rx="0" /><text x="64.000" y="48.000" font-size="14" fill="#596b80" text-anchor="start" font-weight="400" >SVG / BRAND &amp; TYPE</text><text x="1336.000" y="48.000" font-size="14" fill="#596b80" text-anchor="end" font-weight="400" >NOVA / CONCEPT BRAND</text><line x1="64.000" y1="70.000" x2="1336.000" y2="70.000" stroke="#596b80" stroke-width="1" /><text x="64.000" y="118.000" font-size="32" fill="#14263d" text-anchor="start" font-weight="700" >社媒品牌套件</text><text x="64.000" y="153.000" font-size="18" fill="#596b80" text-anchor="start" font-weight="400" >Social Brand Kit</text><line x1="64.000" y1="846.000" x2="1336.000" y2="846.000" stroke="#596b80" stroke-width="1" /><text x="64.000" y="878.000" font-size="14" fill="#596b80" text-anchor="start" font-weight="400" >示例品牌与版式 · 字体依赖系统环境 · 印刷图仅为示意</text><text x="1336.000" y="878.000" font-size="14" fill="#596b80" text-anchor="end" font-weight="400" >SVG-PROMPT</text><defs><symbol id="nova-mark" viewBox="0 0 6 6"><path d="M0 0 L2 0 L6 4 L6 6 L4 6 L0 2 Z M4 0 L6 0 L6 2 Z M0 4 L0 6 L2 6 Z"/></symbol><symbol id="nova-wordmark" viewBox="0 0 266 60"><path d="M0 0 H12 L42 38 V0 H54 V60 H42 L12 22 V60 H0 Z" transform="translate(0 0)" fill-rule="evenodd"/><path d="M12 0 H44 L56 12 V48 L44 60 H12 L0 48 V12 Z M17 12 L12 17 V43 L17 48 H39 L44 43 V17 L39 12 Z" transform="translate(66 0)" fill-rule="evenodd"/><path d="M0 0 H14 L30 43 L46 0 H60 L38 60 H22 Z" transform="translate(134 0)" fill-rule="evenodd"/><path d="M0 60 L22 0 H38 L60 60 H45 L40 45 H20 L15 60 Z M26 30 H34 L30 17 Z" transform="translate(206 0)" fill-rule="evenodd"/></symbol></defs><rect x="100.000" y="230.000" width="240.000" height="240.000" fill="#14263d" rx="0" data-design-width="240" data-design-height="240"/><use href="#nova-mark" x="175" y="305" width="90" height="90" fill="#fff" data-mark-size="90" /><circle cx="220" cy="350" r="95" fill="none" stroke="#8ea2bf" stroke-dasharray="4 4"/><text x="100.000" y="510.000" font-size="17" fill="#14263d" text-anchor="start" font-weight="400" >头像 / 240×240</text><rect x="390.000" y="230.000" width="900.000" height="300.000" fill="#14263d" rx="0" data-design-width="1200" data-design-height="400"/><use href="#nova-wordmark" x="430" y="300" width="310.3333" height="70" fill="#fff" data-word-height="70" /><text x="430.000" y="445.000" font-size="21" fill="#d5dfed" text-anchor="start" font-weight="400" >MAKE WORK TRACEABLE</text><use href="#nova-mark" x="1060" y="290" width="170" height="170" fill="#80aaff" data-mark-size="170" /><text x="390.000" y="575.000" font-size="17" fill="#14263d" text-anchor="start" font-weight="400" >横幅 / 1200×400 / 等比缩放展示</text><rect x="100.000" y="560.000" width="240.000" height="240.000" fill="#ffffff" rx="0" data-design-width="1080" data-design-height="1080"/><use href="#nova-wordmark" x="120" y="590" width="177.3333" height="40" fill="#14263d" data-word-height="40" /><text x="120.000" y="700.000" font-size="25" fill="#14263d" text-anchor="start" font-weight="700" >复杂工作，</text><text x="120.000" y="740.000" font-size="25" fill="#14263d" text-anchor="start" font-weight="700" >清楚推进。</text><text x="390.000" y="670.000" font-size="30" fill="#14263d" text-anchor="start" font-weight="600" >同一标识 / 三种画幅</text><text x="390.000" y="733.000" font-size="17" fill="#596b80" text-anchor="start" font-weight="400" >方帖逻辑规格1080×1080，缩略展示。</text><text x="390.000" y="767.000" font-size="17" fill="#596b80" text-anchor="start" font-weight="400" >头像保留中心安全区；横幅文字避开右侧视觉。</text></svg>
