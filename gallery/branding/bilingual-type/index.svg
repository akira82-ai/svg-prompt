<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">中英文字体搭配</title><desc id="desc">中文58px粗体搭配英文Georgia36px；数字独立示例。采用系统字体回退，混排字面和基线需实测，不将字号相等当视觉等大。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" fill="#ece9e2" rx="0" /><text x="64.000" y="48.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >SVG / BRAND &amp; TYPE</text><text x="1336.000" y="48.000" font-size="14" fill="#656862" text-anchor="end" font-weight="400" >FIELD / CONCEPT BRAND</text><line x1="64.000" y1="70.000" x2="1336.000" y2="70.000" stroke="#656862" stroke-width="1" /><text x="64.000" y="118.000" font-size="32" fill="#272b29" text-anchor="start" font-weight="700" >中英文字体搭配</text><text x="64.000" y="153.000" font-size="18" fill="#656862" text-anchor="start" font-weight="400" >Bilingual Typography</text><line x1="64.000" y1="846.000" x2="1336.000" y2="846.000" stroke="#656862" stroke-width="1" /><text x="64.000" y="878.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >示例品牌与版式 · 字体依赖系统环境 · 印刷图仅为示意</text><text x="1336.000" y="878.000" font-size="14" fill="#656862" text-anchor="end" font-weight="400" >SVG-PROMPT</text><defs><symbol id="nova-mark" viewBox="0 0 6 6"><path d="M0 0 L2 0 L6 4 L6 6 L4 6 L0 2 Z M4 0 L6 0 L6 2 Z M0 4 L0 6 L2 6 Z"/></symbol><symbol id="nova-wordmark" viewBox="0 0 266 60"><path d="M0 0 H12 L42 38 V0 H54 V60 H42 L12 22 V60 H0 Z" transform="translate(0 0)" fill-rule="evenodd"/><path d="M12 0 H44 L56 12 V48 L44 60 H12 L0 48 V12 Z M17 12 L12 17 V43 L17 48 H39 L44 43 V17 L39 12 Z" transform="translate(66 0)" fill-rule="evenodd"/><path d="M0 0 H14 L30 43 L46 0 H60 L38 60 H22 Z" transform="translate(134 0)" fill-rule="evenodd"/><path d="M0 60 L22 0 H38 L60 60 H45 L40 45 H20 L15 60 Z M26 30 H34 L30 17 Z" transform="translate(206 0)" fill-rule="evenodd"/></symbol></defs><rect x="90.000" y="225.000" width="1220.000" height="580.000" fill="#faf8f1" rx="0" /><text x="130.000" y="275.000" font-size="19" fill="#272b29" text-anchor="start" font-weight="700" >FIELD / 见地</text><text x="130.000" y="405.000" font-size="58" fill="#272b29" text-anchor="start" font-weight="700" >设计的秩序</text><text x="130.000" y="490.000" font-size="58" fill="#272b29" text-anchor="start" font-weight="700" >与阅读的节奏</text><text x="770.000" y="415.000" font-size="36" fill="#272b29" text-anchor="start" font-weight="400" font-family="Georgia, serif" >The order of design.</text><text x="770.000" y="473.000" font-size="36" fill="#272b29" text-anchor="start" font-weight="400" font-family="Georgia, serif" >The rhythm of reading.</text><line x1="130.000" y1="610.000" x2="1270.000" y2="610.000" stroke="#656862" stroke-width="1" /><text x="130.000" y="665.000" font-size="19" fill="#272b29" text-anchor="start" font-weight="400" >中文正文重视字面密度与行距。</text><text x="130.000" y="701.000" font-size="19" fill="#272b29" text-anchor="start" font-weight="400" >英文衬线标题提供编辑感，正文仍保持清楚。</text><text x="770.000" y="665.000" font-size="24" fill="#272b29" text-anchor="start" font-weight="400" font-family="Georgia, serif" >2026 / Issue 08 / 128 pages</text><text x="770.000" y="725.000" font-size="16" fill="#656862" text-anchor="start" font-weight="400" >中英不强求字号相同，而应比较实际字面。</text></svg>
