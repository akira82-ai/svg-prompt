<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">字阶与阅读层级</title><desc id="desc">五阶字号/行高56/64、36/46、24/34、18/29、14/22；行高明确为版式规范，单行SVG文本不声称自动布局。</desc><rect x="0.000" y="0.000" width="1400.000" height="900.000" fill="#ece9e2" rx="0" /><text x="64.000" y="48.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >SVG / BRAND &amp; TYPE</text><text x="1336.000" y="48.000" font-size="14" fill="#656862" text-anchor="end" font-weight="400" >FIELD / CONCEPT BRAND</text><line x1="64.000" y1="70.000" x2="1336.000" y2="70.000" stroke="#656862" stroke-width="1" /><text x="64.000" y="118.000" font-size="32" fill="#272b29" text-anchor="start" font-weight="700" >字阶与阅读层级</text><text x="64.000" y="153.000" font-size="18" fill="#656862" text-anchor="start" font-weight="400" >Type Scale and Hierarchy</text><line x1="64.000" y1="846.000" x2="1336.000" y2="846.000" stroke="#656862" stroke-width="1" /><text x="64.000" y="878.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >示例品牌与版式 · 字体依赖系统环境 · 印刷图仅为示意</text><text x="1336.000" y="878.000" font-size="14" fill="#656862" text-anchor="end" font-weight="400" >SVG-PROMPT</text><defs><symbol id="nova-mark" viewBox="0 0 6 6"><path d="M0 0 L2 0 L6 4 L6 6 L4 6 L0 2 Z M4 0 L6 0 L6 2 Z M0 4 L0 6 L2 6 Z"/></symbol><symbol id="nova-wordmark" viewBox="0 0 266 60"><path d="M0 0 H12 L42 38 V0 H54 V60 H42 L12 22 V60 H0 Z" transform="translate(0 0)" fill-rule="evenodd"/><path d="M12 0 H44 L56 12 V48 L44 60 H12 L0 48 V12 Z M17 12 L12 17 V43 L17 48 H39 L44 43 V17 L39 12 Z" transform="translate(66 0)" fill-rule="evenodd"/><path d="M0 0 H14 L30 43 L46 0 H60 L38 60 H22 Z" transform="translate(134 0)" fill-rule="evenodd"/><path d="M0 60 L22 0 H38 L60 60 H45 L40 45 H20 L15 60 Z M26 30 H34 L30 17 Z" transform="translate(206 0)" fill-rule="evenodd"/></symbol></defs><rect x="90.000" y="225.000" width="1220.000" height="580.000" fill="#faf8f1" rx="0" /><text x="130.000" y="325.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >DISPLAY</text><text x="400.000" y="325.000" font-size="56" fill="#272b29" text-anchor="start" font-weight="700" data-type-size="56" data-leading="64">把重要的事，放在第一眼。</text><text x="1280.000" y="325.000" font-size="14" fill="#656862" text-anchor="end" font-weight="400" >56/64</text><text x="130.000" y="450.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >HEADING</text><text x="400.000" y="450.000" font-size="36" fill="#272b29" text-anchor="start" font-weight="700" data-type-size="36" data-leading="46">排版决定阅读顺序</text><text x="1280.000" y="450.000" font-size="14" fill="#656862" text-anchor="end" font-weight="400" >36/46</text><text x="130.000" y="560.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >SUBHEADING</text><text x="400.000" y="560.000" font-size="24" fill="#272b29" text-anchor="start" font-weight="400" data-type-size="24" data-leading="34">层级来自字号、字重与留白</text><text x="1280.000" y="560.000" font-size="14" fill="#656862" text-anchor="end" font-weight="400" >24/34</text><text x="130.000" y="655.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >BODY</text><text x="400.000" y="655.000" font-size="18" fill="#272b29" text-anchor="start" font-weight="400" data-type-size="18" data-leading="29">正文保持适度行长，让读者顺着内容向下阅读。</text><text x="1280.000" y="655.000" font-size="14" fill="#656862" text-anchor="end" font-weight="400" >18/29</text><text x="130.000" y="735.000" font-size="14" fill="#656862" text-anchor="start" font-weight="400" >CAPTION</text><text x="400.000" y="735.000" font-size="14" fill="#272b29" text-anchor="start" font-weight="400" data-type-size="14" data-leading="22">辅助信息服务理解，不与主标题争夺注意力。</text><text x="1280.000" y="735.000" font-size="14" fill="#656862" text-anchor="end" font-weight="400" >14/22</text></svg>
