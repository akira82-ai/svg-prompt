<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>字阶系统</title><desc>Display 到辅助文字的五级字号梯度与行高</desc><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">字阶系统 Type Scale</text><text x="60" y="104" font-size="14" fill="#6b7785">字号是有刻度的——五级走完一个页面</text><g><rect x="60" y="140" width="1080" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><text x="110" y="200" font-size="11.5" fill="#8a94a3" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">Display · 48/56</text><text x="360" y="238" font-size="48" fill="#1c2733" text-anchor="start" font-weight="700">设计有光</text><rect x="110" y="266" width="980" height="1" fill="#e3e8ef"/><text x="110" y="296" font-size="11.5" fill="#8a94a3" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">H1 · 32/40</text><text x="360" y="322" font-size="32" fill="#1c2733" text-anchor="start" font-weight="700">把提示词变成图纸</text><rect x="110" y="362" width="980" height="1" fill="#e3e8ef"/><text x="110" y="392" font-size="11.5" fill="#8a94a3" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">H2 · 24/32</text><text x="360" y="411" font-size="24" fill="#1c2733" text-anchor="start" font-weight="600">NOVA 品牌排版系统</text><rect x="110" y="458" width="980" height="1" fill="#e3e8ef"/><text x="110" y="488" font-size="11.5" fill="#8a94a3" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">正文 · 15/24</text><text x="360" y="496" font-size="15" fill="#6b7785" text-anchor="start">SVG 是文本，也是图像。它被写下，也被看见；</text><text x="360" y="520" font-size="15" fill="#6b7785" text-anchor="start">被复制，也被渲染。</text><rect x="110" y="554" width="980" height="1" fill="#e3e8ef"/><text x="110" y="584" font-size="11.5" fill="#8a94a3" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">辅助 · 12/16</text><text x="360" y="594" font-size="12" fill="#8a94a3" text-anchor="start">CAPTION · SF MONO · 12PX</text></g><text x="620" y="655" font-size="14" fill="#1c2733" text-anchor="start">实用字阶：48 / 32 / 24 / 15 / 12</text><text x="620" y="683" font-size="14" fill="#6b7785" text-anchor="start">正文永远 15/24——密度与呼吸都在这条线上</text></svg>