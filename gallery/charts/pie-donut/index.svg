<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>饼图与环形图</title><desc>饼图、环形图与半圆仪表的三种占比表达</desc><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">占比三兄弟 Pie · Donut · Gauge</text><text x="60" y="104" font-size="14" fill="#6b7785">构成看饼，总量看环，进度看仪表</text><g><rect x="60" y="140" width="340" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><path d="M 230.0 380.0 L 230.0 250.0 A 130 130 0 0 1 336.5 454.6 Z" fill="#4f8ef7"/><text x="377.0160764910807" y="309.09156754297476" font-size="12.5" fill="#1c2733" text-anchor="middle" font-weight="700">35%</text><path d="M 230.0 380.0 L 335.2 456.4 A 130 130 0 0 1 155.4 486.5 Z" fill="#9b59f5"/><text x="255.81168673163813" y="546.9685761981978" font-size="12.5" fill="#1c2733" text-anchor="middle" font-weight="700">25%</text><path d="M 230.0 380.0 L 153.6 485.2 A 130 130 0 0 1 105.7 342.0 Z" fill="#3fb98f"/><text x="73.07567481129968" y="434.9878040718663" font-size="12.5" fill="#1c2733" text-anchor="middle" font-weight="700">20%</text><path d="M 230.0 380.0 L 106.4 339.8 A 130 130 0 0 1 165.4 267.2 Z" fill="#f5a83c"/><text x="102.86531494199477" y="278.8250416914662" font-size="12.5" fill="#1c2733" text-anchor="middle" font-weight="700">12%</text><path d="M 230.0 380.0 L 167.4 266.1 A 130 130 0 0 1 227.7 250.0 Z" fill="#f65e5e"/><text x="188.96616861779887" y="224.18377841377588" font-size="12.5" fill="#1c2733" text-anchor="middle" font-weight="700">8%</text><text x="230" y="620" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="700">饼图 · 构成占比</text><text x="230" y="644" font-size="12" fill="#6b7785" text-anchor="middle">适合 3–5 个分类</text></g><g><rect x="440" y="140" width="340" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="610" cy="380" r="110" fill="none" stroke="#4f8ef7" stroke-width="44" stroke-dasharray="238.9 452.2" stroke-dashoffset="0.0" transform="rotate(-90 610 380)"/><circle cx="610" cy="380" r="110" fill="none" stroke="#9b59f5" stroke-width="44" stroke-dasharray="169.8 521.4" stroke-dashoffset="-241.9" transform="rotate(-90 610 380)"/><circle cx="610" cy="380" r="110" fill="none" stroke="#3fb98f" stroke-width="44" stroke-dasharray="135.2 555.9" stroke-dashoffset="-414.7" transform="rotate(-90 610 380)"/><circle cx="610" cy="380" r="110" fill="none" stroke="#f5a83c" stroke-width="44" stroke-dasharray="79.9 611.2" stroke-dashoffset="-552.9" transform="rotate(-90 610 380)"/><circle cx="610" cy="380" r="110" fill="none" stroke="#f65e5e" stroke-width="44" stroke-dasharray="52.3 638.9" stroke-dashoffset="-635.9" transform="rotate(-90 610 380)"/><text x="610" y="374" font-size="30" fill="#1c2733" text-anchor="middle" font-weight="800">12,480</text><text x="610" y="404" font-size="12.5" fill="#6b7785" text-anchor="middle">年度总量</text><text x="610" y="620" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="700">环形图 · 总量+构成</text><text x="610" y="644" font-size="12" fill="#6b7785" text-anchor="middle">中心留白放关键数字</text></g><g><rect x="820" y="140" width="340" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><path d="M 870 420 A 120 120 0 0 1 1110 420" fill="none" stroke="#e3e8ef" stroke-width="26" stroke-linecap="round"/><path d="M 870 420 A 120 120 0 0 1 1053.9 318.4" fill="none" stroke="#3fb98f" stroke-width="26" stroke-linecap="round" transform="rotate(0)"/><text x="990" y="394" font-size="40" fill="#1c2733" text-anchor="middle" font-weight="800">68%</text><text x="990" y="426" font-size="12.5" fill="#6b7785" text-anchor="middle">年度目标完成</text><text x="990" y="620" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="700">半圆仪表 · 单一进度</text><text x="990" y="644" font-size="12" fill="#6b7785" text-anchor="middle">一个 KPI 的一切</text></g></svg>