<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">转化漏斗图</title><desc id="desc">累计复购率 4%；人数按等高矩形宽度编码。模拟数据，同一批访客的模拟转化 / 人数。</desc><rect x="0.000" y="0.000" width="1200.000" height="800.000" rx="0" fill="#f3f5f7" /><text x="72.000" y="56.000" font-size="14" fill="#596e81" text-anchor="start" font-weight="400" font-family="SFMono-Regular, Consolas, monospace">SVG / DATA ATLAS</text><line x1="72.000" y1="72.000" x2="1128.000" y2="72.000" stroke="#dce4eb" stroke-width="1" /><text x="72.000" y="119.000" font-size="32" fill="#172a3a" text-anchor="start" font-weight="700" font-family="PingFang SC, Microsoft YaHei, sans-serif">转化漏斗图</text><text x="72.000" y="155.000" font-size="18" fill="#596e81" text-anchor="start" font-weight="400" font-family="PingFang SC, Microsoft YaHei, sans-serif">同一批访客的模拟转化 / 人数</text><rect x="72.000" y="178.000" width="1056.000" height="49.000" rx="5" fill="#e7edf3" /><text x="91.000" y="210.000" font-size="18" fill="#172a3a" text-anchor="start" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif">累计复购率 4%；人数按等高矩形宽度编码</text><line x1="72.000" y1="714.000" x2="1128.000" y2="714.000" stroke="#dce4eb" stroke-width="1" /><text x="72.000" y="746.000" font-size="15" fill="#596e81" text-anchor="start" font-weight="400" font-family="PingFang SC, Microsoft YaHei, sans-serif">模拟数据 · 用于图型演示，不代表真实产品或行业结论</text><text x="1128.000" y="746.000" font-size="14" fill="#596e81" text-anchor="end" font-weight="400" font-family="SFMono-Regular, Consolas, monospace">SVG-PROMPT</text><text x="90.000" y="275.000" font-size="16" fill="#596e81" text-anchor="start" font-weight="400" font-family="PingFang SC, Microsoft YaHei, sans-serif">阶段</text><text x="820.000" y="275.000" font-size="16" fill="#596e81" text-anchor="start" font-weight="400" font-family="PingFang SC, Microsoft YaHei, sans-serif">人数 / 累计占比</text><text x="1120.000" y="275.000" font-size="16" fill="#5