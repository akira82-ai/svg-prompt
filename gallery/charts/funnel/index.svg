-anchor="start" font-weight="400" font-family="PingFang SC, Microsoft YaHei, sans-serif">支付</text><rect x="458.800" y="520.000" width="62.400" height="47.000" rx="0" fill="#2678d9" data-value="1200" data-scale="0.052"/><text x="820.000" y="549.000" font-size="17" fill="#172a3a" text-anchor="start" font-weight="400" font-family="SFMono-Regular, Consolas, monospace">1,200 / 12%</text><text x="1120.000" y="549.000" font-size="17" fill="#00a887" text-anchor="end" font-weight="400" font-family="SFMono-Regular, Consolas, monospace">66.7%</text><text x="90.000" y="623.000" font-size="19" fill="#172a3a" text-anchor="start" font-weight="400" font-family="PingFang SC, Microsoft YaHei, sans-serif">复购</text><rect x="479.600" y="591.000" width="20.800" height="47.000" rx="0" fill="#2678d9" data-value="400" data-scale="0.052"/><text x="820.000" y="620.000" font-size="17" fill="#172a3a" text-anchor="start" font-weight="400" font-family="SFMono-Regular, Consolas, monospace">400 / 4%</text><text x="1120.000" y="620.000" font-size="17" fill="#00a887" text-anchor="end" font-weight="400" font-family="SFMono-Regular, Consolas, monospace">33.3%</text></svg>
