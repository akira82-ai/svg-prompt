<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">转化漏斗 Funnel</text><text x="60" y="104" font-size="14" fill="#6b7785">每一层都在筛人——宽度与数值成正比</text><g><rect x="60" y="140" width="1080" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><path d="M 140 180 L 660 180 L 660 252 L 140 252 Z" fill="#dbe9fd"/><text x="400" y="210" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="700">访问</text><text x="400" y="234" font-size="13" fill="#1c2733" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace" font-weight="600">10,000</text><path d="M 140 276 L 660 276 L 509 348 L 291 348 Z" fill="#b6d2fb"/><text x="400" y="306" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="700">加购</text><text x="400" y="330" font-size="13" fill="#1c2733" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace" font-weight="600">4,200</text><text x="760" y="284" font-size="12.5" fill="#6b7785" font-family="SFMono-Regular, Menlo, monospace" font-weight="600">↓ 转化 42%</text><path d="M 291 372 L 509 372 L 447 444 L 353 444 Z" fill="#8ab6f9"/><text x="400" y="402" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">下单</text><text x="400" y="426" font-size="13" fill="#ffffff" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace" font-weight="600">1,800</text><text x="760" y="380" font-size="12.5" fill="#6b7785" font-family="SFMono-Regular, Menlo, monospace" font-weight="600">↓ 转化 43%</text><path d="M 353 468 L 447 468 L 431 540 L 369 540 Z" fill="#5c9af8"/><text x="400" y="498" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">支付</text><text x="400" y="522" font-size="13" fill="#ffffff" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace" font-weight="600">1,200</text><text x="760" y="476" font-size="12.5" fill="#6b7785" font-family="SFMono-Regular, Menlo, monospace" font-weight="600">↓ 转化 67%</text><path d="M 369 564 L 431 564 L 410 636 L 390 636 Z" fill="#2f7df5"/><text x="400" y="594" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">复购</text><text x="400" y="618" font-size="13" fill="#ffffff" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace" font-weight="600">400</text><text x="760" y="572" font-size="12.5" fill="#6b7785" font-family="SFMono-Regular, Menlo, monospace" font-weight="600">↓ 转化 33%</text><text x="760" y="188" font-size="13.5" fill="#1c2733" font-weight="700">整体转化 4%</text></g></svg>