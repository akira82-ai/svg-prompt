<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#0a0f1a"/><text x="60" y="76" font-size="28" font-weight="700" fill="#e8eef7">引力轨道</text><text x="60" y="104" font-size="14" fill="#7c8db0">恒星呼吸 + 行星公转</text><defs>
    <radialGradient id="sunG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8"/>
      <stop offset="0.6" stop-color="#f7a23b"/>
      <stop offset="1" stop-color="#f65e5e"/>
    </radialGradient>
    
    
    <path id="orbit1" d="M790,260 a100,40 0 1,0 200,0 a100,40 0 1,0 -200,0" fill="none"/>
    <path id="orbit2" d="M740,260 a150,60 0 1,0 300,0 a150,60 0 1,0 -300,0" fill="none"/>
    <path id="flow1" d="M100,520 L540,520"/>
    <path id="flow2" d="M100,560 L540,560"/>
    <path id="flow3" d="M100,600 L540,600"/>
    <path id="ecg" d="M660,560 L700,560 L715,545 L730,575 L745,505 L760,615 L775,560 L820,560 L835,545 L850,575 L865,505 L880,615 L895,560 L940,560 L955,545 L970,575 L985,505 L1000,615 L1015,560 L1060,560 L1105,560"/>
  </defs><g transform="translate(600,400) scale(1.35) translate(-890,-250)"><g>
    <rect x="620" y="110" width="540" height="280" rx="14" fill="#0e1524" stroke="#22304d"/>
    <text x="644" y="146" font-size="18" font-weight="700" fill="#e8eef7">引力轨道</text>
    <use href="#orbit2" stroke="#24406b" stroke-width="1.5"/>
    <use href="#orbit1" stroke="#2a4a74" stroke-width="1.5"/>
    <circle cx="890" cy="260" r="26" fill="url(#sunG)">
      <animate attributeName="r" values="26;31;26" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="7" fill="#5b9dff">
      <animateMotion dur="6s" repeatCount="indefinite">
        <mpath href="#orbit1"/>
      </animateMotion>
    </circle>
    <circle r="5" fill="#c98ef7">
      <animateMotion dur="11s" repeatCount="indefinite">
        <mpath href="#orbit2"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="#2bb3a3">
      <animateMotion dur="11s" begin="-5.5s" repeatCount="indefinite">
        <mpath href="#orbit2"/>
      </animateMotion>
    </circle>
    <text x="644" y="366" font-size="11.5" fill="#6f84a8" font-family="SFMono-Regular, Menlo, monospace">&lt;animateMotion&gt; + &lt;mpath href="#orbit"&gt; 沿任意曲线运动</text>
  </g></g></svg>