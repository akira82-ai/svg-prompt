<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#0a0f1a"/><text x="60" y="76" font-size="28" font-weight="700" fill="#e8eef7">数据流水线</text><text x="60" y="104" font-size="14" fill="#7c8db0">流动虚线 + 光点巡游</text><defs>
    
    
    
    <path id="orbit1" d="M790,260 a100,40 0 1,0 200,0 a100,40 0 1,0 -200,0" fill="none"/>
    <path id="orbit2" d="M740,260 a150,60 0 1,0 300,0 a150,60 0 1,0 -300,0" fill="none"/>
    <path id="flow1" d="M100,520 L540,520"/>
    <path id="flow2" d="M100,560 L540,560"/>
    <path id="flow3" d="M100,600 L540,600"/>
    <path id="ecg" d="M660,560 L700,560 L715,545 L730,575 L745,505 L760,615 L775,560 L820,560 L835,545 L850,575 L865,505 L880,615 L895,560 L940,560 L955,545 L970,575 L985,505 L1000,615 L1015,560 L1060,560 L1105,560"/>
  </defs><g transform="translate(600,400) scale(1.35) translate(-330,-570)"><g>
    <rect x="60" y="430" width="540" height="280" rx="14" fill="#0e1524" stroke="#22304d"/>
    <text x="84" y="466" font-size="18" font-weight="700" fill="#e8eef7">数据流水线</text>
    <circle cx="92" cy="520" r="7" fill="#5b9dff"/>
    <circle cx="92" cy="560" r="7" fill="#f7a23b"/>
    <circle cx="92" cy="600" r="7" fill="#3ecf8e"/>
    <line x1="100" y1="520" x2="540" y2="520" stroke="#1f3a5f" stroke-width="8" stroke-linecap="round"/>
    <line x1="100" y1="560" x2="540" y2="560" stroke="#1f3a5f" stroke-width="8" stroke-linecap="round"/>
    <line x1="100" y1="600" x2="540" y2="600" stroke="#1f3a5f" stroke-width="8" stroke-linecap="round"/>
    <line x1="100" y1="520" x2="540" y2="520" stroke="#5b9dff" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 16">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="560" x2="540" y2="560" stroke="#f7a23b" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 16">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="600" x2="540" y2="600" stroke="#3ecf8e" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 16">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <rect x="548" y="508" width="30" height="24" rx="6" fill="#141d31" stroke="#2d3f63"/>
    <rect x="548" y="548" width="30" height="24" rx="6" fill="#141d31" stroke="#2d3f63"/>
    <rect x="548" y="588" width="30" height="24" rx="6" fill="#141d31" stroke="#2d3f63"/>
    <circle r="5" fill="#cfe4ff">
      <animateMotion dur="3s" repeatCount="indefinite"><mpath href="#flow1"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#ffe1b8">
      <animateMotion dur="4.2s" begin="0.8s" repeatCount="indefinite"><mpath href="#flow2"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#d4ffe9">
      <animateMotion dur="2.2s" begin="0.4s" repeatCount="indefinite"><mpath href="#flow3"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="84" y="686" font-size="11.5" fill="#6f84a8" font-family="SFMono-Regular, Menlo, monospace">&lt;animate stroke-dashoffset&gt; 流动虚线 + 光点沿管道巡游</text>
