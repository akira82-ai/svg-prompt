<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>日出场景</title><desc>天空由夜转昼、太阳升起、云层漂移</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1026"><animate attributeName="stop-color" values="#0b1026;#1b2a4a;#f2a65e;#8ec9f0;#8ec9f0;#f2a65e;#1b2a4a;#0b1026" keyTimes="0;0.15;0.3;0.5;0.62;0.78;0.9;1" dur="10s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#1b2a4a"><animate attributeName="stop-color" values="#1b2a4a;#3a4a6e;#f7c78e;#c9e8f5;#c9e8f5;#f7c78e;#3a4a6e;#1b2a4a" keyTimes="0;0.15;0.3;0.5;0.62;0.78;0.9;1" dur="10s" repeatCount="indefinite"/></stop></linearGradient></defs><rect width="1200" height="800" fill="url(#sky)"/><circle cx="820" cy="520" r="70" fill="#ffd166"><animate attributeName="cy" values="540;300;300;540" keyTimes="0;0.42;0.6;1" dur="10s" repeatCount="indefinite"/><animate attributeName="r" values="54;84;84;54" keyTimes="0;0.42;0.6;1" dur="10s" repeatCount="indefinite"/></circle><g opacity="0.85"><ellipse cx="260" cy="210" rx="95" ry="26" fill="#fff"><animate attributeName="cx" values="140;420;140" dur="14s" repeatCount="indefinite"/></ellipse><ellipse cx="900" cy="160" rx="70" ry="20" fill="rgba(255,255,255,0.8)"><animate attributeName="cx" values="760;1000;760" dur="11s" repeatCount="indefinite"/></ellipse></g><path d="M 0 640 L 260 470 L 520 640 Z" fill="#22304a" opacity="0.9"/><path d="M 380 660 L 700 440 L 1010 660 Z" fill="#1a2540" opacity="0.95"/><rect x="0" y="640" width="1200" height="160" fill="#141c28"/><text x="60" y="76" font-size="28" fill="#fff" text-anchor="start" font-weight="700">日出场景 Sunrise</text><text x="60" y="104" font-size="14" fill="rgba(255,255,255,0.8)" text-anchor="start">天空转色 · 太阳升起 · 云层漂移（10s 一昼夜循环）</text></svg>