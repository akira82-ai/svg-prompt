<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#0a0f1a"/><text x="60" y="76" font-size="28" font-weight="700" fill="#e8eef7">聚光灯</text><text x="60" y="104" font-size="14" fill="#7c8db0">光斑巡游 · 暗区显隐</text><defs>
    <linearGradient id="blobG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a5cf0"/>
      <stop offset="1" stop-color="#3f8ef7"/>
    </linearGradient>
    <radialGradient id="spotRad">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="spot" maskUnits="userSpaceOnUse" x="620" y="110" width="540" height="280">
      <rect x="620" y="110" width="540" height="280" fill="#000000"/>
      <circle r="110" fill="url(#spotRad)">
        <animateMotion dur="10s" repeatCount="indefinite" path="M760,240 L980,190 L1080,320 L820,340 L700,290 Z"/>
      </circle>
    </mask>
    <g id="secretContent">
      <text x="660" y="212" font-size="56" font-weight="800" fill="#ffd166" letter-spacing="6">TOP SECRET</text>
      <text x="662" y="248" font-size="15" fill="#c6d2e4">只有光斑扫过的地方，才被"看见" —— mask 以亮度决定显隐</text>
      <polyline points="660,290 740,290 760,318 880,318 900,290 1120,290" fill="none" stroke="#5ad0c0" stroke-width="2"/>
      <circle cx="700" cy="344" r="4" fill="#f65e5e"/>
      <circle cx="758" cy="344" r="4" fill="#f7b32b"/>
      <circle cx="816" cy="344" r="4" fill="#3ecf8e"/>
      <circle cx="874" cy="344" r="4" fill="#5b9dff"/>
      <rect x="940" y="312" width="170" height="44" rx="8" fill="none" stroke="#c98ef7"/>
      <text x="1025" y="339" font-size="13" fill="#c98ef7" text-anchor="middle">机密数据 · 001</text>
    </g>
    <path id="ringP" d="M330,595 m-88,0 a88,88 0 1,1 176,0 a88,88 0 1,1 -176,0"/>
    <path id="orbitBlob" d="M330,255 m-115,0 a115,55 0 1,0 230,0 a115,55 0 1,0 -230,0"/>
  </defs><g transform="translate(-290,180)"><g>
    <rect x="620" y="110" width="540" height="280" rx="14" fill="#0e1524" stroke="#22304d"/>
    <text x="644" y="146" font-size="18" font-weight="700" fill="#e8eef7">聚光灯（mask + animateMotion）</text>
    <use href="#secretContent" opacity="0.12"/>
    <g mask="url(#spot)">
      <use href="#secretContent"/>
    </g>
    <text x="644" y="376" font-size="11.5" fill="#6f84a8" font-family="SFMono-Regular, Menlo, monospace">mask 白=显示 黑=隐藏；光斑 = 径向渐变圆沿闭合路径巡游</text>
  </g></g></svg>