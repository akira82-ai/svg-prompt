<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">旋转复制组合</text><text x="60" y="104" font-size="14" fill="#6b7785">定义一个单元，绕圆心复制 N 次——齿轮、花、太阳的共同祖先</text><g><rect x="60" y="140" width="340" height="380" rx="16" fill="#ffffff" stroke="#e3e8ef"/><rect x="216" y="215" width="28" height="34" rx="6" fill="#f5a83c" transform="rotate(0 230 310)"/><rect x="216" y="215" width="28" height="34" rx="6" fill="#f5a83c" transform="rotate(30 230 310)"/><rect x="216" y="215" width="28" height="34" rx="6" fill="#f5a83c" transform="rotate(60 230 310)"/><rect x="216" y="215" width="28" height="34" rx="6" fill="#f5a83c" transform="rotate(90 230 310)"/><rect x="216" y="215" width="28" height="34" rx="6" fill="#f5a83c" transform="rotate(120 230 310)"/><rect x="216" y="215" width="28" height="34" rx="6" fill="#f5a83c" transform="rotate(150 230 310)"/><rect x="216" y="215" width="28" height="34" rx="6" fill="#f5a83c" transform="rotate(180 230 310)"/><rect x="216" y="215" width="28" height="34" rx="6" fill="#f5a83c" transform="rotate(210 230 310)"/><rect x="216" y="215" width="28" height="34" rx="6" fill="#f5a83c" transform="rotate(240 230 310)"/><rect x="216" y="215" width="28" height="34" rx="6" fill="#f5a83c" transform="rotate(270 230 310)"/><rect x="216" y="215" width="28" height="34" rx="6" fill="#f5a83c" transform="rotate(300 230 310)"/><rect x="216" y="215" width="28" height="34" rx="6" fill="#f5a83c" transform="rotate(330 230 310)"/><circle cx="230" cy="310" r="62" fill="#f5a83c"/><circle cx="230" cy="310" r="24" fill="#f6f8fb"/><text x="230" y="480" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">齿轮</text><text x="230" y="504" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">12 齿 × 30°</text></g><g><rect x="430" y="140" width="340" height="380" rx="16" fill="#ffffff" stroke="#e3e8ef"/><ellipse cx="600" cy="258" rx="22" ry="46" fill="#f06292" opacity="0.85" transform="rotate(0 600 310)"/><ellipse cx="600" cy="258" rx="22" ry="46" fill="#f06292" opacity="0.85" transform="rotate(60 600 310)"/><ellipse cx="600" cy="258" rx="22" ry="46" fill="#f06292" opacity="0.85" transform="rotate(120 600 310)"/><ellipse cx="600" cy="258" rx="22" ry="46" fill="#f06292" opacity="0.85" transform="rotate(180 600 310)"/><ellipse cx="600" cy="258" rx="22" ry="46" fill="#f06292" opacity="0.85" transform="rotate(240 600 310)"/><ellipse cx="600" cy="258" rx="22" ry="46" fill="#f06292" opacity="0.85" transform="rotate(300 600 310)"/><circle cx="600" cy="310" r="20" fill="#f5a83c"/><text x="600" y="480" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">六瓣花</text><text x="600" y="504" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">6 瓣 × 60°</text></g><g><rect x="800" y="140" width="340" height="380" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="970" cy="310" r="52" fill="#f5a83c"/><line x1="970" y1="240" x2="970" y2="216" stroke="#f5a83c" stroke-width="8" stroke-linecap="round" transform="rotate(0 970 310)"/><line x1="970" y1="240" x2="970" y2="216" stroke="#f5a83c" stroke-width="8" stroke-linecap="round" transform="rotate(45 970 310)"/><line x1="970" y1="240" x2="970" y2="216" stroke="#f5a83c" stroke-width="8" stroke-linecap="round" transform="rotate(90 970 310)"/><line x1="970" y1="240" x2="970" y2="216" stroke="#f5a83c" stroke-width="8" stroke-linecap="round" transform="rotate(135 970 310)"/><line x1="970" y1="240" x2="970" y2="216" stroke="#f5a83c" stroke-width="8" stroke-linecap="round" transform="rotate(180 970 310)"/><line x1="970" y1="240" x2="970" y2="216" stroke="#f5a83c" stroke-width="8" stroke-linecap="round" transform="rotate(225 970 310)"/><line x1="970" y1="240" x2="970" y2="216" stroke="#f5a83c" stroke-width="8" stroke-linecap="round" transform="rotate(270 970 310)"/><line x1="970" y1="240" x2="970" y2="216" stroke="#f5a83c" stroke-width="8" stroke-linecap="round" transform="rotate(315 970 310)"/><text x="970" y="480" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">太阳</text><text x="970" y="504" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">8 射线 × 45°</text></g><g><rect x="60" y="550" width="1080" height="170" rx="16" fill="#ffffff" stroke="#e3e8ef"/><text x="120" y="620" font-size="16" fill="#1c2733">套路只有一步：把单元写一次，再用 transform="rotate(角度 圆心)" 复制 N 份</text><text x="120" y="650" font-size="16" fill="#1c2733">角度 = 360° / N；改单元形状，整组图形跟着变——齿轮改齿、花改瓣、太阳改射线</text><text x="120" y="680" font-size="16" fill="#1c2733">雪花、徽章、放射状 loading，全部是这一招的变体</text></g></svg>