<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">椭圆 &lt;ellipse&gt;</text><text x="60" y="104" font-size="14" fill="#6b7785">rx 是横向半径、ry 是纵向半径——比例决定胖瘦</text><g><rect x="60" y="140" width="250" height="260" rx="16" fill="#ffffff" stroke="#e3e8ef"/><ellipse cx="185" cy="255" rx="70" ry="70" fill="#3fb98f" opacity="0.9"/><text x="185" y="340" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">rx=70</text><text x="185" y="364" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">rx=70 ry=70</text></g><g><rect x="325" y="140" width="250" height="260" rx="16" fill="#ffffff" stroke="#e3e8ef"/><ellipse cx="450" cy="255" rx="90" ry="70" fill="#3fb98f" opacity="0.9"/><text x="450" y="340" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">rx=90</text><text x="450" y="364" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">rx=90 ry=70</text></g><g><rect x="590" y="140" width="250" height="260" rx="16" fill="#ffffff" stroke="#e3e8ef"/><ellipse cx="715" cy="255" rx="105" ry="60" fill="#3fb98f" opacity="0.9"/><text x="715" y="340" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">rx=105</text><text x="715" y="364" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">rx=105 ry=60</text></g><g><rect x="855" y="140" width="250" height="260" rx="16" fill="#ffffff" stroke="#e3e8ef"/><ellipse cx="980" cy="255" rx="115" ry="45" fill="#3fb98f" opacity="0.9"/><text x="980" y="340" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">rx=115</text><text x="980" y="364" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">rx=115 ry=45</text></g><g><rect x="60" y="430" width="1080" height="280" rx="16" fill="#ffffff" stroke="#e3e8ef"/><g transform="rotate(-24 330 565)"><ellipse cx="330" cy="565" rx="150" ry="70" fill="#3fb98f" opacity="0.85"/></g><text x="330" y="690" font-size="13" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">transform="rotate(-24)"</text><text x="700" y="540" font-size="16" fill="#1c2733">rx = ry 时椭圆退化为正圆</text><text x="700" y="568" font-size="16" fill="#1c2733">用 transform="rotate()" 可把椭圆转到任意角度</text><text x="700" y="596" font-size="16" fill="#1c2733">轨迹光、行星轨道、波纹都从椭圆开始</text></g><text x="60" y="760" font-size="14" fill="#6b7785">结论：椭圆 = 圆的压缩体；地球轨道与涟漪的第一步。</text></svg>