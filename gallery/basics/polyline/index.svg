<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">折线 &lt;polyline&gt;</text><text x="60" y="104" font-size="14" fill="#6b7785">points 里一串顶点，按顺序连成线——开放、不闭合</text><g><rect x="60" y="140" width="720" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><polyline points="150,560 290,460 430,520 570,380 710,300" fill="none" stroke="#f5a83c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="150" cy="560" r="7" fill="#f6f8fb" stroke="#f5a83c" stroke-width="3"/><text x="150" y="542" font-size="12" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">1</text><circle cx="290" cy="460" r="7" fill="#f6f8fb" stroke="#f5a83c" stroke-width="3"/><text x="290" y="442" font-size="12" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">2</text><circle cx="430" cy="520" r="7" fill="#f6f8fb" stroke="#f5a83c" stroke-width="3"/><text x="430" y="502" font-size="12" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">3</text><circle cx="570" cy="380" r="7" fill="#f6f8fb" stroke="#f5a83c" stroke-width="3"/><text x="570" y="362" font-size="12" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">4</text><circle cx="710" cy="300" r="7" fill="#f6f8fb" stroke="#f5a83c" stroke-width="3"/><text x="710" y="282" font-size="12" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">5</text><polyline points="150,560 290,460" fill="none" stroke="#6b7785" stroke-dasharray="5 5" opacity="0.4"/><text x="430" y="660" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">首尾不相连 → fill="none" 防止怪异填充</text></g><g><rect x="820" y="140" width="320" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><polyline points="860,560 920,480 970,510 1040,360 1100,300" fill="none" stroke="#38b8c9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1100" cy="300" r="6" fill="#38b8c9"/><text x="980" y="220" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">数据折线雏形</text><text x="980" y="640" font-size="14" fill="#6b7785" text-anchor="middle">折线图、轨迹、路径动画</text><text x="980" y="662" font-size="14" fill="#6b7785" text-anchor="middle">的第一块积木</text></g></svg>