<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">正多边形家族</text><text x="60" y="104" font-size="14" fill="#6b7785">同一个外接圆，同一个顶点公式，只改边数 n</text><g><rect x="60" y="140" width="200" height="300" rx="16" fill="#ffffff" stroke="#e3e8ef"/><polygon points="160.0,187.0 227.5,304.0 92.5,304.0" fill="#f65e5e" opacity="0.85"/><text x="160" y="385" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">n=3</text><text x="160" y="408" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">正三边形</text></g><g><rect x="280" y="140" width="200" height="300" rx="16" fill="#ffffff" stroke="#e3e8ef"/><polygon points="380.0,187.0 458.0,265.0 380.0,343.0 302.0,265.0" fill="#f5a83c" opacity="0.85"/><text x="380" y="385" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">n=4</text><text x="380" y="408" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">正四边形</text></g><g><rect x="500" y="140" width="200" height="300" rx="16" fill="#ffffff" stroke="#e3e8ef"/><polygon points="600.0,187.0 674.2,240.9 645.8,328.1 554.2,328.1 525.8,240.9" fill="#3fb98f" opacity="0.85"/><text x="600" y="385" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">n=5</text><text x="600" y="408" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">正五边形</text></g><g><rect x="720" y="140" width="200" height="300" rx="16" fill="#ffffff" stroke="#e3e8ef"/><polygon points="820.0,187.0 887.5,226.0 887.5,304.0 820.0,343.0 752.5,304.0 752.5,226.0" fill="#38b8c9" opacity="0.85"/><text x="820" y="385" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">n=6</text><text x="820" y="408" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">正六边形</text></g><g><rect x="940" y="140" width="200" height="300" rx="16" fill="#ffffff" stroke="#e3e8ef"/><polygon points="1040.0,187.0 1095.2,209.8 1118.0,265.0 1095.2,320.2 1040.0,343.0 984.8,320.2 962.0,265.0 984.8,209.8" fill="#4f8ef7" opacity="0.85"/><text x="1040" y="385" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">n=8</text><text x="1040" y="408" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">正八边形</text></g><g><rect x="60" y="470" width="1080" height="240" rx="16" fill="#ffffff" stroke="#e3e8ef"/><polygon points="220.0,505.0 296.1,560.3 267.0,649.7 173.0,649.7 143.9,560.3" fill="none" stroke="#4f8ef7" stroke-width="22" stroke-linejoin="round"/><polygon points="220.0,505.0 296.1,560.3 267.0,649.7 173.0,649.7 143.9,560.3" fill="#4f8ef7" opacity="0.25"/><text x="220" y="690" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">圆角变体</text><text x="220" y="712" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">stroke-linejoin="round"</text><text x="420" y="560" font-size="16" fill="#1c2733">顶点公式：角度 = 起始角 + 360° × i / n</text><text x="420" y="588" font-size="16" fill="#1c2733">坐标 = 圆心 + 半径 × (cos θ, sin θ)</text><text x="420" y="616" font-size="16" fill="#1c2733">粗描边 + round 拐角 = 免费磨圆角</text></g><text x="60" y="760" font-size="14" fill="#6b7785">结论：n 越大越接近圆——多边形与圆之间只隔着一条顶点公式。</text></svg>