<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">圆 &lt;circle&gt;</text><text x="60" y="104" font-size="14" fill="#6b7785">cx / cy 定圆心，r 定半径——三个属性画一个圆</text><g><rect x="60" y="140" width="340" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="230" cy="330" r="120" fill="#4f8ef7" opacity="0.12" stroke="#4f8ef7" stroke-width="2"/><line x1="230" y1="190" x2="230" y2="470" stroke="#6b7785" stroke-dasharray="4 4"/><line x1="90" y1="330" x2="370" y2="330" stroke="#6b7785" stroke-dasharray="4 4"/><circle cx="230" cy="330" r="4" fill="#f65e5e"/><line x1="230" y1="330" x2="350" y2="330" stroke="#f65e5e" stroke-width="2"/><text x="290" y="318" font-size="13" fill="#f65e5e" font-family="SFMono-Regular, Menlo, monospace">r="120"</text><text x="244" y="352" font-size="13" fill="#f65e5e" font-family="SFMono-Regular, Menlo, monospace">cx,cy</text><text x="230" y="560" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">&lt;circle cx="230" cy="330" r="120"/></text></g><g><rect x="430" y="140" width="340" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="600" cy="330" r="110" fill="none" stroke="#4f8ef7" stroke-width="10" opacity="0.9"/><circle cx="600" cy="330" r="82" fill="none" stroke="#4f8ef7" stroke-width="8" opacity="0.75"/><circle cx="600" cy="330" r="56" fill="none" stroke="#4f8ef7" stroke-width="6" opacity="0.6000000000000001"/><circle cx="600" cy="330" r="32" fill="none" stroke="#4f8ef7" stroke-width="4" opacity="0.45000000000000007"/><text x="600" y="500" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">同心圆组</text><text x="600" y="560" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">改变 r，圆心不动</text></g><g><rect x="800" y="140" width="340" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="905" cy="250" r="55" fill="#4f8ef7"/><text x="905" y="345" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">实心</text><circle cx="1035" cy="250" r="55" fill="none" stroke="#f65e5e" stroke-width="6"/><text x="1035" y="345" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">描边</text><circle cx="970" cy="450" r="55" fill="#9b59f5" opacity="0.4"/><text x="970" y="545" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">半透明 opacity="0.4"</text></g></svg>