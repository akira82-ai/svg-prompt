<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">透明叠色 fill-opacity</text><text x="60" y="104" font-size="14" fill="#6b7785">半透明的颜色互相穿透——三圆叠出七种色区</text><g><rect x="60" y="140" width="520" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="245" cy="330" r="105" fill="#f65e5e" fill-opacity="0.6"/><circle cx="395" cy="330" r="105" fill="#3fb98f" fill-opacity="0.6"/><circle cx="320" cy="450" r="105" fill="#4f8ef7" fill-opacity="0.6"/><text x="320" y="640" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">三个圆 fill-opacity="0.6"</text><text x="320" y="668" font-size="14" fill="#1c2733" text-anchor="middle">两两交叠出混色，中心三色穿透</text></g><g><rect x="620" y="140" width="520" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="740" cy="330" r="62" fill="#4f8ef7" fill-opacity="0.2"/><text x="740" y="440" font-size="13" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">0.2 若隐若现</text><circle cx="885" cy="330" r="62" fill="#4f8ef7" fill-opacity="0.5"/><text x="885" y="440" font-size="13" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">0.5 半透</text><circle cx="1030" cy="330" r="62" fill="#4f8ef7" fill-opacity="0.85"/><text x="1030" y="440" font-size="13" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">0.85 几乎实心</text><rect x="700" y="490" width="360" height="150" rx="12" fill="#fff" stroke="#e3e8ef"/><text x="880" y="545" font-size="15" fill="#1c2733" text-anchor="middle">透明度是"图层感"的来源</text><text x="880" y="573" font-size="15" fill="#1c2733" text-anchor="middle">毛玻璃、蒙层、日历叠加格子</text><text x="880" y="601" font-size="15" fill="#1c2733" text-anchor="middle">全都靠 fill-opacity / opacity 穿针引线</text></g><text x="60" y="760" font-size="14" fill="#6b7785">结论：不透明度让颜色学会互相让路——叠加即配色。</text></svg>