<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">相减与挖洞</text><text x="60" y="104" font-size="14" fill="#6b7785">两个圆的三种关系：挖洞、相减、相交——三种实现方法</text><defs><mask id="moonMask"><rect width="1200" height="800" fill="#fff"/><circle cx="322" cy="265" r="72" fill="#000"/></mask><clipPath id="lensClip"><circle cx="700" cy="265" r="72"/></clipPath></defs><g><rect x="60" y="140" width="340" height="380" rx="16" fill="#ffffff" stroke="#e3e8ef"/><path d="M 120 165 h 220 a 90 90 0 0 1 0 180 h -220 a 90 90 0 0 1 0 -180 z M 230 205 a 50 50 0 0 0 0 100 a 50 50 0 0 0 0 -100 z" fill="#38b8c9" fill-rule="evenodd"/><text x="230" y="420" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">圆环 · 挖洞</text><text x="230" y="446" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">fill-rule="evenodd"</text></g><g><rect x="430" y="140" width="340" height="380" rx="16" fill="#ffffff" stroke="#e3e8ef"/><g mask="url(#moonMask)"><circle cx="290" cy="265" r="72" fill="#38b8c9"/></g><circle cx="322" cy="265" r="72" fill="none" stroke="#6b7785" stroke-dasharray="4 4" opacity="0.5"/><text x="430" y="420" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">月牙 · 相减</text><text x="430" y="446" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">mask 黑色 = 被挖走</text></g><g><rect x="800" y="140" width="340" height="380" rx="16" fill="#ffffff" stroke="#e3e8ef"/><g clip-path="url(#lensClip)"><circle cx="770" cy="265" r="72" fill="#38b8c9"/></g><circle cx="770" cy="265" r="72" fill="none" stroke="#6b7785" stroke-dasharray="4 4" opacity="0.5"/><circle cx="700" cy="265" r="72" fill="none" stroke="#6b7785" stroke-dasharray="4 4" opacity="0.5"/><text x="970" y="420" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">透镜 · 相交</text><text x="970" y="446" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">clipPath = 只留公共区</text></g><g><rect x="60" y="550" width="1080" height="170" rx="16" fill="#ffffff" stroke="#e3e8ef"/><text x="120" y="620" font-size="16" fill="#1c2733">evenodd：同一形状里内外绕数相抵 → 挖洞，环形进度与图标的经典做法</text><text x="120" y="650" font-size="16" fill="#1c2733">mask：黑遮白显 → 能做出柔边月牙；clipPath：硬边裁剪 → 只留交集</text><text x="120" y="680" font-size="16" fill="#1c2733">同样的圆环：粗描边 stroke-width 也能画——三种思路随场景切换</text></g><text x="60" y="760" font-size="14" fill="#6b7785">结论：形状的布尔关系 = 挖洞（evenodd）、相减（mask）、相交（clipPath）。</text></svg>