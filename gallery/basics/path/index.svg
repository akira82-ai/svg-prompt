<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">路径 &lt;path&gt;</text><text x="60" y="104" font-size="14" fill="#6b7785">一个 d 属性走天下——SVG 的一切之本，六个常用命令</text><g><rect x="60" y="140" width="340" height="280" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="230" cy="245" r="8" fill="#38b8c9"/><text x="248" y="250" font-size="13" fill="#6b7785" font-family="SFMono-Regular, Menlo, monospace">M 150 245</text><text x="230" y="372" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">M — 移动到起点（不画线）</text><text x="230" y="396" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">d="M 150 245"</text></g><g><rect x="430" y="140" width="340" height="280" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="480" cy="240" r="6" fill="#38b8c9"/><line x1="480" y1="240" x2="720" y2="300" stroke="#38b8c9" stroke-width="4"/><circle cx="720" cy="300" r="6" fill="#38b8c9"/><text x="600" y="372" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">L — 直线到</text><text x="600" y="396" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">d="M … L 720 300"</text></g><g><rect x="800" y="140" width="340" height="280" rx="16" fill="#ffffff" stroke="#e3e8ef"/><path d="M 850 300 C 900 190, 1010 190, 1060 300" fill="none" stroke="#38b8c9" stroke-width="4"/><line x1="850" y1="300" x2="900" y2="190" stroke="#6b7785" stroke-dasharray="4 4"/><line x1="1010" y1="190" x2="1060" y2="300" stroke="#6b7785" stroke-dasharray="4 4"/><circle cx="900" cy="190" r="5" fill="#f65e5e"/><circle cx="1010" cy="190" r="5" fill="#f65e5e"/><text x="970" y="372" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">C — 三次贝塞尔</text><text x="970" y="396" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">C c1x c1y, c2x c2y, x y</text></g><g><rect x="60" y="450" width="340" height="280" rx="16" fill="#ffffff" stroke="#e3e8ef"/><path d="M 110 580 Q 230 460, 350 580" fill="none" stroke="#38b8c9" stroke-width="4"/><line x1="110" y1="580" x2="230" y2="460" stroke="#6b7785" stroke-dasharray="4 4"/><line x1="230" y1="460" x2="350" y2="580" stroke="#6b7785" stroke-dasharray="4 4"/><circle cx="230" cy="460" r="5" fill="#f65e5e"/><text x="230" y="682" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">Q — 二次贝塞尔</text><text x="230" y="706" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">Q cx cy, x y</text></g><g><rect x="430" y="450" width="340" height="280" rx="16" fill="#ffffff" stroke="#e3e8ef"/><path d="M 480 620 A 120 120 0 0 1 720 620" fill="none" stroke="#38b8c9" stroke-width="4"/><circle cx="600" cy="600" r="120" fill="none" stroke="#6b7785" stroke-dasharray="3 6"/><text x="600" y="682" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">A — 圆弧</text><text x="600" y="706" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">A rx ry … 大弧方向</text></g><g><rect x="800" y="450" width="340" height="280" rx="16" fill="#ffffff" stroke="#e3e8ef"/><path d="M 850 640 L 970 480 L 1090 640 Z" fill="#38b8c9" opacity="0.3" stroke="#38b8c9" stroke-width="4"/><text x="970" y="665" font-size="13" fill="#6b7785" text-anchor="middle">Z 自动连回起点</text><text x="970" y="682" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">Z — 闭合</text><text x="970" y="706" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">… Z</text></g><text x="60" y="760" font-size="14" fill="#6b7785">结论：贝塞尔曲线、圆弧、心形螺旋——复杂图形全部是 d 属性的字符串艺术。</text></svg>