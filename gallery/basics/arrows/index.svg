<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>箭头家族</title><desc>marker 让箭头自动跟随路径方向——直的、弯的、双头的、粗尾的</desc><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">箭头家族 &lt;marker&gt;</text><text x="60" y="104" font-size="14" fill="#6b7785">箭头定义一次，attach 到任意路径上，方向自动跟随</text><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f65e5e"/></marker></defs><g><rect x="60" y="140" width="660" height="360" rx="16" fill="#ffffff" stroke="#e3e8ef"/><line x1="110" y1="220" x2="380" y2="220" stroke="#f65e5e" stroke-width="5" marker-end="url(#arr)"/><polyline points="110,300 250,300 250,360 460,360" fill="none" stroke="#f65e5e" stroke-width="5" marker-end="url(#arr)"/><path d="M 110 440 Q 300 400, 460 440" fill="none" stroke="#f65e5e" stroke-width="5" marker-end="url(#arr)"/><text x="300" y="480" font-size="13" fill="#6b7785" text-anchor="middle">同一条 marker 定义，直线、折线、曲线的方向自动对齐</text></g><g><rect x="760" y="140" width="380" height="360" rx="16" fill="#ffffff" stroke="#e3e8ef"/><line x1="820" y1="250" x2="1080" y2="250" stroke="#4f8ef7" stroke-width="5" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="950" y="310" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">双头：marker-start + end</text><line x1="820" y1="420" x2="1080" y2="420" stroke="#4f8ef7" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arr)"/><text x="950" y="470" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">虚线同样适用</text></g><g><rect x="60" y="530" width="1080" height="190" rx="16" fill="#ffffff" stroke="#e3e8ef"/><polygon points="140,640 380,640 380,610 470,660 380,710 380,680 140,680" fill="#f65e5e" opacity="0.9"/><text x="305" y="705" font-size="13" fill="#6b7785" text-anchor="middle">polygon 手绘的粗尾箭头</text><text x="620" y="640" font-size="16" fill="#1c2733">细箭头交给 marker 自动跟随；</text><text x="620" y="668" font-size="16" fill="#1c2733">粗尾造型箭头用 polygon 手绘——流程图与示意图的两套画法</text></g></svg>