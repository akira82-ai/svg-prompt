<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">多边形 &lt;polygon&gt;</text><text x="60" y="104" font-size="14" fill="#6b7785">顶点串成圈，最后一条边自动连回起点</text><g><rect x="60" y="140" width="560" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><polygon points="220,300 380,250 470,400 330,520 160,430" fill="#9b59f5" opacity="0.25" stroke="#9b59f5" stroke-width="4"/><line x1="160" y1="430" x2="220" y2="300" stroke="#f65e5e" stroke-width="3" stroke-dasharray="7 5"/><circle cx="220" cy="300" r="7" fill="#f6f8fb" stroke="#9b59f5" stroke-width="3"/><text x="220" y="284" font-size="12" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">1</text><circle cx="380" cy="250" r="7" fill="#f6f8fb" stroke="#9b59f5" stroke-width="3"/><text x="380" y="234" font-size="12" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">2</text><circle cx="470" cy="400" r="7" fill="#f6f8fb" stroke="#9b59f5" stroke-width="3"/><text x="470" y="384" font-size="12" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">3</text><circle cx="330" cy="520" r="7" fill="#f6f8fb" stroke="#9b59f5" stroke-width="3"/><text x="330" y="504" font-size="12" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">4</text><circle cx="160" cy="430" r="7" fill="#f6f8fb" stroke="#9b59f5" stroke-width="3"/><text x="160" y="414" font-size="12" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">5</text><text x="340" y="640" font-size="13" fill="#f65e5e" text-anchor="middle">红色虚线 = 自动闭合的最后一条边</text></g><g><rect x="660" y="140" width="480" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><polyline points="740,300 830,240 930,280 980,380 860,430" fill="none" stroke="#6b7785" stroke-width="4"/><text x="860" y="350" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">polyline：开放</text><polygon points="740,540 830,480 930,520 980,620 860,670" fill="#9b59f5" opacity="0.3" stroke="#9b59f5" stroke-width="4"/><text x="860" y="560" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">polygon：闭合</text><text x="900" y="660" font-size="13" fill="#6b7785" text-anchor="middle">同一组顶点，差一个闭合</text></g><text x="60" y="760" font-size="14" fill="#6b7785">结论：polygon 会自动回到起点；正多边形、星形全是它的顶点游戏。</text></svg>