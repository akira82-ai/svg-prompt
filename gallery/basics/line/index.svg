<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">直线 &lt;line&gt;</text><text x="60" y="104" font-size="14" fill="#6b7785">x1 y1 x2 y2 四个数一条线，样式全靠 stroke 家族</text><g><rect x="60" y="140" width="340" height="300" rx="16" fill="#ffffff" stroke="#e3e8ef"/><line x1="110" y1="205" x2="350" y2="205" stroke="#4f8ef7" stroke-width="2" stroke-linecap="round"/><line x1="110" y1="260" x2="350" y2="260" stroke="#4f8ef7" stroke-width="6" stroke-linecap="round"/><line x1="110" y1="315" x2="350" y2="315" stroke="#4f8ef7" stroke-width="12" stroke-linecap="round"/><line x1="110" y1="370" x2="350" y2="370" stroke="#4f8ef7" stroke-width="20" stroke-linecap="round"/><text x="230" y="415" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">粗细 stroke-width</text></g><g><rect x="430" y="140" width="340" height="300" rx="16" fill="#ffffff" stroke="#e3e8ef"/><line x1="470" y1="192" x2="710" y2="192" stroke="#f65e5e" stroke-width="18" stroke-linecap="butt"/><text x="590" y="222" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">butt 平头</text><line x1="470" y1="254" x2="710" y2="254" stroke="#f65e5e" stroke-width="18" stroke-linecap="square"/><text x="590" y="284" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">square 方头</text><line x1="470" y1="316" x2="710" y2="316" stroke="#f65e5e" stroke-width="18" stroke-linecap="round"/><text x="590" y="346" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">round 圆头</text><text x="600" y="415" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">线帽 stroke-linecap</text></g><g><rect x="800" y="140" width="340" height="300" rx="16" fill="#ffffff" stroke="#e3e8ef"/><line x1="850" y1="195" x2="1090" y2="195" stroke="#4f8ef7" stroke-width="8" stroke-linecap="round"/><line x1="850" y1="237" x2="1090" y2="237" stroke="#f65e5e" stroke-width="8" stroke-linecap="round"/><line x1="850" y1="279" x2="1090" y2="279" stroke="#3fb98f" stroke-width="8" stroke-linecap="round"/><line x1="850" y1="321" x2="1090" y2="321" stroke="#9b59f5" stroke-width="8" stroke-linecap="round"/><line x1="850" y1="363" x2="1090" y2="363" stroke="#f5a83c" stroke-width="8" stroke-linecap="round"/><text x="970" y="415" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">颜色 stroke</text></g><g><rect x="60" y="470" width="1080" height="240" rx="16" fill="#ffffff" stroke="#e3e8ef"/><line x1="140" y1="590" x2="560" y2="530" stroke="#4f8ef7" stroke-width="10" stroke-linecap="round"/><circle cx="140" cy="590" r="6" fill="#f65e5e"/><circle cx="560" cy="530" r="6" fill="#f65e5e"/><text x="140" y="620" font-size="13" fill="#6b7785" font-family="SFMono-Regular, Menlo, monospace">(x1,y1)</text><text x="560" y="560" font-size="13" fill="#6b7785" font-family="SFMono-Regular, Menlo, monospace">(x2,y2)</text><text x="700" y="560" font-size="16" fill="#1c2733">线没有"内部"，只有描边——填充属性对它无效</text><text x="700" y="588" font-size="16" fill="#1c2733">linecap 决定端点是否超出端点坐标</text></g></svg>