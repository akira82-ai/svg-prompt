<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">渐变球体 &lt;radialGradient&gt;</text><text x="60" y="104" font-size="14" fill="#6b7785">平涂的圆 + 焦点偏移的高光 = 发光球体</text><defs><radialGradient id="gs" cx="0.5" cy="0.5" r="0.55" fx="0.34" fy="0.3"><stop offset="0" stop-color="#bfe0ff"/><stop offset="0.55" stop-color="#4f8ef7"/><stop offset="1" stop-color="#1e4d8f"/></radialGradient><radialGradient id="gsr" cx="0.5" cy="0.5" r="0.55" fx="0.34" fy="0.3"><stop offset="0" stop-color="#ffd3d3"/><stop offset="0.55" stop-color="#f65e5e"/><stop offset="1" stop-color="#8f1e2c"/></radialGradient><radialGradient id="gsg" cx="0.5" cy="0.5" r="0.55" fx="0.34" fy="0.3"><stop offset="0" stop-color="#d1f5e3"/><stop offset="0.55" stop-color="#3fb98f"/><stop offset="1" stop-color="#14532d"/></radialGradient></defs><g><rect x="60" y="140" width="520" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="320" cy="380" r="150" fill="url(#gs)"/><line x1="320" y1="380" x2="272" y2="338" stroke="#6b7785" stroke-dasharray="4 4"/><circle cx="272" cy="338" r="6" fill="none" stroke="#f65e5e" stroke-width="2.5"/><text x="252" y="322" font-size="13" fill="#f65e5e" font-family="SFMono-Regular, Menlo, monospace">fx,fy 焦点=高光</text><circle cx="320" cy="380" r="4" fill="#fff"/><text x="334" y="398" font-size="13" fill="#6b7785" font-family="SFMono-Regular, Menlo, monospace">cx,cy 圆心</text><text x="320" y="580" font-size="13" fill="#6b7785" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">亮色 → 主色 → 暗色（3 个 stop）</text><text x="320" y="612" font-size="14" fill="#1c2733" text-anchor="middle">高光偏向左上 = 光从左上来</text></g><g><rect x="620" y="140" width="520" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="760" cy="330" r="92" fill="url(#gs)"/><circle cx="960" cy="330" r="92" fill="url(#gsr)"/><circle cx="1160 - 40" cy="330" r="92" fill="url(#gsg)"/><text x="880" y="480" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">同一组参数，换三组颜色</text><text x="880" y="560" font-size="15" fill="#1c2733" text-anchor="middle">立体感 = 焦点偏移 + 三段色标</text><text x="880" y="590" font-size="15" fill="#1c2733" text-anchor="middle">球、气泡、按钮的光泽全部是这个配方</text></g><text x="60" y="760" font-size="14" fill="#6b7785">结论：radialGradient 的 fx/fy 偏移，是把圆点亮成球体的那束光。</text></svg>