<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">星形与花形</text><text x="60" y="104" font-size="14" fill="#6b7785">外半径 R 与内半径 r 交替取点——星星和花是同一组公式</text><g><rect x="60" y="140" width="255" height="340" rx="16" fill="#ffffff" stroke="#e3e8ef"/><polygon points="187.0,198.0 208.2,260.9 274.5,261.6 221.2,301.1 241.1,364.4 187.0,326.0 132.9,364.4 152.8,301.1 99.5,261.6 165.8,260.9" fill="#f5a83c" opacity="0.9"/><text x="187" y="430" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">五角星</text><text x="187" y="452" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">R/r = 92/36</text></g><g><rect x="345" y="140" width="255" height="340" rx="16" fill="#ffffff" stroke="#e3e8ef"/><polygon points="472.0,198.0 496.0,248.4 551.7,244.0 520.0,290.0 551.7,336.0 496.0,331.6 472.0,382.0 448.0,331.6 392.3,336.0 424.0,290.0 392.3,244.0 448.0,248.4" fill="#f65e5e" opacity="0.85"/><text x="472" y="430" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">六角星</text><text x="472" y="452" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">R/r = 92/48</text></g><g><rect x="630" y="140" width="255" height="340" rx="16" fill="#ffffff" stroke="#e3e8ef"/><polygon points="757.0,198.0 779.2,236.4 822.1,224.9 810.6,267.8 849.0,290.0 810.6,312.2 822.1,355.1 779.2,343.6 757.0,382.0 734.8,343.6 691.9,355.1 703.4,312.2 665.0,290.0 703.4,267.8 691.9,224.9 734.8,236.4" fill="#9b59f5" opacity="0.85"/><text x="757" y="430" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">八角星</text><text x="757" y="452" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">R/r = 92/58</text></g><g><rect x="915" y="140" width="225" height="340" rx="16" fill="#ffffff" stroke="#e3e8ef"/><path d="M 1027.0 195.0 Q 1051.7 256.0 1117.4 260.6 Q 1066.9 303.0 1082.8 366.9 Q 1027.0 332.0 971.2 366.9 Q 987.1 303.0 936.6 260.6 Q 1002.3 256.0 1027.0 195.0 Z" fill="#f06292" opacity="0.85"/><text x="1027" y="430" font-size="18" font-weight="600" fill="#1c2733" text-anchor="middle">圆角花</text><text x="1027" y="452" font-size="13" fill="#8a94a3" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">内点用 Q 曲线</text></g><g><rect x="60" y="510" width="1080" height="200" rx="16" fill="#ffffff" stroke="#e3e8ef"/><path d="M 220.0 532.0 Q 237.0 580.6 287.5 571.0 Q 254.0 610.0 287.5 649.0 Q 237.0 639.4 220.0 688.0 Q 203.0 639.4 152.5 649.0 Q 186.0 610.0 152.5 571.0 Q 203.0 580.6 220.0 532.0 Z" fill="#f5a83c" opacity="0.75"/><text x="400" y="590" font-size="16" fill="#1c2733">r 越大星越胖，r 越小星越尖</text><text x="400" y="618" font-size="16" fill="#1c2733">把内点从"直线连接"换成"二次曲线绕行"——星就开花了</text><text x="400" y="646" font-size="16" fill="#1c2733">收藏夹里的 rating 星、花朵 loading，都源自这组公式</text></g></svg>