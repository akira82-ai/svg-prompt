<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">薄透镜成像 · 三条主光线</title><desc id="desc">物距 3f 得到倒立实像：像距 1.5f，放大率 −0.5；光线在像点相交</desc><rect x="0.0000" y="0.0000" width="1400.0000" height="900.0000" fill="#0d1724" rx="0" /><text x="72.000" y="55.000" font-size="14" fill="#a8bbce" text-anchor="start" font-weight="400">SVG / SCIENCE ATLAS</text><line x1="72.0000" y1="73.0000" x2="1328.0000" y2="73.0000" stroke="#2b4055" stroke-width="1" /><text x="72.000" y="123.000" font-size="34" fill="#edf3fa" text-anchor="start" font-weight="700">薄透镜成像 · 三条主光线</text><text x="72.000" y="161.000" font-size="18" fill="#a8bbce" text-anchor="start" font-weight="400">理想会聚薄透镜 / f = 1 / u = 3 / v = 1.5</text><rect x="72.0000" y="183.0000" width="1256.0000" height="51.0000" fill="#182c40" rx="5" /><text x="92.000" y="215.000" font-size="18" fill="#edf3fa" text-anchor="start" font-weight="400">物距 3f 得到倒立实像：像距 1.5f，放大率 −0.5；光线在像点相交</text><line x1="72.0000" y1="845.0000" x2="1328.0000" y2="845.0000" stroke="#2b4055" stroke-width="1" /><text x="72.000" y="878.000" font-size="14" fill="#a8bbce" text-anchor="start" font-weight="400">公式驱动 / 理想化教学模型 · 非实验观测或工程认证</text><text x="1328.000" y="878.000" font-size="14" fill="#a8bbce" text-anchor="end" font-weight="400">SVG-PROMPT</text><line x1="110.0000" y1="525.0000" x2="1110.0000" y2="525.0000" stroke="#2b4055" stroke-width="2" /><line x1="650.0000" y1="300.0000" x2="650.0000" y2="745.0000" stroke="#51a7ef" stroke-width="4" /><text x="650.000" y="285.000" font-size="20" fill="#51a7ef" text-anchor="middle" font-weight="400">会聚薄透镜</text><circle cx="510.0000" cy="525.0000" r="4" fill="#edf3fa" /><text x="510.000" y="555.000" font-size="16" fill="#a8bbce" text-anchor="middle" font-weight="400">F</text><circle cx="790.0000" cy="525.0000" r="4" fill="#edf3fa" /><text x="790.000" y="555.000" font-size="16" fill="#a8bbce" text-anchor="middle" font-weight="400">F′</text><circle cx="370.0000" cy="525.0000" r="4" fill="#edf3fa" /><text x="370.000" y="555.000" font-size="16" fill="#a8bbce" text-anchor="middle" font-weight="400">2F</text><circle cx="930.0000" cy="525.0000" r="4" fill="#edf3fa" /><text x="930.000" y="555.000" font-size="16" fill="#a8bbce" text-anchor="middle" font-weight="400">2F′</text><line x1="230.0000" y1="525.0000" x2="230.0000" y2="385.0000" stroke="#37c9a3" stroke-width="4" /><text x="230.000" y="367.000" font-size="17" fill="#37c9a3" text-anchor="middle" font-weight="400">物体 / h=1</text><line x1="860.0000" y1="525.0000" x2="860.0000" y2="595.0000" stroke="#efb15b" stroke-width="4" /><text x="860.000" y="625.000" font-size="17" fill="#efb15b" text-anchor="middle" font-weight="400">实像 / h′=−0.5</text><path d="M 230.0000 385.0000 L 650.0000 385.0000 L 860.0000 595.0000" fill="none" stroke="#ac91e8" stroke-width="2" stroke-linejoin="round" data-ray="parallel"/><path d="M 230.0000 385.0000 L 650.0000 525.0000 L 860.0000 595.0000" fill="none" stroke="#37c9a3" stroke-width="2" stroke-linejoin="round" data-ray="center"/><path d="M 230.0000 385.0000 L 650.0000 595.0000 L 860.0000 595.0000" fill="none" stroke="#efb15b" stroke-width="2" stroke-linejoin="round" data-ray="focus"/><text x="1130.000" y="350.000" font-size="17" fill="#a8bbce" text-anchor="start" font-weight="400">1/f = 1/u + 1/v</text><text x="1130.000" y="396.000" font-size="17" fill="#a8bbce" text-anchor="start" font-weight="400">u = 3f / v = 1.5f</text><text x="1130.000" y="442.000" font-size="17" fill="#a8bbce" text-anchor="start" font-weight="400">m = −v/u = −0.5</text><text x="1130.000" y="488.000" font-size="17" fill="#a8bbce" text-anchor="start" font-weight="400">平行入射 → 后焦点</text><text x="1130.000" y="534.000" font-size="17" fill="#a8bbce" text-anchor="start" font-weight="400">过光心 → 方向不变</text><text x="1130.000" y="580.000" font-size="17" fill="#a8bbce" text-anchor="start" font-weight="400">过前焦点 → 平行出射</text><text x="1130.000" y="626.000" font-size="17" fill="#a8bbce" text-anchor="start" font-weight="400">近轴、薄透镜、理想无像差</text></svg>
