<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, sans-serif"><title id="title">桌面花园 · 从窗口长出植物 / Desktop Window Garden</title><desc id="desc">植物越过复古软件窗口标题栏，进度条成为花盆；超现实桌面花园是概念插画，不是可操作软件。；窗口内景clipPath限制山丘；植物前景在(565,195,485,465)裁切，覆盖标题栏但不遮挡左侧窗口标题，底部由进度条花盆压住；六片叶复用同一symbol。；植物从完整高度86%到100%在3.2秒内一次展开后停住，transform-origin=(770,614)固定根部；基础几何是终帧，减少动效/CSS失效主体完整；进度条6/9格仅为花盆纹样，不称真实任务进度。</desc><rect x="0" y="0" width="1400" height="900" rx="0" fill="#edf2f5" /><text x="64" y="65" fill="#19344c" font-size="14" text-anchor="start">VECTOR STORIES / 17</text><text x="64" y="117" fill="#19344c" font-size="34" text-anchor="start">桌面花园 · 从窗口长出植物</text><text x="1336" y="117" fill="#19344c" font-size="20" text-anchor="end">Desktop Window Garden</text><defs><radialGradient id="halo"><stop stop-color="#70dddf" stop-opacity=".45"/><stop offset="1" stop-color="#70dddf" stop-opacity="0"/></radialGradient><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b7d2eb"/><stop offset="1" stop-color="#f4d8b4"/></linearGradient><clipPath id="stage"><rect x="64" y="190" width="1272" height="620" rx="20"/></clipPath></defs><g clip-path="url(#stage)"><rect x="64" y="190" width="1272" height="620" rx="0" fill="#e7e0cc" /><defs><pattern id="desktop-grid" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#b3b9a2"/></pattern><clipPath id="window-inside"><rect x="290" y="360" width="820" height="330"/></clipPath><clipPath id="plant-front"><rect x="565" y="195" width="485" height="465"/></clipPath><symbol id="garden-leaf" viewBox="0 0 110 55"><path d="M4 28Q45-22 106 24Q60 80 4 28Z" fill="#789958"/><path d="M6 28Q55 27 99 25" fill="none" stroke="#d1d7a6" stroke-width="2"/></symbol></defs><rect x="64" y="190" width="1272" height="620" rx="0" fill="url(#desktop-grid)" /><rect x="265" y="321" width="870" height="410" rx="12" fill="#a4aa92" /><rect x="252" y="309" width="870" height="410" rx="12" fill="#f7f3df" stroke="#3b5344" stroke-width="3"/><rect x="252" y="309" width="870" height="51" rx="10" fill="#3b5344" /><rect x="252" y="340" width="870" height="20" rx="0" fill="#3b5344" /><text x="277" y="342" fill="#f7f3df" font-size="17" text-anchor="start">GARDEN.EXE  /  A LITTLE ROOM TO GROW</text><circle cx="1034" cy="334" r="7" fill="#d4bb78" /><circle cx="1065" cy="334" r="7" fill="#c38a73" /><circle cx="1096" cy="334" r="7" fill="#b4c796" /><g clip-path="url(#window-inside)"><circle cx="1000" cy="449" r="170" fill="#e5e8ce" /><path d="M290 654Q520 530 735 628T1110 610V690H290Z" fill="#d2d9b7" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="320" y="416" fill="#627052" font-size="17" text-anchor="start">GROW AT YOUR OWN PACE.</text><text x="320" y="462" fill="#3b5344" font-size="38" text-anchor="start">No rush.</text><text x="320" y="498" fill="#627052" font-size="24" text-anchor="start">Just a little light.</text></g><defs><g id="garden-plant"><path d="M770 614Q741 496 818 384Q851 338 839 257" fill="none" stroke="#456b43" stroke-width="10" stroke-linecap="round"/><path d="M790 461Q720 406 704 421M812 401Q860 403 868 372M777 531Q829 522 839 472" fill="none" stroke="#456b43" stroke-width="6" stroke-linecap="round"/><g transform="translate(704 421) rotate(200) scale(1.1)"><use href="#garden-leaf" x="-4" y="-28" width="110" height="55"/></g><g transform="translate(868 372) rotate(-32) scale(1.15)"><use href="#garden-leaf" x="-4" y="-28" width="110" height="55"/></g><g transform="translate(839 472) rotate(-32) scale(1)"><use href="#garden-leaf" x="-4" y="-28" width="110" height="55"/></g><g transform="translate(800 430) rotate(205) scale(0.8)"><use href="#garden-leaf" x="-4" y="-28" width="110" height="55"/></g><g transform="translate(839 294) rotate(-55) scale(0.9)"><use href="#garden-leaf" x="-4" y="-28" width="110" height="55"/></g><g transform="translate(777 488) rotate(195) scale(0.8)"><use href="#garden-leaf" x="-4" y="-28" width="110" height="55"/></g></g></defs><g clip-path="url(#plant-front)"><g class="garden-grow" data-plant="front"><use href="#garden-plant"/></g></g><rect x="621" y="592" width="330" height="64" rx="12" fill="#b66f50" /><rect x="634" y="602" width="304" height="44" rx="7" fill="#d9a078" /><rect x="643" y="610" width="25" height="28" rx="3" fill="#754b3d" /><rect x="675" y="610" width="25" height="28" rx="3" fill="#754b3d" /><rect x="707" y="610" width="25" height="28" rx="3" fill="#754b3d" /><rect x="739" y="610" width="25" height="28" rx="3" fill="#754b3d" /><rect x="771" y="610" width="25" height="28" rx="3" fill="#754b3d" /><rect x="803" y="610" width="25" height="28" rx="3" fill="#754b3d" /><rect x="835" y="610" width="25" height="28" rx="3" fill="#e8bc93" /><rect x="867" y="610" width="25" height="28" rx="3" fill="#e8bc93" /><rect x="899" y="610" width="25" height="28" rx="3" fill="#e8bc93" /><text x="700" y="690" fill="#627052" font-size="16" text-anchor="middle">PROGRESS IS A PLACE TO PLANT.</text><text x="290" y="771" fill="#627052" font-size="16" text-anchor="start">STATUS: GROWING SLOWLY</text><text x="1110" y="771" fill="#627052" font-size="15" text-anchor="end">OFFLINE / CONCEPT</text><style>@keyframes garden-open{from{transform:scaleY(.86)}to{transform:scaleY(1)}}.garden-grow{transform-box:view-box;transform-origin:770px 614px;animation:garden-open 3.2s cubic-bezier(.2,.6,.3,1) 1}@media(prefers-reduced-motion:reduce){.garden-grow{animation:none}}</style></g><text x="64" y="857" fill="#526778" font-size="16" text-anchor="start">植物越过复古软件窗口标题栏，进度条成为花盆；超现实桌面花园是概念插画，不是可操作软件。</text><style>@keyframes breathe{50%{opacity:.6}}.pulse{animation:breathe 6s ease-in-out infinite}@keyframes drift{50%{transform:translateY(6px)}}.drift{animation:drift 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.drift{animation:none}}</style></svg>
