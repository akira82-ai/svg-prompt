<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, sans-serif"><title id="title">科技主题贴纸 / Technology Stickers</title><desc id="desc">六枚科技主题贴纸组成可复用的小插画，不再重复品牌Logo套件。；统一白色贴纸边缘、偏移底影、轻微旋转；创造/探索/构建/连接/学习/保护六主题为概念符号，非印刷刀模。</desc><rect x="0" y="0" width="1400" height="900" rx="0" fill="#edf2f5" /><text x="64" y="65" fill="#19344c" font-size="14" text-anchor="start">VECTOR STORIES / 15</text><text x="64" y="117" fill="#19344c" font-size="34" text-anchor="start">科技主题贴纸</text><text x="1336" y="117" fill="#19344c" font-size="20" text-anchor="end">Technology Stickers</text><defs><radialGradient id="halo"><stop stop-color="#70dddf" stop-opacity=".45"/><stop offset="1" stop-color="#70dddf" stop-opacity="0"/></radialGradient><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b7d2eb"/><stop offset="1" stop-color="#f4d8b4"/></linearGradient><clipPath id="stage"><rect x="64" y="190" width="1272" height="620" rx="20"/></clipPath></defs><g clip-path="url(#stage)"><g transform="rotate(-5 270 350)"><rect x="163" y="248" width="254" height="224" rx="40" fill="#c8d9ea" /><rect x="170" y="255" width="240" height="210" rx="36" fill="#245ee8" stroke="#fff" stroke-width="10"/><circle cx="290" cy="325" r="37" fill="none" stroke="#fff" stroke-width="4"/><path d="M270 325l20 -22 20 22-20 22Z" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="290" y="416" fill="#fff" font-size="22" text-anchor="middle">CREATE</text></g><g transform="rotate(4 705 350)"><rect x="598" y="248" width="254" height="224" rx="40" fill="#c8d9ea" /><rect x="605" y="255" width="240" height="210" rx="36" fill="#3d8c79" stroke="#fff" stroke-width="10"/><circle cx="725" cy="325" r="37" fill="none" stroke="#fff" stroke-width="4"/><path d="M711 338l14 -34 14 34-14-8Z" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="roun