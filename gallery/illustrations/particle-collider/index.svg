<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>粒子对撞机</title><desc>双环粒子对向加速环行，对撞点周期闪光</desc><rect width="1200" height="800" fill="#0a0f1a" /><text x="60" y="76" font-size="28" font-weight="700" fill="#d7e3f4">粒子对撞机 COLLIDER</text><text x="60" y="104" font-size="14" fill="#7c8db0">两束粒子共享3秒周期 · 交点到达时闪光（装饰示意）</text><g><rect x="60" y="140" width="1080" height="560" rx="16" fill="#111827" stroke="#1f2a44" /></g><ellipse cx="600" cy="440" rx="300" ry="200" fill="none" stroke="#00e5ff" stroke-width="10" opacity="0.35" /><ellipse cx="600" cy="380" rx="300" ry="140" fill="none" stroke="#ff2d95" stroke-width="10" opacity="0.35" stroke-dasharray="14 10" /><circle r="7" fill="#00e5ff"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M 600 240 A 300 200 0 1 1 599.99 240" calcMode="paced" /></circle><circle r="7" fill="#ff2d95"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M 600 240 A 300 140 0 1 0 600.01 240" calcMode="paced" /></circle><path d="M 600 190 Q 605.2 224.8 640 230 Q 605.2 235.2 600 270 Q 594.8 235.2 560 230 Q 594.8 224.8 600 190 Z" fill="#ffb45c" transform="translate(0 10)" opacity="0"><animate attributeName="opacity" values="1;0;0" keyTimes="0;.08;1" dur="3s" repeatCount="indefinite" /></path><text x="600" y="660" font-size="12.5" fill="#7c8db0" text-anchor="middle" font-weight="700" font-family="SFMono-Regular, Menlo, monospace">COLLISION POINT</text></svg>