<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc" font-family="PingFang SC, Microsoft YaHei, sans-serif"><title id="title">口袋标本 · 拼贴式自然笔记 / Pocket Specimen Journal</title><desc id="desc">叶片、纸胶带、线描注记与矢量风景卡，组成一页虚构的自然采集手账。；同一journal-leaf symbol以两种尺寸和角度复用，底纸有31px行距；右侧不是嵌入照片，而是通过不规则clipPath裁切的矢量风景。；仅三条装饰注记pathLength=1、dashoffset1→0一次2.6秒描画；叶片、文字、风景首帧完整，减少动效直接显示全部注记。叶形为艺术概括，不标植物学物种。</desc><rect x="0" y="0" width="1400" height="900" rx="0" fill="#edf2f5" /><text x="64" y="65" fill="#19344c" font-size="14" text-anchor="start">VECTOR STORIES / 16</text><text x="64" y="117" fill="#19344c" font-size="34" text-anchor="start">口袋标本 · 拼贴式自然笔记</text><text x="1336" y="117" fill="#19344c" font-size="20" text-anchor="end">Pocket Specimen Journal</text><defs><radialGradient id="halo"><stop stop-color="#70dddf" stop-opacity=".45"/><stop offset="1" stop-color="#70dddf" stop-opacity="0"/></radialGradient><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b7d2eb"/><stop offset="1" stop-color="#f4d8b4"/></linearGradient><clipPath id="stage"><rect x="64" y="190" width="1272" height="620" rx="20"/></clipPath></defs><g clip-path="url(#stage)"><rect x="64" y="190" width="1272" height="620" rx="0" fill="#ded9c9" /><defs><filter id="paper-shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="2" dy="6" stdDeviation="5" flood-color="#514f3d" flood-opacity=".18"/></filter><symbol id="journal-leaf" viewBox="0 0 120 200"><path d="M60 195C-20 145-8 42 67 6C132 64 131 151 60 195Z" fill="#76825a"/><path d="M60 190Q65 100 67 14M63 148L26 101M64 121L101 70M65 90L39 56" fill="none" stroke="#d3d5af" stroke-width="2"/></symbol><clipPath id="journal-photo"><path d="M915 278L1206 286 1212 600 1192 612 911 603Z"/></clipPath></defs><g transform="rotate(-3 510 505)"><rect x="165" y="239" width="690" height="534" rx="8" fill="#f7f1df" filter="url(#paper-shadow)"/><path d="M198 318L815 318" fill="none" stroke="#d9ddc7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M198 349L815 349" fill="none" stroke="#d9ddc7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M198 380L815 380" fill="none" stroke="#d9ddc7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M198 411L815 411" fill="none" stroke="#d9ddc7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M198 442L815 442" fill="none" stroke="#d9ddc7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M198 473L815 473" fill="none" stroke="#d9ddc7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M198 504L815 504" fill="none" stroke="#d9ddc7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M198 535L815 535" fill="none" stroke="#d9ddc7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M198 566L815 566" fill="none" stroke="#d9ddc7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M198 597L815 597" fill="none" stroke="#d9ddc7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M198 628L815 628" fill="none" stroke="#d9ddc7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M198 659L815 659" fill="none" stroke="#d9ddc7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M198 690L815 690" fill="none" stroke="#d9ddc7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M198 721L815 721" fill="none" stroke="#d9ddc7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M244 260L244 748" fill="none" stroke="#d7b7a4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="275" y="295" fill="#4c5942" font-size="19" text-anchor="start">FIELD JOURNAL</text><text x="770" y="295" fill="#75755e" font-size="14" text-anchor="end">NO. 014</text><g transform="rotate(-21 420 499)"><use href="#journal-leaf" x="325" y="330" width="180" height="300"/></g><g transform="rotate(25 601 518)"><use href="#journal-leaf" x="560" y="410" width="112" height="187"/></g><rect x="356" y="350" width="130" height="31" rx="0" fill="#d9c7a1" opacity=".75" transform="rotate(-12 421 365)"/><rect x="555" y="561" width="105" height="28" rx="0" fill="#c5c9ac" opacity=".8" transform="rotate(13 607 575)"/><text x="275" y="680" fill="#4c5942" font-size="24" text-anchor="start">雨后，沿着小路收集颜色。</text><text x="275" y="722" fill="#75755e" font-size="14" text-anchor="start">2026.11.02  /  CONCEPT FIELD NOTES</text><path d="M494 410Q550 360 628 357M661 506Q713 475 770 488" fill="none" stroke="#9a6653" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="journal-annotation"/><text x="636" y="363" fill="#8b6451" font-size="15" text-anchor="start">叶缘 / EDGE</text><text x="698" y="524" fill="#8b6451" font-size="17" text-anchor="start">叶脉</text></g><g transform="rotate(5 1060 460)" filter="url(#paper-shadow)"><rect x="885" y="257" width="356" height="422" rx="0" fill="#faf6eb" /><g clip-path="url(#journal-photo)"><rect x="905" y="275" width="310" height="340" rx="0" fill="#b4c2af" /><circle cx="1135" cy="344" r="44" fill="#e6d5aa" /><path d="M905 491L1002 351 1102 484 1174 392 1230 481V620H905Z" fill="#6f8972" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M905 550Q1040 460 1220 537V620H905Z" fill="#405e4b" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1063" y="647" fill="#59614e" font-size="14" text-anchor="middle">A WALK, NOT A DESTINATION.</text></g><path d="M899 715Q1000 677 1190 732" fill="none" stroke="#9a6653" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="journal-annotation"/><text x="1055" y="771" fill="#4c5942" font-size="28" text-anchor="middle">KEEP LOOKING.</text><style>@keyframes journal-ink{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.journal-annotation{stroke-dasharray:1;stroke-dashoffset:0;animation:journal-ink 2.6s ease-out 1}@media(prefers-reduced-motion:reduce){.journal-annotation{animation:none}}</style></g><text x="64" y="857" fill="#526778" font-size="16" text-anchor="start">叶片、纸胶带、线描注记与矢量风景卡，组成一页虚构的自然采集手账。</text><style>@keyframes breathe{50%{opacity:.6}}.pulse{animation:breathe 6s ease-in-out infinite}@keyframes drift{50%{transform:translateY(6px)}}.drift{animation:drift 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.drift{animation:none}}</style></svg>
