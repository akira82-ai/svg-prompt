<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>牛皮纸</title><desc>底色暖棕 #c9a875，叠两层噪声：高频纸纤维（opacity 0.12）+ 低频色斑（opacity 0.1）</desc><defs><filter id="fiber" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/><feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 0.12 0"/></filter><filter id="blotch" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="5"/><feColorMatrix type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.28  0 0 0 0 0.12  0 0 0 0.1 0"/></filter></defs><rect width="1200" height="800" fill="#c9a875"/><rect width="1200" height="800" filter="url(#blotch)"/><rect width="1200" height="800" filter="url(#fiber)"/><circle cx="870" cy="250" r="66" fill="none" stroke="#9a7040" stroke-width="7" opacity="0.35"/><circle cx="870" cy="250" r="52" fill="none" stroke="#b08550" stroke-width="4" opacity="0.3"/><path d="M 0 6 L 14 0 L 1200 0 L 1200 800 L 8 800 L 0 788 Z" fill="none" stroke="#a08050" stroke-width="3" opacity="0.6"/><rect x="820" y="560" width="320" height="190" rx="14" fill="rgba(13,18,30,0.82)" stroke="rgba(255,255,255,0.14)"/><text x="842" y="600" font-size="15" fill="#e8eef7" text-anchor="start" font-weight="700">牛皮纸</text><text x="842" y="634" font-size="12" fill="rgba(232,238,247,0.5)" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">底色</text><text x="948" y="634" font-size="12" fill="#e8eef7" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">#c9a875</text><text x="842" y="660" font-size="12" fill="rgba(232,238,247,0.5)" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">纤维</text><text x="948" y="660" font-size="12" fill="#e8eef7" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">bf 0.9</text><text x="842" y="686" font-size="12" fill="rgba(232,238,247,0.5)" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">色斑</text><text x="948" y="686" font-size="12" fill="#e8eef7" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">bf 0.02</text><text x="842" y="712" font-size="12" fill="rgba(232,238,247,0.5)" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">咖啡渍</text><text x="948" y="712" font-size="12" fill="#e8eef7" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">双圈</text></svg>