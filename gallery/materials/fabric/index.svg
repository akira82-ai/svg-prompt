<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>织物</title><desc>针织区（上 60%）：米白底 #ece7dd，V 纹交错（pattern：两条 ±18° 斜线列交替，浅灰 #d8d2c4）</desc><defs><pattern id="knit" width="18" height="14" patternUnits="userSpaceOnUse"><rect width="18" height="14" fill="#ece7dd"/><line x1="0" y1="0" x2="9" y2="14" stroke="#d8d2c4" stroke-width="4"/><line x1="18" y1="0" x2="9" y2="14" stroke="#e2ddd2" stroke-width="4"/></pattern><pattern id="linen" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#e8e2d4"/><line x1="0" y1="2" x2="10" y2="2" stroke="#d8d2c4" stroke-width="1"/><line x1="2" y1="0" x2="2" y2="10" stroke="#dcd6c8" stroke-width="1"/></pattern></defs><rect width="1200" height="420" fill="url(#knit)"/><rect width="1200" height="380" y="420" fill="url(#linen)"/><line x1="0" y1="420" x2="1200" y2="420" stroke="#e8eef7" stroke-dasharray="8 5" stroke-width="1.5" opacity="0.4"/><rect x="880" y="560" width="260" height="164" rx="14" fill="rgba(13,18,30,0.82)" stroke="rgba(255,255,255,0.14)"/><text x="902" y="600" font-size="15" fill="#e8eef7" text-anchor="start" font-weight="700">织物</text><text x="902" y="634" font-size="12" fill="rgba(232,238,247,0.5)" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">针织</text><text x="1008" y="634" font-size="12" fill="#e8eef7" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">V 纹 18×14</text><text x="902" y="660" font-size="12" fill="rgba(232,238,247,0.5)" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">亚麻</text><text x="1008" y="660" font-size="12" fill="#e8eef7" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">十字 10px</text><text x="902" y="686" font-size="12" fill="rgba(232,238,247,0.5)" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">纱线</text><text x="1008" y="686" font-size="12" fill="#e8eef7" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">#ece7dd</text></svg>