<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>金属拉丝</title><desc>底色亮灰渐变（上 #b8bec6 → 下 #8f979f），叠横向拉丝纹（feTurbulence baseFrequency=&quot;0.01 0.4&quot; 映射灰，opacity 0.4）</desc><defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8bec6"/><stop offset="1" stop-color="#8f979f"/></linearGradient><filter id="brush" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.01 0.4" numOctaves="3" seed="8"/><feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.48  0 0 0 0 0.52  0 0 0 0.4 0"/></filter><linearGradient id="mh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><radialGradient id="rivet"><stop offset="0" stop-color="#d8dde2"/><stop offset="0.7" stop-color="#9aa2ab"/><stop offset="1" stop-color="#6b737b"/></radialGradient></defs><rect width="1200" height="800" fill="url(#mg)"/><rect width="1200" height="800" filter="url(#brush)"/><rect width="1200" height="260" fill="url(#mh)" transform="skewY(-4)"/><circle cx="150" cy="120" r="18" fill="url(#rivet)" stroke="#6b737b"/><circle cx="146" cy="115" r="5" fill="#e8ecf0" opacity="0.9"/><circle cx="1050" cy="680" r="18" fill="url(#rivet)" stroke="#6b737b"/><circle cx="1046" cy="675" r="5" fill="#e8ecf0" opacity="0.9"/><rect x="820" y="560" width="320" height="190" rx="14" fill="rgba(13,18,30,0.82)" stroke="rgba(255,255,255,0.14)"/><text x="842" y="600" font-size="15" fill="#e8eef7" text-anchor="start" font-weight="700">拉丝金属</text><text x="842" y="634" font-size="12" fill="rgba(232,238,247,0.5)" text-anchor="start" font-family="SFMono-Regular, Menlo, monospace">底色</text><text x="948" y="634" font-size="12" fill="#e8eef7" text-anchor="start" font-family="SFMono-Regular, Menlo,