<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">四步过程图解 Process</text><text x="60" y="104" font-size="14" fill="#6b7785">从一句话到一张验证过的图</text><defs><linearGradient id="ps" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8ef7"/><stop offset="1" stop-color="#9b59f5"/></linearGradient></defs><g><rect x="84" y="200" width="270" height="370" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="204" cy="290" r="52" fill="url(#ps)"/><text x="204" y="305" font-size="44" fill="#fff" text-anchor="middle" font-weight="800">1</text><text x="204" y="400" font-size="19" fill="#1c2733" text-anchor="middle" font-weight="700">描述需求</text><text x="204" y="434" font-size="12.5" fill="#6b7785" text-anchor="middle">一句话意图 +</text><text x="204" y="456" font-size="12.5" fill="#6b7785" text-anchor="middle">风格约束</text></g><path d="M 330 365 L 348 365" stroke="#4f8ef7" stroke-width="3" stroke-linecap="round"/><path d="M 342 358 L 350 365 L 342 372" fill="none" stroke="#4f8ef7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="354" y="200" width="270" height="370" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="474" cy="290" r="52" fill="url(#ps)"/><text x="474" y="305" font-size="44" fill="#fff" text-anchor="middle" font-weight="800">2</text><text x="474" y="400" font-size="19" fill="#1c2733" text-anchor="middle" font-weight="700">生成 SVG</text><text x="474" y="434" font-size="12.5" fill="#6b7785" text-anchor="middle">文本经模型</text><text x="474" y="456" font-size="12.5" fill="#6b7785" text-anchor="middle">变成图形</text></g><path d="M 600 365 L 618 365" stroke="#4f8ef7" stroke-width="3" stroke-linecap="round"/><path d="M 612 358 L 620 365 L 612 372" fill="none" stroke="#4f8ef7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="624" y="200" width="270" height="370" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="744" cy="290" r="52" fill="url(#ps)"/><text x="744" y="305" font-size="44" fill="#fff" text-anchor="middle" font-weight="800">3</text><text x="744" y="400" font-size="19" fill="#1c2733" text-anchor="middle" font-weight="700">视觉校验</text><text x="744" y="434" font-size="12.5" fill="#6b7785" text-anchor="middle">渲染对照</text><text x="744" y="456" font-size="12.5" fill="#6b7785" text-anchor="middle">逐项挑错</text></g><path d="M 870 365 L 888 365" stroke="#4f8ef7" stroke-width="3" stroke-linecap="round"/><path d="M 882 358 L 890 365 L 882 372" fill="none" stroke="#4f8ef7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="894" y="200" width="270" height="370" rx="16" fill="#ffffff" stroke="#e3e8ef"/><circle cx="1014" cy="290" r="52" fill="url(#ps)"/><text x="1014" y="305" font-size="44" fill="#fff" text-anchor="middle" font-weight="800">4</text><text x="1014" y="400" font-size="19" fill="#1c2733" text-anchor="middle" font-weight="700">循环交付</text><text x="1014" y="434" font-size="12.5" fill="#6b7785" text-anchor="middle">提示词归档</text><text x="1014" y="456" font-size="12.5" fill="#6b7785" text-anchor="middle">图鉴上架</text></g><g><rect x="60" y="570" width="1080" height="140" rx="16" fill="#ffffff" stroke="#e3e8ef"/><text x="120" y="622" font-size="14.5" fill="#1c2733" text-anchor="start">第 ③ 步是这个图鉴存在的原因：SVG 是文本，渲染结果可以被逐像素核对——</text><text x="120" y="650" font-size="14.5" fill="#1c2733" text-anchor="start">生成 → 校验 → 修正的闭环，让"一句话出图"从抽奖变成工程。</text></g></svg>