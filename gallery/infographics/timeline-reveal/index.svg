<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>时间轴点亮</title><desc>事件沿时间线逐个点亮——6 秒一轮的时光放映</desc><rect width="1200" height="800" fill="#f6f8fb" /><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">时间轴点亮 Timeline</text><text x="60" y="104" font-size="14" fill="#6b7785">事件沿时间线逐个点亮——6 秒一轮</text><g><rect x="60" y="140" width="1080" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef" /></g><line x1="600" y1="190" x2="600" y2="658" stroke="#e3e8ef" stroke-width="6" stroke-linecap="round" /><line x1="600" y1="190" x2="600" y2="658" stroke="#4f8ef7" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;.55;1" dur="6s" repeatCount="indefinite" /></line><circle cx="600" cy="220" r="11" fill="#fff" stroke="#e3e8ef" stroke-width="4"><animate attributeName="stroke" values="#e3e8ef;#4f8ef7;#4f8ef7" keyTimes="0;0.035256;1" dur="6s" repeatCount="indefinite" calcMode="discrete" /><animate attributeName="fill" values="#fff;#4f8ef7;#4f8ef7" keyTimes="0;0.035256;1" dur="6s" repeatCount="indefinite" calcMode="discrete" /></circle><g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.035256;1" dur="6s" repeatCount="indefinite" calcMode="discrete" /><text x="574" y="226" font-size="20" fill="#4f8ef7" text-anchor="end" font-weight="800">2001</text><text x="574" y="208" font-size="14" fill="#1c2733" text-anchor="end" font-weight="700">SVG 1.0 推荐</text></g><circle cx="600" cy="298" r="11" fill="#fff" stroke="#e3e8ef" stroke-width="4"><animate attributeName="stroke" values="#e3e8ef;#9b59f5;#9b59f5" keyTimes="0;0.126923;1" dur="6s" repeatCount="indefinite" calcMode="discrete" /><animate attributeName="fill" values="#fff;#9b59f5;#9b59f5" keyTimes="0;0.126923;1" dur="6s" repeatCount="indefinite" calcMode="discrete" /></circle