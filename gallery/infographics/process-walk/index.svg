<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">流程行进 Process Walk</text><text x="60" y="104" font-size="14" fill="#6b7785">一颗光点走完全程</text><g><rect x="60" y="140" width="1080" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/></g><line x1="600" y1="230" x2="600" y2="570" stroke="#e3e8ef" stroke-width="3"/><rect x="510" y="164" width="180" height="52" rx="26" fill="#fff" stroke="#e3e8ef" stroke-width="1.5"><animate attributeName="stroke" values="#e3e8ef;#4f8ef7;#4f8ef7" keyTimes="0;0.080;1" dur="7s" repeatCount="indefinite"/></rect><text x="600" y="195" font-size="14" font-weight="600" fill="#1c2733" text-anchor="middle">开始</text><rect x="510" y="264" width="180" height="52" rx="10" fill="#fff" stroke="#e3e8ef" stroke-width="1.5"><animate attributeName="stroke" values="#e3e8ef;#4f8ef7;#4f8ef7" keyTimes="0;0.240;1" dur="7s" repeatCount="indefinite"/></rect><text x="600" y="295" font-size="14" font-weight="600" fill="#1c2733" text-anchor="middle">生成 SVG</text><rect x="510" y="364" width="180" height="52" rx="10" fill="#fff" stroke="#e3e8ef" stroke-width="1.5"><animate attributeName="stroke" values="#e3e8ef;#4f8ef7;#4f8ef7" keyTimes="0;0.400;1" dur="7s" repeatCount="indefinite"/></rect><text x="600" y="395" font-size="14" font-weight="600" fill="#1c2733" text-anchor="middle">渲染校验</text><rect x="510" y="464" width="180" height="52" rx="10" fill="#fff" stroke="#e3e8ef" stroke-width="1.5"><animate attributeName="stroke" values="#e3e8ef;#4f8ef7;#4f8ef7" keyTimes="0;0.560;1" dur="7s" repeatCount="indefinite"/></rect><text x="600" y="495" font-size="14" font-weight="600" fill="#1c2733" text-anchor="middle">修复对齐</text><rect x="510" y="564" width="180" height="52" rx="26" fill="#fff" stroke="#e3e8ef" stroke-width="1.5"><animate attributeName="stroke" values="#e3e8ef;#4f8ef7;#4f8ef7" keyTimes="0;0.720;1" dur="7s" repeatCount="indefinite"/></rect><text x="600" y="595" font-size="14" font-weight="600" fill="#1c2733" text-anchor="middle">发布上线</text><circle r="9" fill="#4f8ef7" stroke="#fff" stroke-width="3"><animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear" path="M 600 190 L 600 590"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.85;1" dur="7s" repeatCount="indefinite"/></circle></svg>