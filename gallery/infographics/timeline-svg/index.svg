<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">SVG 简史 · 1996 → 2026</text><text x="60" y="104" font-size="14" fill="#6b7785">三十年，从提案到 AI 生成</text><g><rect x="60" y="140" width="1080" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/></g><rect x="597" y="180" width="6" height="480" rx="3" fill="#e3e8ef"/><circle cx="600" cy="216" r="10" fill="#fff" stroke="#4f8ef7" stroke-width="4"/><text x="574" y="222" font-size="22" fill="#4f8ef7" text-anchor="end" font-weight="800">1996</text><text x="574" y="202" font-size="14.5" fill="#1c2733" text-anchor="end" font-weight="700">PGML 提案</text><text x="574" y="246" font-size="11.5" fill="#6b7785" text-anchor="end">Adobe 提出矢量网页图形构想</text><circle cx="600" cy="298" r="10" fill="#fff" stroke="#9b59f5" stroke-width="4"/><text x="626" y="304" font-size="22" fill="#9b59f5" text-anchor="start" font-weight="800">2001</text><text x="626" y="284" font-size="14.5" fill="#1c2733" text-anchor="start" font-weight="700">SVG 1.1 发布</text><text x="626" y="328" font-size="11.5" fill="#6b7785" text-anchor="start">W3C 正式标准，矢量网页起步</text><circle cx="600" cy="380" r="10" fill="#fff" stroke="#3fb98f" stroke-width="4"/><text x="574" y="386" font-size="22" fill="#3fb98f" text-anchor="end" font-weight="800">2011</text><text x="574" y="366" font-size="14.5" fill="#1c2733" text-anchor="end" font-weight="700">移动时代</text><text x="574" y="410" font-size="11.5" fill="#6b7785" text-anchor="end">矢量图标适配 Retina 屏</text><circle cx="600" cy="462" r="10" fill="#fff" stroke="#f5a83c" stroke-width="4"/><text x="626" y="468" font-size="22" fill="#f5a83c" text-anchor="start" font-weight="800">2016</text><text x="626" y="448" font-size="14.5" fill="#1c2733" text-anchor="start" font-weight="700">SVG 2 草案</text><text x="626" y="492" font-size="11.5" fill="#6b7785" text-anchor="start">mesh 渐变、交互能力升级</text><circle cx="600" cy="544" r="10" fill="#fff" stroke="#f65e5e" stroke-width="4"/><text x="574" y="550" font-size="22" fill="#f65e5e" text-anchor="end" font-weight="800">2023</text><text x="574" y="530" font-size="14.5" fill="#1c2733" text-anchor="end" font-weight="700">全面支持</text><text x="574" y="574" font-size="11.5" fill="#6b7785" text-anchor="end">所有现代浏览器一致渲染</text><circle cx="600" cy="626" r="10" fill="#fff" stroke="#38b8c9" stroke-width="4"/><text x="626" y="632" font-size="22" fill="#38b8c9" text-anchor="start" font-weight="800">2026</text><text x="626" y="612" font-size="14.5" fill="#1c2733" text-anchor="start" font-weight="700">AI 生成时代</text><text x="626" y="656" font-size="11.5" fill="#6b7785" text-anchor="start">提示词直出矢量图形</text></svg>