<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><title>决策流程图</title><desc>SVG 生成质量的判定流程：是/否分支走到底</desc><rect width="1200" height="800" fill="#f6f8fb"/><text x="60" y="76" font-size="28" font-weight="700" fill="#1c2733">决策流程图 Flowchart</text><text x="60" y="104" font-size="14" fill="#6b7785">生成 → 校验 → 修复，直到对齐</text><g><rect x="60" y="140" width="1080" height="560" rx="16" fill="#ffffff" stroke="#e3e8ef"/></g><rect x="330" y="170" width="140" height="44" rx="22" fill="#3fb98f"/><text x="400" y="197" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">开始</text><line x1="400" y1="214" x2="400" y2="246" stroke="#6b7785" stroke-width="2"/><path d="M 395 240 L 400 246 L 395 252" fill="none" stroke="#6b7785" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="310" y="246" width="180" height="46" rx="10" fill="#fff" stroke="#c9d4e3" stroke-width="1.5"/><text x="400" y="274" font-size="13.5" fill="#1c2733" text-anchor="middle" font-weight="600">生成 SVG 初稿</text><line x1="400" y1="292" x2="400" y2="320" stroke="#6b7785" stroke-width="2"/><path d="M 395 314 L 400 320 L 395 326" fill="none" stroke="#6b7785" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 400 320 L 500 357 L 400 394 L 300 357 Z" fill="#e8f1fe" stroke="#4f8ef7" stroke-width="2"/><text x="400" y="362" font-size="13" fill="#1c2733" text-anchor="middle" font-weight="600">渲染通过？</text><text x="516" y="362" font-size="13" fill="#3fb98f" text-anchor="start" font-weight="700">是</text><line x1="500" y1="357" x2="690" y2="357" stroke="#6b7785" stroke-width="2"/><path d="M 685 351 L 690 357 L 685 363" fill="none" stroke="#6b7785" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="690" y="334" width="180" height="46" rx="10" fill="#fff" stroke="#c9d4e3" stroke-width="1.5"/><text x="780" y="362" font-size="13.5" fill="#1c2733" tex