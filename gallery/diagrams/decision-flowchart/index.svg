<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">质量决策与有限重试</title><desc id="desc">两次判断都有是／否分支；达到重试上限必须停止。概念结构示意 · 不代表完整生产部署或真实运行状态</desc><defs><marker id="arrow-call" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3686d9"/></marker><marker id="arrow-event" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d99431"/></marker><marker id="arrow-data" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00a887"/></marker><marker id="arrow-control" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bc637d"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8093a6"/></marker></defs><rect width="1400" height="900" fill="#f3f5f7"/><text x="72" y="55" fill="#596e81" font-size="14" text-anchor="start" font-weight="400">SVG / SYSTEM ATLAS</text><line x1="72" y1="73" x2="1328" y2="73" stroke="#d7e0e9"/><text x="72" y="122" fill="#172a3a" font-size="34" text-anchor="start" font-weight="700">质量决策与有限重试</text><text x="72" y="160" fill="#596e81" font-size="18" text-anchor="start" font-weight="400">渲染检查、提示词对齐、修复与退出</text><rect x="72" y="183" width="1256" height="51" rx="5" fill="#e6edf3"/><text x="92" y="215" fill="#172a3a" font-size="18" text-anchor="start" font-weight="600">两次判断都有是／否分支；达到重试上限必须停止</text><polyline id="edge-1" data-edge="edge-1" data-source="start" data-target="generate" data-source-port="r" data-target-port="l" data-guard="" data-route="ports" points="250,385 370,385" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-call)"/><polyline id="edge-2" data-edge="edge-2" data-source="generate" data-target="render" data-source-port="r" data-target-port="l" data-guard="" data-route="ports" points="560,385 750,385" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-call)"/><polyline id="edge-3" data-edge="edge-3" data-source="render" data-target="review" data-source-port="r" data-target-port="l" data-guard="是" data-route="ports" points="940,385 1100,385" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-call)"/><polyline id="edge-4" data-edge="edge-4" data-source="render" data-target="fix" data-source-port="b" data-target-port="r" data-guard="否" data-route="ports" points="845,435 845,505 650,505 650,750 585,750" fill="none" stroke="#bc637d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-control)" stroke-dasharray="6 5"/><polyline id="edge-5" data-edge="edge-5" data-source="review" data-target="aligned" data-source-port="b" data-target-port="t" data-guard="" data-route="ports" points="1195,420 1195,535 845,535 845,580" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-call)"/><polyline id="edge-6" data-edge="edge-6" data-source="aligned" data-target="publish" data-source-port="r" data-target-port="l" data-guard="是" data-route="ports" points="940,630 1100,630" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-call)"/><polyline id="edge-7" data-edge="edge-7" data-source="aligned" data-target="fix" data-source-port="b" data-target-port="r" data-guard="否" data-route="ports" points="845,680 845,750 585,750" fill="none" stroke="#bc637d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-control)" stroke-dasharray="6 5"/><polyline id="edge-8" data-edge="edge-8" data-source="fix" data-target="generate" data-source-port="l" data-target-port="l" data-guard="retry&lt;3" data-route="ports" points="385,750 310,750 310,385 370,385" fill="none" stroke="#bc637d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-control)" stroke-dasharray="6 5"/><polyline id="edge-9" data-edge="edge-9" data-source="fix" data-target="stop" data-source-port="l" data-target-port="r" data-guard="retry&gt;=3" data-route="ports" points="385,750 260,750" fill="none" stroke="#bc637d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-control)" stroke-dasharray="6 5"/><g id="node-start" data-node="start" data-kind="pill" data-terminal="false" data-start="true" data-box="100,350,150,70"><rect x="100" y="350" width="150" height="70" rx="35.0" fill="#ffffff" stroke="#3686d9" stroke-width="1.6"/><text x="175.0" y="392.0" fill="#172a3a" font-size="19" text-anchor="middle" font-weight="600">开始</text></g><g id="node-generate" data-node="generate" data-kind="box" data-terminal="false" data-start="false" data-box="370,350,190,70"><rect x="370" y="350" width="190" height="70" rx="8" fill="#ffffff" stroke="#3686d9" stroke-width="1.6"/><text x="465.0" y="392.0" fill="#172a3a" font-size="19" text-anchor="middle" font-weight="600">生成 SVG</text></g><g id="node-render" data-node="render" data-kind="diamond" data-terminal="false" data-start="false" data-box="750,335,190,100"><path d="M 845 335 L 940 385 L 845 435 L 750 385 Z" fill="#ffffff" stroke="#3686d9" stroke-width="2"/><text x="845.0" y="391.0" fill="#172a3a" font-size="19" text-anchor="middle" font-weight="600">渲染通过？</text></g><g id="node-review" data-node="review" data-kind="box" data-terminal="false" data-start="false" data-box="1100,350,190,70"><rect x="1100" y="350" width="190" height="70" rx="8" fill="#ffffff" stroke="#3686d9" stroke-width="1.6"/><text x="1195.0" y="392.0" fill="#172a3a" font-size="19" text-anchor="middle" font-weight="600">视觉终审</text></g><g id="node-aligned" data-node="aligned" data-kind="diamond" data-terminal="false" data-start="false" data-box="750,580,190,100"><path d="M 845 580 L 940 630 L 845 680 L 750 630 Z" fill="#ffffff" stroke="#3686d9" stroke-width="2"/><text x="845.0" y="636.0" fill="#172a3a" font-size="19" text-anchor="middle" font-weight="600">提示词对齐？</text></g><g id="node-publish" data-node="publish" data-kind="pill" data-terminal="true" data-start="false" data-box="1100,595,190,70"><rect x="1100" y="595" width="190" height="70" rx="35.0" fill="#ffffff" stroke="#00a887" stroke-width="1.6"/><text x="1195.0" y="637.0" fill="#172a3a" font-size="19" text-anchor="middle" font-weight="600">归档交付</text></g><g id="node-fix" data-node="fix" data-kind="box" data-terminal="false" data-start="false" data-box="385,715,200,70"><rect x="385" y="715" width="200" height="70" rx="8" fill="#ffffff" stroke="#bc637d" stroke-width="1.6"/><text x="485.0" y="757.0" fill="#172a3a" font-size="19" text-anchor="middle" font-weight="600">定位与修复</text></g><g id="node-stop" data-node="stop" data-kind="pill" data-terminal="true" data-start="false" data-box="100,715,160,70"><rect x="100" y="715" width="160" height="70" rx="35.0" fill="#ffffff" stroke="#bc637d" stroke-width="1.6"/><text x="180.0" y="757.0" fill="#172a3a" font-size="19" text-anchor="middle" font-weight="600">停止并报告</text></g><text x="1020" y="367" fill="#3686d9" font-size="15" text-anchor="middle" font-weight="400">是</text><text x="800" y="488" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">否</text><text x="1045" y="518" fill="#3686d9" font-size="15" text-anchor="middle" font-weight="400">检查一致性</text><text x="1020" y="612" fill="#3686d9" font-size="15" text-anchor="middle" font-weight="400">是</text><text x="865" y="721" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">否</text><text x="310" y="620" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">重试次数 &lt; 3</text><text x="320" y="781" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">≥ 3 次</text><text x="700" y="817" fill="#172a3a" font-size="16" text-anchor="middle" font-weight="400">首次生成不计重试；每次进入修复后检查预算，失败原因保留在报告中。</text><line x1="72" y1="845" x2="1328" y2="845" stroke="#d7e0e9"/><text x="72" y="877" fill="#596e81" font-size="15" text-anchor="start" font-weight="400">概念结构示意 · 不代表完整生产部署或真实运行状态</text><text x="1328" y="877" fill="#596e81" font-size="14" text-anchor="end" font-weight="400">SVG-PROMPT</text></svg>
