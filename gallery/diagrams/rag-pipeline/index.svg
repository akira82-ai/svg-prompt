/text><text x="367.5" y="670" fill="#a5b6c9" font-size="15" text-anchor="middle" font-weight="400">保留授权 scope</text></g><g id="node-retrieve" data-node="retrieve" data-kind="box" data-terminal="false" data-start="false" data-box="500,605,175,95"><rect x="500" y="605" width="175" height="95" rx="8" fill="#182b3f" stroke="#3686d9" stroke-width="1.6"/><text x="587.5" y="643" fill="#edf3fa" font-size="19" text-anchor="middle" font-weight="600">过滤检索</text><text x="587.5" y="670" fill="#a5b6c9" font-size="15" text-anchor="middle" font-weight="400">先 ACL 后 top-k</text></g><g id="node-rerank" data-node="rerank" data-kind="box" data-terminal="false" data-start="false" data-box="720,605,175,95"><rect x="720" y="605" width="175" height="95" rx="8" fill="#182b3f" stroke="#3686d9" stroke-width="1.6"/><text x="807.5" y="643" fill="#edf3fa" font-size="19" text-anchor="middle" font-weight="600">证据重排</text><text x="807.5" y="670" fill="#a5b6c9" font-size="15" text-anchor="middle" font-weight="400">证据排序</text></g><g id="node-generate" data-node="generate" data-kind="box" data-terminal="false" data-start="false" data-box="940,605,175,95"><rect x="940" y="605" width="175" height="95" rx="8" fill="#182b3f" stroke="#3686d9" stroke-width="1.6"/><text x="1027.5" y="643" fill="#edf3fa" font-size="19" text-anchor="middle" font-weight="600">生成与拒答</text><text x="1027.5" y="670" fill="#a5b6c9" font-size="15" text-anchor="middle" font-weight="400">不凭空补证据</text></g><g id="node-answer" data-node="answer" data-kind="box" data-terminal="true" data-start="false" data-box="1160,605,175,95"><rect x="1160" y="605" width="175" height="95" rx="8" fill="#182b3f" stroke="#3686d9" stroke-width="1.6"/><text x="1247.5" y="643" fill="#edf3fa" font-size="19" text-anchor="middle" font-weight="600">答案与引用</text><text x="1247.5" y="670" fill="#a5b6c9" font-size="15" text-anchor="middle" font-weight="400">source_id 可追溯</text></g><text x="370" y="360" fill="#00a887" font-size="15" text-anchor="middle" font-weight="400