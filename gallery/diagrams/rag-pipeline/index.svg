<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">RAG：索引与查询两条路径</title><desc id="desc">权限过滤先于重排；证据不足应拒答，引用需要可追溯。概念结构示意 · 不代表完整生产部署或真实运行状态</desc><defs><marker id="arrow-call" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3686d9"/></marker><marker id="arrow-event" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d99431"/></marker><marker id="arrow-data" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00a887"/></marker><marker id="arrow-control" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bc637d"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8093a6"/></marker></defs><rect width="1400" height="900" fill="#0d1724"/><text x="72" y="55" fill="#a5b6c9" font-size="14" text-anchor="start" font-weight="400">SVG / SYSTEM ATLAS</text><line x1="72" y1="73" x2="1328" y2="73" stroke="#2d4155"/><text x="72" y="122" fill="#edf3fa" font-size="34" text-anchor="start" font-weight="700">RAG：索引与查询两条路径</text><text x="72" y="160" fill="#a5b6c9" font-size="18" text-anchor="start" font-weight="400">离线知识处理 / 在线授权检索与生成</text><rect x="72" y="183" width="1256" height="51" rx="5" fill="#172c40"/><text x="92" y="215" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="600">权限过滤先于重排；证据不足应拒答，引用需要可追溯</text><rect x="60" y="270" width="1280" height="190" rx="12" fill="none" stroke