<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">工程尺寸 · 自动朝向箭头</title><desc id="desc">auto-start-reverse 自动反转起点箭头；终点箭头沿路径方向。虚构零件 · 单位 mm · 演示尺寸关系与 SVG 箭头方向，非制造图纸</desc><defs><marker id="dimension-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3686d9"/></marker></defs><rect width="1400" height="900" fill="#f3f5f7"/><text x="72" y="55" fill="#596e81" font-size="14" text-anchor="start" font-weight="400">SVG / SYSTEM ATLAS</text><line x1="72" y1="73" x2="1328" y2="73" stroke="#d7e0e9"/><text x="72" y="122" fill="#172a3a" font-size="34" text-anchor="start" font-weight="700">工程尺寸 · 自动朝向箭头</text><text x="72" y="160" fill="#596e81" font-size="18" text-anchor="start" font-weight="400">水平 / 竖直 / 斜向尺寸线；同一箭头定义复用到两端</text><rect x="72" y="183" width="1256" height="51" rx="5" fill="#e6edf3"/><text x="92" y="215" fill="#172a3a" font-size="18" text-anchor="start" font-weight="600">auto-start-reverse 自动反转起点箭头；终点箭头沿路径方向</text><path d="M 270 390 L 750 390 L 750 550 L 630 710 L 270 710 Z" fill="#ffffff" stroke="#172a3a" stroke-width="3" data-part-mm="[[0, 0], [120, 0], [120, 40], [90, 80], [0, 80]]" data-px-per-mm="4"/><path d="M 270 382 L 270 308" fill="none" stroke="#596e81" stroke-width="1"/><path d="M 750 382 L 750 308" fill="none" stroke="#596e81" stroke-width="1"/><line x1="270" y1="320" x2="750" y2="320" stroke="#3686d9" stroke-width="2" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)" data-dimension="horizontal" data-value-mm="120" data-source-mm="0,0" data-target-mm="120,0"/><path d="M 262 390 L 168 390" fill="none" stroke="#596e81" stroke-width="1"/><path d="M 262 710 L 168 710" fill="none" stroke="#596e81" stroke-width="1"/><line x1="180" y1="390" x2="180" y2="710" stroke="#3686d9" stroke-width="2" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)" data-dimension="vertical" data-value-mm="80" data-source-mm="0,0" data-target-mm="0,80"/><path d="M 636.4 714.8 L 695.6 759.2" fill="none" stroke="#596e81" stroke-width="1"/><path d="M 756.4 554.8 L 815.6 599.2" fill="none" stroke="#596e81" stroke-width="1"/><line x1="686" y1="752" x2="806" y2="592" stroke="#3686d9" stroke-width="2" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)" data-dimension="diagonal" data-value-mm="50" data-source-mm="90,80" data-target-mm="120,40"/><path d="M 750 550 L 750 710 L 630 710" fill="none" stroke="#d99431" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="930" y1="280" x2="930" y2="797" stroke="#d7e0e9"/><text x="480" y="515" fill="#172a3a" font-size="28" text-anchor="middle" font-weight="400">120 × 80 mm</text><text x="480" y="552" fill="#596e81" font-size="16" text-anchor="middle" font-weight="400">同尺度零件轮廓 / 4px = 1mm</text><text x="510" y="302" fill="#3686d9" font-size="22" text-anchor="middle" font-weight="400">120 mm</text><text x="122" y="558" fill="#3686d9" font-size="22" text-anchor="middle" font-weight="400">80 mm</text><text x="850" y="682" fill="#3686d9" font-size="22" text-anchor="middle" font-weight="400">50 mm</text><text x="718" y="641" fill="#d99431" font-size="15" text-anchor="start" font-weight="400">40</text><text x="691" y="697" fill="#d99431" font-size="15" text-anchor="middle" font-weight="400">30</text><text x="980" y="320" fill="#172a3a" font-size="23" text-anchor="start" font-weight="400">一个 marker，三种方向</text><text x="980" y="372" fill="#596e81" font-size="18" text-anchor="start" font-weight="400">水平尺寸 / 120 mm</text><text x="980" y="416" fill="#596e81" font-size="18" text-anchor="start" font-weight="400">竖直尺寸 / 80 mm</text><text x="980" y="460" fill="#596e81" font-size="18" text-anchor="start" font-weight="400">斜边尺寸 / 50 mm</text><text x="980" y="524" fill="#172a3a" font-size="22" text-anchor="start" font-weight="400">30² + 40² = 50²</text><text x="980" y="584" fill="#596e81" font-size="17" text-anchor="start" font-weight="400">两端共用 dimension-arrow</text><text x="980" y="628" fill="#3686d9" font-size="18" text-anchor="start" font-weight="400">起点：沿路径反向</text><text x="980" y="672" fill="#3686d9" font-size="18" text-anchor="start" font-weight="400">终点：沿路径正向</text><text x="72" y="815" fill="#596e81" font-size="17" text-anchor="start" font-weight="400">蓝色为尺寸线，灰色为尺寸界线；箭头指向测量端点，不表示运动或服务调用。</text><line x1="72" y1="845" x2="1328" y2="845" stroke="#d7e0e9"/><text x="72" y="877" fill="#596e81" font-size="15" text-anchor="start" font-weight="400">虚构零件 · 单位 mm · 演示尺寸关系与 SVG 箭头方向，非制造图纸</text><text x="1328" y="877" fill="#596e81" font-size="14" text-anchor="end" font-weight="400">SVG-PROMPT</text></svg>
