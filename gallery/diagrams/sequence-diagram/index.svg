<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">流式请求时序图</title><desc id="desc">请求、返回与超时分支分别表示；关闭连接不等于取消后台计算。概念结构示意 · 不代表完整生产部署或真实运行状态</desc><defs><marker id="arrow-call" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3686d9"/></marker><marker id="arrow-event" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d99431"/></marker><marker id="arrow-data" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00a887"/></marker><marker id="arrow-control" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bc637d"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8093a6"/></marker></defs><rect width="1400" height="900" fill="#f3f5f7"/><text x="72" y="55" fill="#596e81" font-size="14" text-anchor="start" font-weight="400">SVG / SYSTEM ATLAS</text><line x1="72" y1="73" x2="1328" y2="73" stroke="#d7e0e9"/><text x="72" y="122" fill="#172a3a" font-size="34" text-anchor="start" font-weight="700">流式请求时序图</text><text x="72" y="160" fill="#596e81" font-size="18" text-anchor="start" font-weight="400">客户端 / API / 检索 / 模型；时间从上往下</text><rect x="72" y="183" width="1256" height="51" rx="5" fill="#e6edf3"/><text x="92" y="215" fill="#172a3a" font-size="18" text-anchor="start" font-weight="600">请求、返回与超时分支分别表示；关闭连接不等于取消后台计算</text><line x1="200" y1="350" x2="200" y2="784" stroke="#d7e0e9" stroke-dasharray="5 5"/><line x1="530" y1="350" x2="530" y2="784" stroke="#d7e0e9" stroke-dasharray="5 5"/><line x1="860" y1="350" x2="860" y2="784" stroke="#d7e0e9" stroke-dasharray="5 5"/><line x1="1190" y1="350" x2="1190" y2="784" stroke="#d7e0e9" stroke-dasharray="5 5"/><rect x="80" y="510" width="1240" height="269" rx="12" fill="none" stroke="#8093a6" stroke-dasharray="6 5" stroke-opacity="0.65"/><text x="98" y="538" fill="#8093a6" font-size="17" text-anchor="start" font-weight="600">alt · 生成成功 / 超时失败</text><line x1="80" y1="697" x2="1320" y2="697" stroke="#d7e0e9" stroke-dasharray="5 5"/><polyline id="edge-1" data-edge="edge-1" data-source="client" data-target="api" data-source-port="r" data-target-port="l" data-guard="" data-route="custom" points="200,388 530,388" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-call)"/><polyline id="edge-2" data-edge="edge-2" data-source="api" data-target="retrieval" data-source-port="r" data-target-port="l" data-guard="" data-route="custom" points="530,435 860,435" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-call)"/><polyline id="edge-3" data-edge="edge-3" data-source="retrieval" data-target="api" data-source-port="r" data-target-port="l" data-guard="" data-route="custom" points="860,482 530,482" fill="none" stroke="#8093a6" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-neutral)" stroke-dasharray="6 5"/><polyline id="edge-4" data-edge="edge-4" data-source="api" data-target="model" data-source-port="r" data-target-port="l" data-guard="成功" data-route="custom" points="530,565 1190,565" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-call)"/><polyline id="edge-5" data-edge="edge-5" data-source="model" data-target="api" data-source-port="r" data-target-port="l" data-guard="成功" data-route="custom" points="1190,616 530,616" fill="none" stroke="#d99431" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-event)" stroke-dasharray="6 5"/><polyline id="edge-6" data-edge="edge-6" data-source="api" data-target="client" data-source-port="r" data-target-port="l" data-guard="成功" data-route="custom" points="530,663 200,663" fill="none" stroke="#d99431" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-event)" stroke-dasharray="6 5"/><polyline id="edge-7" data-edge="edge-7" data-source="api" data-target="client" data-source-port="r" data-target-port="l" data-guard="超时" data-route="custom" points="530,747 200,747" fill="none" stroke="#bc637d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-control)" stroke-dasharray="6 5"/><g id="node-client" data-node="client" data-kind="box" data-terminal="false" data-start="false" data-box="105,280,190,70"><rect x="105" y="280" width="190" height="70" rx="8" fill="#ffffff" stroke="#3686d9" stroke-width="1.6"/><text x="200.0" y="322.0" fill="#172a3a" font-size="19" text-anchor="middle" font-weight="600">客户端</text></g><g id="node-api" data-node="api" data-kind="box" data-terminal="false" data-start="false" data-box="435,280,190,70"><rect x="435" y="280" width="190" height="70" rx="8" fill="#ffffff" stroke="#3686d9" stroke-width="1.6"/><text x="530.0" y="322.0" fill="#172a3a" font-size="19" text-anchor="middle" font-weight="600">API 服务</text></g><g id="node-retrieval" data-node="retrieval" data-kind="box" data-terminal="false" data-start="false" data-box="765,280,190,70"><rect x="765" y="280" width="190" height="70" rx="8" fill="#ffffff" stroke="#3686d9" stroke-width="1.6"/><text x="860.0" y="322.0" fill="#172a3a" font-size="19" text-anchor="middle" font-weight="600">检索服务</text></g><g id="node-model" data-node="model" data-kind="box" data-terminal="false" data-start="false" data-box="1095,280,190,70"><rect x="1095" y="280" width="190" height="70" rx="8" fill="#ffffff" stroke="#3686d9" stroke-width="1.6"/><text x="1190.0" y="322.0" fill="#172a3a" font-size="19" text-anchor="middle" font-weight="600">模型服务</text></g><text x="365.0" y="375" fill="#3686d9" font-size="15" text-anchor="middle" font-weight="400">1 发起请求</text><text x="695.0" y="422" fill="#3686d9" font-size="15" text-anchor="middle" font-weight="400">2 检索证据</text><text x="695.0" y="469" fill="#8093a6" font-size="15" text-anchor="middle" font-weight="400">3 返回证据</text><text x="860.0" y="552" fill="#3686d9" font-size="15" text-anchor="middle" font-weight="400">4 生成请求</text><text x="860.0" y="603" fill="#d99431" font-size="15" text-anchor="middle" font-weight="400">5 token 流</text><text x="365.0" y="650" fill="#d99431" font-size="15" text-anchor="middle" font-weight="400">6 SSE 回传</text><text x="365.0" y="734" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">超时：错误事件 + 关闭连接</text><text x="120" y="730" fill="#bc637d" font-size="15" text-anchor="start" font-weight="400">[超时]</text><text x="700" y="819" fill="#172a3a" font-size="16" text-anchor="middle" font-weight="400">纵向间隔为排版，不表示实际耗时；取消模型计算需额外取消协议。</text><line x1="72" y1="845" x2="1328" y2="845" stroke="#d7e0e9"/><text x="72" y="877" fill="#596e81" font-size="15" text-anchor="start" font-weight="400">概念结构示意 · 不代表完整生产部署或真实运行状态</text><text x="1328" y="877" fill="#596e81" font-size="14" text-anchor="end" font-weight="400">SVG-PROMPT</text></svg>
