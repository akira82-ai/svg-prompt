<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">有校验与失败出口的数据管线</title><desc id="desc">无效输入进入隔离区；消费失败有限重试，耗尽后进入死信队列。概念结构示意 · 不代表完整生产部署或真实运行状态</desc><defs><marker id="arrow-call" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3686d9"/></marker><marker id="arrow-event" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d99431"/></marker><marker id="arrow-data" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00a887"/></marker><marker id="arrow-control" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bc637d"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8093a6"/></marker></defs><style>.flow{stroke-dasharray:7 17;animation:flow 2.8s linear infinite}@keyframes flow{to{stroke-dashoffset:-48}}.event-focus{animation:focus 6s infinite}@keyframes focus{0%,100%{stroke-width:2}35%,55%{stroke-width:7}}@media(prefers-reduced-motion:reduce){.flow{animation:none;display:none}.event-focus{animation:none;stroke-width:2}}</style><rect width="1400" height="900" fill="#0d1724"/><text x="72" y="55" fill="#a5b6c9" font-size="14" text-anchor="start" font-weight="400">SVG / SYSTEM ATLAS</text><line x1="72" y1="73" x2="1328" y2="73" stroke="#2d4155"/><text x="72" y="122" fill="#edf3fa" font-size="34" text-anchor="start" font-weight="700">有校验与失败出口的数据管线</text><text x="72" y="160" fill="#a5b6c9" font-size="18" text-anchor="start" font-weight="400">输入 → Schema 校验 → 转换 → 存储 → 消费</text><rect x="72" y="183" width="1256" height="51" rx="5" fill="#172c40"/><text x="92" y="215" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="600">无效输入进入隔离区；消费失败有限重试，耗尽后进入死信队列</text><polyline id="edge-1" data-edge="edge-1" data-source="ingest" data-target="schema" data-source-port="r" data-target-port="l" data-guard="" data-route="ports" points="280,450 330,450" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-call)"/><path class="flow" data-animated-edge="edge-1" d="M 280 450 L 330 450" fill="none" stroke="#3686d9" stroke-width="4"/><polyline id="edge-2" data-edge="edge-2" data-source="schema" data-target="transform" data-source-port="r" data-target-port="l" data-guard="通过" data-route="ports" points="530,450 580,450" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-call)"/><path class="flow" data-animated-edge="edge-2" d="M 530 450 L 580 450" fill="none" stroke="#3686d9" stroke-width="4"/><polyline id="edge-3" data-edge="edge-3" data-source="transform" data-target="store" data-source-port="r" data-target-port="l" data-guard="通过" data-route="ports" points="780,450 830,450" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-call)"/><path class="flow" data-animated-edge="edge-3" d="M 780 450 L 830 450" fill="none" stroke="#3686d9" stroke-width="4"/><polyline id="edge-4" data-edge="edge-4" data-source="store" data-target="consumer" data-source-port="r" data-target-port="l" data-guard="" data-route="ports" points="1030,450 1080,450" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-call)"/><path class="flow" data-animated-edge="edge-4" d="M 1030 450 L 1080 450" fill="none" stroke="#3686d9" stroke-width="4"/><polyline id="edge-5" data-edge="edge-5" data-source="schema" data-target="quarantine" data-source-port="b" data-target-port="t" data-guard="schema invalid" data-route="ports" points="430,500 430,650" fill="none" stroke="#bc637d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-control)" stroke-dasharray="6 5"/><polyline id="edge-6" data-edge="edge-6" data-source="transform" data-target="quarantine" data-source-port="b" data-target-port="r" data-guard="transform failed" data-route="ports" points="680,500 680,690 530,690" fill="none" stroke="#bc637d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-control)" stroke-dasharray="6 5"/><polyline id="edge-7" data-edge="edge-7" data-source="consumer" data-target="retry" data-source-port="b" data-target-port="t" data-guard="consumer failed" data-route="ports" points="1180,500 1180,580 920,580 920,650" fill="none" stroke="#bc637d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-control)" stroke-dasharray="6 5"/><polyline id="edge-8" data-edge="edge-8" data-source="retry" data-target="consumer" data-source-port="r" data-target-port="l" data-guard="retry&lt;3" data-route="ports" points="1020,690 1050,690 1050,450 1080,450" fill="none" stroke="#bc637d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-control)" stroke-dasharray="6 5"/><polyline id="edge-9" data-edge="edge-9" data-source="retry" data-target="dead" data-source-port="r" data-target-port="l" data-guard="retry&gt;=3" data-route="ports" points="1020,690 1080,690" fill="none" stroke="#bc637d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-control)" stroke-dasharray="6 5"/><g id="node-ingest" data-node="ingest" data-kind="box" data-terminal="false" data-start="true" data-box="80,400,200,100"><rect x="80" y="400" width="200" height="100" rx="8" fill="#182b3f" stroke="#3686d9" stroke-width="1.6"/><text x="180.0" y="438" fill="#edf3fa" font-size="19" text-anchor="middle" font-weight="600">采集输入</text><text x="180.0" y="465" fill="#a5b6c9" font-size="16" text-anchor="middle" font-weight="400">来源 / 事件 ID</text></g><g id="node-schema" data-node="schema" data-kind="box" data-terminal="false" data-start="false" data-box="330,400,200,100"><rect x="330" y="400" width="200" height="100" rx="8" fill="#182b3f" stroke="#3686d9" stroke-width="1.6"/><text x="430.0" y="438" fill="#edf3fa" font-size="19" text-anchor="middle" font-weight="600">Schema 校验</text><text x="430.0" y="465" fill="#a5b6c9" font-size="16" text-anchor="middle" font-weight="400">字段与类型</text></g><g id="node-transform" data-node="transform" data-kind="box" data-terminal="false" data-start="false" data-box="580,400,200,100"><rect x="580" y="400" width="200" height="100" rx="8" fill="#182b3f" stroke="#3686d9" stroke-width="1.6"/><text x="680.0" y="438" fill="#edf3fa" font-size="19" text-anchor="middle" font-weight="600">转换规范</text><text x="680.0" y="465" fill="#a5b6c9" font-size="16" text-anchor="middle" font-weight="400">格式 / 单位</text></g><g id="node-store" data-node="store" data-kind="box" data-terminal="false" data-start="false" data-box="830,400,200,100"><rect x="830" y="400" width="200" height="100" rx="8" fill="#182b3f" stroke="#3686d9" stroke-width="1.6"/><text x="930.0" y="438" fill="#edf3fa" font-size="19" text-anchor="middle" font-weight="600">幂等存储</text><text x="930.0" y="465" fill="#a5b6c9" font-size="16" text-anchor="middle" font-weight="400">事件 ID 去重</text></g><g id="node-consumer" data-node="consumer" data-kind="box" data-terminal="false" data-start="false" data-box="1080,400,200,100"><rect x="1080" y="400" width="200" height="100" rx="8" fill="#182b3f" stroke="#3686d9" stroke-width="1.6"/><text x="1180.0" y="438" fill="#edf3fa" font-size="19" text-anchor="middle" font-weight="600">下游消费</text><text x="1180.0" y="465" fill="#a5b6c9" font-size="16" text-anchor="middle" font-weight="400">确认 / checkpoint</text></g><g id="node-quarantine" data-node="quarantine" data-kind="box" data-terminal="true" data-start="false" data-box="330,650,200,80"><rect x="330" y="650" width="200" height="80" rx="8" fill="#182b3f" stroke="#bc637d" stroke-width="1.6"/><text x="430.0" y="681" fill="#edf3fa" font-size="19" text-anchor="middle" font-weight="600">隔离区</text><text x="430.0" y="708" fill="#a5b6c9" font-size="16" text-anchor="middle" font-weight="400">原始输入与原因</text></g><g id="node-retry" data-node="retry" data-kind="box" data-terminal="false" data-start="false" data-box="820,650,200,80"><rect x="820" y="650" width="200" height="80" rx="8" fill="#182b3f" stroke="#bc637d" stroke-width="1.6"/><text x="920.0" y="681" fill="#edf3fa" font-size="19" text-anchor="middle" font-weight="600">退避重试</text><text x="920.0" y="708" fill="#a5b6c9" font-size="16" text-anchor="middle" font-weight="400">最多 3 次</text></g><g id="node-dead" data-node="dead" data-kind="box" data-terminal="true" data-start="false" data-box="1080,650,200,80"><rect x="1080" y="650" width="200" height="80" rx="8" fill="#182b3f" stroke="#bc637d" stroke-width="1.6"/><text x="1180.0" y="681" fill="#edf3fa" font-size="19" text-anchor="middle" font-weight="600">死信队列</text><text x="1180.0" y="708" fill="#a5b6c9" font-size="16" text-anchor="middle" font-weight="400">保留最后错误</text></g><text x="486" y="585" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">校验失败</text><text x="705" y="595" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">转换失败</text><text x="1060" y="564" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">消费失败</text><text x="998" y="620" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">重试 &lt; 3</text><text x="1050" y="719" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">≥ 3</text><text x="700" y="803" fill="#edf3fa" font-size="16" text-anchor="middle" font-weight="400">幂等写入不自动等于端到端“恰好一次”；隔离与死信都需要可追溯的错误信息。</text><line x1="72" y1="845" x2="1328" y2="845" stroke="#2d4155"/><text x="72" y="877" fill="#a5b6c9" font-size="15" text-anchor="start" font-weight="400">概念结构示意 · 不代表完整生产部署或真实运行状态</text><text x="1328" y="877" fill="#a5b6c9" font-size="14" text-anchor="end" font-weight="400">SVG-PROMPT</text></svg>
