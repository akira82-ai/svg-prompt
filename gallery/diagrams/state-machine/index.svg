<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">异步任务状态机</title><desc id="desc">成功、失败、取消都是终态；重试有明确预算与条件。概念结构示意 · 不代表完整生产部署或真实运行状态</desc><defs><marker id="arrow-call" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3686d9"/></marker><marker id="arrow-event" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d99431"/></marker><marker id="arrow-data" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00a887"/></marker><marker id="arrow-control" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bc637d"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8093a6"/></marker></defs><rect width="1400" height="900" fill="#f3f5f7"/><text x="72" y="55" fill="#596e81" font-size="14" text-anchor="start" font-weight="400">SVG / SYSTEM ATLAS</text><line x1="72" y1="73" x2="1328" y2="73" stroke="#d7e0e9"/><text x="72" y="122" fill="#172a3a" font-size="34" text-anchor="start" font-weight="700">异步任务状态机</text><text x="72" y="160" fill="#596e81" font-size="18" text-anchor="start" font-weight="400">排队、执行、退避与终态；最多 3 次尝试</text><rect x="72" y="183" width="1256" height="51" rx="5" fill="#e6edf3"/><text x="92" y="215" fill="#172a3a" font-size="18" text-anchor="start" font-weight="600">成功、失败、取消都是终态；重试有明确预算与条件</text><polyline id="edge-1" data-edge="edge-1" data-source="pending" data-target="running" data-source-port="r" data-target-port="l" data-guard="" data-route="ports" points="320,375 490,375" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-call)"/><polyline id="edge-2" data-edge="edge-2" data-source="running" data-target="success" data-source-port="r" data-target-port="l" data-guard="success" data-route="ports" points="710,375 840,375 840,330 960,330" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-call)"/><polyline id="edge-3" data-edge="edge-3" data-source="running" data-target="failed" data-source-port="r" data-target-port="l" data-guard="failure and attempt&gt;=3" data-route="ports" points="710,375 840,375 840,530 960,530" fill="none" stroke="#bc637d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-control)" stroke-dasharray="6 5"/><polyline id="edge-4" data-edge="edge-4" data-source="running" data-target="retry" data-source-port="b" data-target-port="t" data-guard="failure and attempt&lt;3" data-route="ports" points="600,415 600,620" fill="none" stroke="#bc637d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-control)" stroke-dasharray="6 5"/><polyline id="edge-5" data-edge="edge-5" data-source="retry" data-target="running" data-source-port="r" data-target-port="r" data-guard="backoff complete" data-route="ports" points="710,660 775,660 775,375 710,375" fill="none" stroke="#bc637d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-control)" stroke-dasharray="6 5"/><polyline id="edge-6" data-edge="edge-6" data-source="pending" data-target="cancelled" data-source-port="b" data-target-port="t" data-guard="cancel" data-route="ports" points="210,415 210,620" fill="none" stroke="#bc637d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-control)" stroke-dasharray="6 5"/><polyline id="edge-7" data-edge="edge-7" data-source="running" data-target="cancelled" data-source-port="l" data-target-port="r" data-guard="cancel acknowledged" data-route="ports" points="490,375 380,375 380,660 320,660" fill="none" stroke="#bc637d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-control)" stroke-dasharray="6 5"/><polyline id="edge-8" data-edge="edge-8" data-source="retry" data-target="cancelled" data-source-port="l" data-target-port="r" data-guard="cancel" data-route="ports" points="490,660 320,660" fill="none" stroke="#bc637d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-control)" stroke-dasharray="6 5"/><g id="node-pending" data-node="pending" data-kind="box" data-terminal="false" data-start="true" data-box="100,335,220,80"><rect x="100" y="335" width="220" height="80" rx="8" fill="#ffffff" stroke="#3686d9" stroke-width="1.6"/><text x="210.0" y="366" fill="#172a3a" font-size="22" text-anchor="middle" font-weight="600">排队中</text><text x="210.0" y="393" fill="#596e81" font-size="16" text-anchor="middle" font-weight="400">等待调度</text></g><g id="node-running" data-node="running" data-kind="box" data-terminal="false" data-start="false" data-box="490,335,220,80"><rect x="490" y="335" width="220" height="80" rx="8" fill="#ffffff" stroke="#3686d9" stroke-width="1.6"/><text x="600.0" y="366" fill="#172a3a" font-size="22" text-anchor="middle" font-weight="600">执行中</text><text x="600.0" y="393" fill="#596e81" font-size="16" text-anchor="middle" font-weight="400">失败包含校验失败</text></g><g id="node-success" data-node="success" data-kind="box" data-terminal="true" data-start="false" data-box="960,290,220,80"><rect x="960" y="290" width="220" height="80" rx="8" fill="#ffffff" stroke="#00a887" stroke-width="1.6"/><text x="1070.0" y="321" fill="#172a3a" font-size="22" text-anchor="middle" font-weight="600">成功</text><text x="1070.0" y="348" fill="#596e81" font-size="16" text-anchor="middle" font-weight="400">结果通过校验</text></g><g id="node-failed" data-node="failed" data-kind="box" data-terminal="true" data-start="false" data-box="960,490,220,80"><rect x="960" y="490" width="220" height="80" rx="8" fill="#ffffff" stroke="#bc637d" stroke-width="1.6"/><text x="1070.0" y="521" fill="#172a3a" font-size="22" text-anchor="middle" font-weight="600">失败</text><text x="1070.0" y="548" fill="#596e81" font-size="16" text-anchor="middle" font-weight="400">保留最后错误</text></g><g id="node-retry" data-node="retry" data-kind="box" data-terminal="false" data-start="false" data-box="490,620,220,80"><rect x="490" y="620" width="220" height="80" rx="8" fill="#ffffff" stroke="#3686d9" stroke-width="1.6"/><text x="600.0" y="651" fill="#172a3a" font-size="22" text-anchor="middle" font-weight="600">退避等待</text><text x="600.0" y="678" fill="#596e81" font-size="16" text-anchor="middle" font-weight="400">准备下一次尝试</text></g><g id="node-cancelled" data-node="cancelled" data-kind="box" data-terminal="true" data-start="false" data-box="100,620,220,80"><rect x="100" y="620" width="220" height="80" rx="8" fill="#ffffff" stroke="#bc637d" stroke-width="1.6"/><text x="210.0" y="651" fill="#172a3a" font-size="22" text-anchor="middle" font-weight="600">已取消</text><text x="210.0" y="678" fill="#596e81" font-size="16" text-anchor="middle" font-weight="400">任务已停止</text></g><text x="405" y="360" fill="#3686d9" font-size="15" text-anchor="middle" font-weight="400">调度成功</text><text x="875" y="313" fill="#3686d9" font-size="15" text-anchor="middle" font-weight="400">输出有效</text><text x="914" y="590" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">失败且 attempt ≥ 3</text><text x="710" y="535" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">失败且 attempt &lt; 3</text><text x="952" y="725" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">退避结束 · attempt + 1</text><text x="270" y="540" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">取消请求</text><text x="320" y="596" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">收到取消且任务已停止</text><text x="405" y="642" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">取消</text><text x="700" y="817" fill="#172a3a" font-size="16" text-anchor="middle" font-weight="400">attempt 从 1 开始；终态不再接受执行转换；取消完成须由执行方确认。</text><line x1="72" y1="845" x2="1328" y2="845" stroke="#d7e0e9"/><text x="72" y="877" fill="#596e81" font-size="15" text-anchor="start" font-weight="400">概念结构示意 · 不代表完整生产部署或真实运行状态</text><text x="1328" y="877" fill="#596e81" font-size="14" text-anchor="end" font-weight="400">SVG-PROMPT</text></svg>
