<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">交付流程 · 动态路径</title><desc id="desc">每一步有明确输入与输出；验证不通过时返回生成。概念结构示意 · 不代表完整生产部署或真实运行状态</desc><defs><marker id="arrow-call" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3686d9"/></marker><marker id="arrow-event" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d99431"/></marker><marker id="arrow-data" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00a887"/></marker><marker id="arrow-control" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bc637d"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8093a6"/></marker></defs><style>.flow{stroke-dasharray:7 17;animation:flow 2.8s linear infinite}@keyframes flow{to{stroke-dashoffset:-48}}.event-focus{animation:focus 6s infinite}@keyframes focus{0%,100%{stroke-width:2}35%,55%{stroke-width:7}}@media(prefers-reduced-motion:reduce){.flow{animation:none;display:none}.event-focus{animation:none;stroke-width:2}}</style><rect width="1400" height="900" fill="#f3f5f7"/><text x="72" y="55" fill="#596e81" font-size="14" text-anchor="start" font-weight="400">SVG / SYSTEM ATLAS</text><line x1="72" y1="73" x2="1328" y2="73" stroke="#d7e0e9"/><text x="72" y="122" fill="#172a3a" font-size="34" text-anchor="start" font-weight="700">交付流程 · 动态路径</text><text x="72" y="160" fill="#596e81" font-size="18" text-anchor="start" font-weight="400">需求 → 生成 → 验证 → 归档</text><rect x="72" y="183" width="1256" height="51" rx="5" fill="#e6edf3"/><text x="92" y="215" fill="#172a3a" font-size="18" text-anchor="start" font-weight="600">每一步有明确输入与输出；验证不通过时返回生成</text><polyline id="edge-1" data-edge="edge-1" data-source="request" data-target="generate" data-source-port="r" data-target-port="l" data-guard="" data-route="ports" points="330,450 400,450" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-call)"/><path class="flow" data-animated-edge="edge-1" d="M 330 450 L 400 450" fill="none" stroke="#3686d9" stroke-width="4"/><polyline id="edge-2" data-edge="edge-2" data-source="generate" data-target="validate" data-source-port="r" data-target-port="l" data-guard="" data-route="ports" points="630,450 700,450" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-call)"/><path class="flow" data-animated-edge="edge-2" d="M 630 450 L 700 450" fill="none" stroke="#3686d9" stroke-width="4"/><polyline id="edge-3" data-edge="edge-3" data-source="validate" data-target="archive" data-source-port="r" data-target-port="l" data-guard="验收通过" data-route="ports" points="930,450 1000,450" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-call)"/><path class="flow" data-animated-edge="edge-3" d="M 930 450 L 1000 450" fill="none" stroke="#3686d9" stroke-width="4"/><polyline id="edge-4" data-edge="edge-4" data-source="validate" data-target="generate" data-source-port="b" data-target-port="b" data-guard="验收不通过" data-route="ports" points="815,535 815,675 515,675 515,535" fill="none" stroke="#bc637d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-control)" stroke-dasharray="6 5"/><g id="node-request" data-node="request" data-kind="box" data-terminal="false" data-start="true" data-box="100,365,230,170"><rect x="100" y="365" width="230" height="170" rx="8" fill="#ffffff" stroke="#3686d9" stroke-width="1.6"/><text x="215.0" y="403" fill="#172a3a" font-size="22" text-anchor="middle" font-weight="600">01 需求定义</text><text x="215.0" y="430" fill="#596e81" font-size="16" text-anchor="middle" font-weight="400">输入：目标与约束</text><text x="215.0" y="454" fill="#596e81" font-size="16" text-anchor="middle" font-weight="400">输出：验收清单</text></g><g id="node-generate" data-node="generate" data-kind="box" data-terminal="false" data-start="false" data-box="400,365,230,170"><rect x="400" y="365" width="230" height="170" rx="8" fill="#ffffff" stroke="#3686d9" stroke-width="1.6"/><text x="515.0" y="403" fill="#172a3a" font-size="22" text-anchor="middle" font-weight="600">02 生成作品</text><text x="515.0" y="430" fill="#596e81" font-size="16" text-anchor="middle" font-weight="400">输入：清单与提示词</text><text x="515.0" y="454" fill="#596e81" font-size="16" text-anchor="middle" font-weight="400">输出：SVG 初稿</text></g><g id="node-validate" data-node="validate" data-kind="box" data-terminal="false" data-start="false" data-box="700,365,230,170"><rect x="700" y="365" width="230" height="170" rx="8" fill="#ffffff" stroke="#3686d9" stroke-width="1.6"/><text x="815.0" y="403" fill="#172a3a" font-size="22" text-anchor="middle" font-weight="600">03 验证结果</text><text x="815.0" y="430" fill="#596e81" font-size="16" text-anchor="middle" font-weight="400">输入：初稿与清单</text><text x="815.0" y="454" fill="#596e81" font-size="16" text-anchor="middle" font-weight="400">输出：差异或通过</text></g><g id="node-archive" data-node="archive" data-kind="box" data-terminal="true" data-start="false" data-box="1000,365,230,170"><rect x="1000" y="365" width="230" height="170" rx="8" fill="#ffffff" stroke="#3686d9" stroke-width="1.6"/><text x="1115.0" y="403" fill="#172a3a" font-size="22" text-anchor="middle" font-weight="600">04 归档交付</text><text x="1115.0" y="430" fill="#596e81" font-size="16" text-anchor="middle" font-weight="400">输入：已通过作品</text><text x="1115.0" y="454" fill="#596e81" font-size="16" text-anchor="middle" font-weight="400">输出：三件套与版本</text></g><text x="965" y="438" fill="#3686d9" font-size="15" text-anchor="middle" font-weight="400">通过</text><text x="665" y="654" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">未通过：携带差异清单返回</text><text x="700" y="787" fill="#172a3a" font-size="16" text-anchor="middle" font-weight="400">步骤编号是执行顺序；返回路径表达修正，不代表无限自动重试。</text><line x1="72" y1="845" x2="1328" y2="845" stroke="#d7e0e9"/><text x="72" y="877" fill="#596e81" font-size="15" text-anchor="start" font-weight="400">概念结构示意 · 不代表完整生产部署或真实运行状态</text><text x="1328" y="877" fill="#596e81" font-size="14" text-anchor="end" font-weight="400">SVG-PROMPT</text></svg>
