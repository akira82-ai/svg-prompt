xt x="210.0" y="546.0" fill="#edf3fa" font-size="22" text-anchor="middle" font-weight="600">结果通过？</text><text x="210.0" y="573.0" fill="#a5b6c9" font-size="16" text-anchor="middle" font-weight="400">核对验收条件</text></g><g id="node-output" data-node="output" data-kind="pill" data-terminal="true" data-start="false" data-box="100,700,220,70"><rect x="100" y="700" width="220" height="70" rx="35.0" fill="#182b3f" stroke="#00a887" stroke-width="1.6"/><text x="210.0" y="742.0" fill="#edf3fa" font-size="22" text-anchor="middle" font-weight="600">交付结果</text></g><g id="node-stop" data-node="stop" data-kind="pill" data-terminal="true" data-start="false" data-box="900,700,220,70"><rect x="900" y="700" width="220" height="70" rx="35.0" fill="#182b3f" stroke="#bc637d" stroke-width="1.6"/><text x="1010.0" y="742.0" fill="#edf3fa" font-size="22" text-anchor="middle" font-weight="600">停止并报告</text></g><text x="410" y="343" fill="#3686d9" font-size="15" text-anchor="middle" font-weight="400">需求与约束</text><text x="810" y="343" fill="#3686d9" font-size="15" text-anchor="middle" font-weight="400">拟执行动作</text><text x="1142" y="465" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">已授权但需审批</text><text x="792" y="453" fill="#3686d9" font-size="15" text-anchor="middle" font-weight="400">已授权低风险</text><text x="1197" y="651" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">无权或预算耗尽</text><text x="810" y="531" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">批准</text><text x="1100" y="634" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">拒绝 / 超时</text><text x="410" y="532" fill="#3686d9" font-size="15" text-anchor="middle" font-weight="400">结果或异常</text><text x="258" y="664" fill="#00a887" font-size="15" text-anchor="middle" font-weight="400">通过</text><text x="420" y="433" fill="#bc637d" font-size="15" text-anchor="middle" font-weight="400">未通过且还有预算</text><text x="690" y="789" fill="#bc637d" font-size="15" text-anchor="midd