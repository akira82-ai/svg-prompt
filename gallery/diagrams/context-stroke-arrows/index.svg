<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">服务依赖 · 连线与箭头同色</title><desc id="desc">箭头填充使用 context-stroke，自动采用引用连线的描边颜色。虚构消息关系 · 响应不表示反向依赖 · 非实时运行或完整生产架构</desc><defs><marker id="shared-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="1400" height="900" fill="#0d1724"/><text x="72" y="55" fill="#a5b6c9" font-size="14" text-anchor="start" font-weight="400">SVG / SYSTEM ATLAS</text><line x1="72" y1="73" x2="1328" y2="73" stroke="#2d4155"/><text x="72" y="122" fill="#edf3fa" font-size="34" text-anchor="start" font-weight="700">服务依赖 · 连线与箭头同色</text><text x="72" y="160" fill="#a5b6c9" font-size="18" text-anchor="start" font-weight="400">请求 / 响应 / 异步事件；三种连线共用一个 marker</text><rect x="72" y="183" width="1256" height="51" rx="5" fill="#172c40"/><text x="92" y="215" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="600">箭头填充使用 context-stroke，自动采用引用连线的描边颜色</text><rect x="100" y="740" width="1200" height="70" rx="8" fill="#182b3f"/><polyline id="edge-1" data-edge="edge-1" data-source="client" data-target="service" data-source-port="r" data-target-port="l" data-guard="" data-route="custom" points="320,410 580,410" fill="none" stroke="#3686d9" stroke-width="2" stroke-linejoin="round" marker-end="url(#shared-arrow)"/><polyline id="edge-2" data-edge="edge-2" data-source="service" data-target="client" data-source-port="l" data-target-port="r" data-guard="" data-route="custom" points="580,480 320,480" fill="none" stroke="#00a887" stroke-width="2" stroke-linejoin="round" marker-end="url(#shared-arrow)"/><polyline id="edge-3" data-edge="edge-3" data-source="service" data-target="subscriber" data-source-port="b" data-target-port="b" data-guard="" data-route="ports" points="700,540 700,680 1190,680 1190,540" fill="none" stroke="#d99431" stroke-width="2" stroke-linejoin="round" marker-end="url(#shared-arrow)" stroke-dasharray="6 5"/><g id="node-client" data-node="client" data-kind="box" data-terminal="false" data-start="true" data-box="100,360,220,180"><rect x="100" y="360" width="220" height="180" rx="8" fill="#182b3f" stroke="#3686d9" stroke-width="1.6"/><text x="210.0" y="398" fill="#edf3fa" font-size="22" text-anchor="middle" font-weight="600">客户端</text><text x="210.0" y="425" fill="#a5b6c9" font-size="16" text-anchor="middle" font-weight="400">发起业务请求</text><text x="210.0" y="449" fill="#a5b6c9" font-size="16" text-anchor="middle" font-weight="400">接收响应</text></g><g id="node-service" data-node="service" data-kind="box" data-terminal="false" data-start="false" data-box="580,360,240,180"><rect x="580" y="360" width="240" height="180" rx="8" fill="#182b3f" stroke="#3686d9" stroke-width="1.6"/><text x="700.0" y="398" fill="#edf3fa" font-size="22" text-anchor="middle" font-weight="600">任务服务</text><text x="700.0" y="425" fill="#a5b6c9" font-size="16" text-anchor="middle" font-weight="400">处理请求并返回结果</text><text x="700.0" y="449" fill="#a5b6c9" font-size="16" text-anchor="middle" font-weight="400">发布业务事件</text></g><g id="node-subscriber" data-node="subscriber" data-kind="box" data-terminal="false" data-start="false" data-box="1080,360,220,180"><rect x="1080" y="360" width="220" height="180" rx="8" fill="#182b3f" stroke="#d99431" stroke-width="1.6"/><text x="1190.0" y="398" fill="#edf3fa" font-size="22" text-anchor="middle" font-weight="600">审计订阅方</text><text x="1190.0" y="425" fill="#a5b6c9" font-size="16" text-anchor="middle" font-weight="400">异步接收事件</text><text x="1190.0" y="449" fill="#a5b6c9" font-size="16" text-anchor="middle" font-weight="400">不参与同步响应</text></g><text x="450" y="390" fill="#3686d9" font-size="15" text-anchor="middle" font-weight="400">请求 →</text><text x="450" y="514" fill="#00a887" font-size="15" text-anchor="middle" font-weight="400">← 响应</text><text x="945" y="660" fill="#d99431" font-size="15" text-anchor="middle" font-weight="400">异步事件 →</text><text x="100" y="305" fill="#a5b6c9" font-size="18" text-anchor="start" font-weight="400">01 / 发起方</text><text x="580" y="305" fill="#a5b6c9" font-size="18" text-anchor="start" font-weight="400">02 / 处理方</text><text x="1080" y="305" fill="#a5b6c9" font-size="18" text-anchor="start" font-weight="400">03 / 订阅方</text><text x="125" y="771" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="400">一个定义</text><text x="125" y="796" fill="#a5b6c9" font-size="15" text-anchor="start" font-weight="400">shared-arrow</text><text x="370" y="783" fill="#3686d9" font-size="22" text-anchor="start" font-weight="400">fill=&quot;context-stroke&quot;</text><text x="780" y="771" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="400">颜色来自引用它的连线，而非父组的 color</text><text x="780" y="796" fill="#a5b6c9" font-size="15" text-anchor="start" font-weight="400">线宽一致；事件另用虚线区分，颜色不编码流量。</text><line x1="72" y1="845" x2="1328" y2="845" stroke="#2d4155"/><text x="72" y="877" fill="#a5b6c9" font-size="15" text-anchor="start" font-weight="400">虚构消息关系 · 响应不表示反向依赖 · 非实时运行或完整生产架构</text><text x="1328" y="877" fill="#a5b6c9" font-size="14" text-anchor="end" font-weight="400">SVG-PROMPT</text></svg>
