<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc"><title id="title">权限、相关性与安全的交集</title><desc id="desc">可交付候选 = 已授权 ∩ 相关 ∩ 满足安全条件。概念结构示意 · 不代表完整生产部署或真实运行状态</desc><defs><marker id="arrow-call" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3686d9"/></marker><marker id="arrow-event" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d99431"/></marker><marker id="arrow-data" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00a887"/></marker><marker id="arrow-control" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bc637d"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8093a6"/></marker></defs><rect width="1400" height="900" fill="#f3f5f7"/><text x="72" y="55" fill="#596e81" font-size="14" text-anchor="start" font-weight="400">SVG / SYSTEM ATLAS</text><line x1="72" y1="73" x2="1328" y2="73" stroke="#d7e0e9"/><text x="72" y="122" fill="#172a3a" font-size="34" text-anchor="start" font-weight="700">权限、相关性与安全的交集</text><text x="72" y="160" fill="#596e81" font-size="18" text-anchor="start" font-weight="400">概念集合 / 不表示人数或占比</text><rect x="72" y="183" width="1256" height="51" rx="5" fill="#e6edf3"/><text x="92" y="215" fill="#172a3a" font-size="18" text-anchor="start" font-weight="600">可交付候选 = 已授权 ∩ 相关 ∩ 满足安全条件</text><rect x="120" y="255" width="1150" height="550" rx="12" fill="none" stroke="